<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">전통 보안 테스트와의 차이</title>
  <desc id="d">전통 보안 테스트와 AI 레드팀을 대상, 입력, 결과, 취약점 기준으로 비교한 표.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">전통 보안 테스트와의 차이</text>
  <text class="ssub" x="60" y="154">AI는 입력과 결과가 확률적이고, 모델 행동 결함도 취약점이다</text>
  <rect class="th" x="60" y="200" width="180" height="45.55"/>
  <text class="thtxt" x="74" y="228.95" text-anchor="start">구분</text>
  <rect class="th" x="240" y="200" width="460" height="45.55"/>
  <text class="thtxt" x="254" y="228.95" text-anchor="start">전통 보안 테스트</text>
  <rect class="th" x="700" y="200" width="520" height="45.55"/>
  <text class="thtxt" x="714" y="228.95" text-anchor="start">AI 레드팀</text>
  <rect class="td1" x="60" y="245.55" width="180" height="45.55"/>
  <text class="tdb" x="74" y="274.5" text-anchor="start">대상</text>
  <rect class="td1" x="240" y="245.55" width="460" height="45.55"/>
  <text class="tdtxt" x="254" y="274.5" text-anchor="start">코드, 네트워크, 인프라</text>
  <rect class="td1" x="700" y="245.55" width="520" height="45.55"/>
  <text class="tdtxt" x="714" y="274.5" text-anchor="start">모델, 프롬프트, 데이터, 연동 시스템</text>
  <rect class="td2" x="60" y="291.1" width="180" height="45.55"/>
  <text class="tdb" x="74" y="320.05" text-anchor="start">입력</text>
  <rect class="td2" x="240" y="291.1" width="460" height="45.55"/>
  <text class="tdtxt" x="254" y="320.05" text-anchor="start">정형화된 페이로드</text>
  <rect class="td2" x="700" y="291.1" width="520" height="45.55"/>
  <text class="tdtxt" x="714" y="320.05" text-anchor="start">자연어 등 비정형·확률적 입력</text>
  <rect class="td1" x="60" y="336.65000000000003" width="180" height="45.55"/>
  <text class="tdb" x="74" y="365.6" text-anchor="start">결과</text>
  <rect class="td1" x="240" y="336.65000000000003" width="460" height="45.55"/>
  <text class="tdtxt" x="254" y="365.6" text-anchor="start">대체로 결정적(재현 용이)</text>
  <rect class="td1" x="700" y="336.65000000000003" width="520" height="45.55"/>
  <text class="tdtxt" x="714" y="365.6" text-anchor="start">비결정적(같은 입력도 결과가 달라질 수 있음)</text>
  <rect class="td2" x="60" y="382.20000000000005" width="180" height="45.55"/>
  <text class="tdb" x="74" y="411.15000000000003" text-anchor="start">취약점</text>
  <rect class="td2" x="240" y="382.20000000000005" width="460" height="45.55"/>
  <text class="tdtxt" x="254" y="411.15000000000003" text-anchor="start">구현 결함</text>
  <rect class="td2" x="700" y="382.20000000000005" width="520" height="45.55"/>
  <text class="tdtxt" x="714" y="411.15000000000003" text-anchor="start">구현 결함 + 모델 행동 결함(유해 출력, 편향, 환각 등)</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">3 / 19</text>
</svg>
