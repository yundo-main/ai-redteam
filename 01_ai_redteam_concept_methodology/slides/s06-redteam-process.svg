    <rect class="box" x="312" y="70" width="126" height="130" rx="8"/>
    <text class="num" x="324" y="92">03</text>
    <text class="name" x="375.0" y="111.0" text-anchor="middle">위협</text>
    <text class="name" x="375.0" y="130.0" text-anchor="middle">모델링</text>
    <text class="sub" x="375.0" y="155.0" text-anchor="middle">공격 표면</text>
    <text class="sub" x="375.0" y="171.0" text-anchor="middle">시나리오</text>
    <line class="arrow" x1="438" y1="135" x2="450.0" y2="135.0"/>
    <polygon class="head" points="458,135 450.0,139.0 450.0,131.0"/>
    <rect class="box" x="458" y="70" width="126" height="130" rx="8"/>
    <text class="num" x="470" y="92">04</text>
    <text class="name" x="521.0" y="111.0" text-anchor="middle">공격</text>
    <text class="name" x="521.0" y="130.0" text-anchor="middle">수행</text>
    <text class="sub" x="521.0" y="155.0" text-anchor="middle">적대적</text>
    <text class="sub" x="521.0" y="171.0" text-anchor="middle">프롬프팅</text>
    <line class="arrow" x1="584" y1="135" x2="596.0" y2="135.0"/>
    <polygon class="head" points="604,135 596.0,139.0 596.0,131.0"/>
    <rect class="box" x="604" y="70" width="126" height="130" rx="8"/>
    <text class="num" x="616" y="92">05</text>
    <text class="name" x="667.0" y="111.0" text-anchor="middle">평가·</text>
    <text class="name" x="667.0" y="130.0" text-anchor="middle">점수화</text>
    <text class="sub" x="667.0" y="155.0" text-anchor="middle">ASR ×</text>
    <text class="sub" x="667.0" y="171.0" text-anchor="middle">영향도</text>
    <line class="arrow" x1="730" y1="135" x2="742.0" y2="135.0"/>
    <polygon class="head" points="750,135 742.0,139.0 742.0,131.0"/>
    <rect class="box" x="750" y="70" width="126" height="130" rx="8"/>
    <text class="num" x="762" y="92">06</text>
    <text class="name" x="813.0" y="111.0" text-anchor="middle">보고·</text>
    <text class="name" x="813.0" y="130.0" text-anchor="middle">개선</text>
    <text class="sub" x="813.0" y="155.0" text-anchor="middle">재현 절차</text>
    <text class="sub" x="813.0" y="171.0" text-anchor="middle">완화 방안</text>
    <line class="arrow" x1="876" y1="135" x2="888.0" y2="135.0"/>
    <polygon class="head" points="896,135 888.0,139.0 888.0,131.0"/>
    <rect class="box" x="896" y="70" width="126" height="130" rx="8"/>
    <text class="num" x="908" y="92">07</text>
    <text class="name" x="959.0" y="120.5" text-anchor="middle">재검증</text>
    <text class="sub" x="959.0" y="145.5" text-anchor="middle">조치 후</text>
    <text class="sub" x="959.0" y="161.5" text-anchor="middle">재테스트</text>
    <path class="loop" d="M959 200 V260 H83 V206"/>
    <polygon class="head" points="83,200 79,209 87,209"/>
    <text class="note" x="521" y="284" text-anchor="middle">재검증 후 처음으로: 모델·프롬프트가 바뀔 때마다 반복 (지속적 활동)</text>
    <text class="note" x="20" y="330" text-anchor="start">주황색 단계(ROE)는 모든 공격 수행의 전제 조건이다.</text>
  </g>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">6 / 19</text>
