  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">단계별 수행 내용</text>
  <text class="ssub" x="60" y="154">범위 설정에서 재검증까지 7단계의 산출물</text>
  <rect class="th" x="60" y="195" width="260" height="44.099999999999994"/>
  <text class="thtxt" x="74" y="222.9" text-anchor="start">단계</text>
  <rect class="th" x="320" y="195" width="900" height="44.099999999999994"/>
  <text class="thtxt" x="334" y="222.9" text-anchor="start">내용</text>
  <rect class="td1" x="60" y="239.1" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="267.0" text-anchor="start">01  범위·목표 설정</text>
  <rect class="td1" x="320" y="239.1" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="267.0" text-anchor="start">대상 시스템(모델/앱/에이전트)과 검증 목표(유해 출력, 정보 유출 등)를 정의</text>
  <rect class="td2" x="60" y="283.2" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="311.09999999999997" text-anchor="start">02  ROE 합의</text>
  <rect class="td2" x="320" y="283.2" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="311.09999999999997" text-anchor="start">허용·금지 행위와 중단 조건을 문서화하고 승인</text>
  <rect class="td1" x="60" y="327.29999999999995" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="355.19999999999993" text-anchor="start">03  위협 모델링</text>
  <rect class="td1" x="320" y="327.29999999999995" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="355.19999999999993" text-anchor="start">공격 표면과 공격자 유형을 식별해 시나리오 도출</text>
  <rect class="td2" x="60" y="371.4" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="399.29999999999995" text-anchor="start">04  공격 수행</text>
  <rect class="td2" x="320" y="371.4" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="399.29999999999995" text-anchor="start">적대적 프롬프팅 등 시나리오 실행, 모든 시도와 결과를 기록</text>
  <rect class="td1" x="60" y="415.5" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="443.4" text-anchor="start">05  평가·점수화</text>
  <rect class="td1" x="320" y="415.5" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="443.4" text-anchor="start">성공률·영향도 기반으로 취약점 심각도 산정</text>
  <rect class="td2" x="60" y="459.6" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="487.5" text-anchor="start">06  보고·개선</text>
  <rect class="td2" x="320" y="459.6" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="487.5" text-anchor="start">재현 절차와 완화 방안(가드레일 강화, 권한 최소화 등)을 보고</text>
  <rect class="td1" x="60" y="503.70000000000005" width="260" height="44.099999999999994"/>
  <text class="tdb" x="74" y="531.6" text-anchor="start">07  재검증</text>
  <rect class="td1" x="320" y="503.70000000000005" width="900" height="44.099999999999994"/>
  <text class="tdtxt" x="334" y="531.6" text-anchor="start">조치 후 동일 시나리오로 재테스트하여 개선을 확인</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">7 / 19</text>
</svg>
