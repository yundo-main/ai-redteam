  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">ROE 구성 요소</text>
  <text class="ssub" x="60" y="154">시스템의 안전한 운영을 해치지 않는 범위에서 검증한다</text>
  <rect class="th" x="60" y="195" width="230" height="44.099999999999994"/>
  <text class="thtxt" x="74" y="222.9" text-anchor="start">항목</text>
  <rect class="th" x="290" y="195" width="930" height="44.099999999999994"/>
  <text class="thtxt" x="304" y="222.9" text-anchor="start">예시</text>
  <rect class="td1" x="60" y="239.1" width="230" height="44.099999999999994"/>
  <text class="tdb" x="74" y="267.0" text-anchor="start">범위 (Scope)</text>
  <rect class="td1" x="290" y="239.1" width="930" height="44.099999999999994"/>
  <text class="tdtxt" x="304" y="267.0" text-anchor="start">테스트 대상 모델·API·환경(운영/스테이징)</text>
  <rect class="td2" x="60" y="283.2" width="230" height="44.099999999999994"/>
  <text class="tdb" x="74" y="311.09999999999997" text-anchor="start">허용 행위</text>
  <rect class="td2" x="290" y="283.2" width="930" height="44.099999999999994"/>
  <text class="tdtxt" x="304" y="311.09999999999997" text-anchor="start">프롬프트 인젝션, 탈옥 시도, 정보 추출 시도</text>
  <rect class="td1" x="60" y="327.29999999999995" width="230" height="44.099999999999994"/>
  <text class="tdb" x="74" y="355.19999999999993" text-anchor="start">금지 행위</text>
  <rect class="td1" x="290" y="327.29999999999995" width="930" height="44.099999999999994"/>
  <text class="tdtxt" x="304" y="355.19999999999993" text-anchor="start">서비스 중단(DoS) 유발 금지, PII 무단 유출·보관 금지, 범위 외 시스템 공격 금지</text>
  <rect class="td2" x="60" y="371.4" width="230" height="44.099999999999994"/>
  <text class="tdb" x="74" y="399.29999999999995" text-anchor="start">데이터 취급</text>
  <rect class="td2" x="290" y="371.4" width="930" height="44.099999999999994"/>
  <text class="tdtxt" x="304" y="399.29999999999995" text-anchor="start">획득한 민감 정보의 최소 수집, 보관·폐기 규칙</text>
  <rect class="td1" x="60" y="415.5" width="230" height="44.099999999999994"/>
  <text class="tdb" x="74" y="443.4" text-anchor="start">중단 조건</text>
  <rect class="td1" x="290" y="415.5" width="930" height="44.099999999999994"/>
  <text class="tdtxt" x="304" y="443.4" text-anchor="start">의도치 않은 장애·실제 피해 징후 발생 시 즉시 중단 및 통보</text>
  <rect class="td2" x="60" y="459.6" width="230" height="44.099999999999994"/>
  <text class="tdb" x="74" y="487.5" text-anchor="start">보고 체계</text>
  <rect class="td2" x="290" y="459.6" width="930" height="44.099999999999994"/>
  <text class="tdtxt" x="304" y="487.5" text-anchor="start">연락 창구, 취약점 공유 시점과 방식</text>
  <rect class="box key" x="60" y="525.7" width="1160" height="56" rx="10"/>
  <text class="cname" x="84" y="561.7" text-anchor="start">핵심 원칙: 시스템의 안전한 운영을 해치지 않는 범위에서 검증한다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">8 / 19</text>
</svg>
