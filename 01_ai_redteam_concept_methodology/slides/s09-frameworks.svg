<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">위협 분류 체계와 프레임워크</title>
  <desc id="d">OWASP LLM Top 10, MITRE ATLAS, NIST AI RMF의 역할 비교.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">위협 분류 체계와 프레임워크</text>
  <text class="ssub" x="60" y="154">위험 목록, 공격 절차, 관리 체계를 함께 쓴다</text>
  <rect class="box key" x="60" y="200" width="370" height="340" rx="10"/>
  <text class="tag" x="78" y="228" text-anchor="start">무엇이 위험한가</text>
  <text class="cname" x="78" y="258.0" text-anchor="start">OWASP LLM Top 10</text>
  <text class="bsm" x="78" y="292.0" text-anchor="start">LLM 애플리케이션의 주요 위험</text>
  <text class="bsm" x="78" y="320.275" text-anchor="start">10가지(2025). 시나리오 설계와</text>
  <text class="bsm" x="78" y="348.55" text-anchor="start">보고에서 공통 언어로 쓴다.</text>
  <rect class="box" x="455" y="200" width="370" height="340" rx="10"/>
  <text class="tag" x="473" y="228" text-anchor="start">공격이 어떻게 진행되는가</text>
  <text class="cname" x="473" y="258.0" text-anchor="start">MITRE ATLAS</text>
  <text class="bsm" x="473" y="292.0" text-anchor="start">AI/ML 시스템에 대한 공격 전술과</text>
  <text class="bsm" x="473" y="320.275" text-anchor="start">기법 지식베이스(ATT&amp;CK 구조).</text>
  <text class="bsm" x="473" y="348.55" text-anchor="start">정찰, 초기 접근, 실행, 방어 회피,</text>
  <text class="bsm" x="473" y="376.825" text-anchor="start">유출, 영향 등 단계별 기법과 실제</text>
  <text class="bsm" x="473" y="405.1" text-anchor="start">사례를 포함한다.</text>
  <rect class="box ok" x="850" y="200" width="370" height="340" rx="10"/>
  <text class="tag" x="868" y="228" text-anchor="start">조직이 어떻게 관리하는가</text>
  <text class="cname" x="868" y="258.0" text-anchor="start">NIST AI RMF</text>
  <text class="bsm" x="868" y="292.0" text-anchor="start">조직 차원의 AI 위험 관리</text>
  <text class="bsm" x="868" y="320.275" text-anchor="start">프레임워크. Govern, Map, Measure,</text>
  <text class="bsm" x="868" y="348.55" text-anchor="start">Manage 네 기능으로 구성되며</text>
  <text class="bsm" x="868" y="376.825" text-anchor="start">레드팀은 주로 Measure 단계의</text>
  <text class="bsm" x="868" y="405.1" text-anchor="start">검증이다.</text>
  <text class="bsm" x="60" y="585.0" text-anchor="start">전술·기법 수는 버전마다 달라지므로 MITRE ATLAS의 최신 내용은 공식 사이트에서 확인한다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">9 / 19</text>
</svg>
