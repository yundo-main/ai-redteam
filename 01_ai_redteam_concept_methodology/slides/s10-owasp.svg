<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">OWASP Top 10 for LLM Applications</title>
  <desc id="d">OWASP LLM Top 10 2025의 LLM01부터 LLM10까지 위험 목록과 핵심 내용.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">OWASP Top 10 for LLM Applications</text>
  <text class="ssub" x="60" y="154">2025판 위험 10가지</text>
  <rect class="box" x="60" y="195" width="575" height="82" rx="10"/>
  <text class="tag" x="76" y="227" text-anchor="start">LLM01</text>
  <text class="cname" x="140" y="227" text-anchor="start">Prompt Injection</text>
  <text class="bsm" x="76" y="257" text-anchor="start">입력(직접/간접)으로 모델 지시·행동을 조작</text>
  <rect class="box" x="60" y="289" width="575" height="82" rx="10"/>
  <text class="tag" x="76" y="321" text-anchor="start">LLM02</text>
  <text class="cname" x="140" y="321" text-anchor="start">Sensitive Information Disclosure</text>
  <text class="bsm" x="76" y="351" text-anchor="start">민감 정보·PII·기밀이 출력에 노출</text>
  <rect class="box" x="60" y="383" width="575" height="82" rx="10"/>
  <text class="tag" x="76" y="415" text-anchor="start">LLM03</text>
  <text class="cname" x="140" y="415" text-anchor="start">Supply Chain</text>
  <text class="bsm" x="76" y="445" text-anchor="start">외부 모델·데이터·라이브러리의 오염</text>
  <rect class="box" x="60" y="477" width="575" height="82" rx="10"/>
  <text class="tag" x="76" y="509" text-anchor="start">LLM04</text>
  <text class="cname" x="140" y="509" text-anchor="start">Data and Model Poisoning</text>
  <text class="bsm" x="76" y="539" text-anchor="start">학습·미세조정·임베딩 데이터 오염</text>
  <rect class="box" x="60" y="571" width="575" height="82" rx="10"/>
  <text class="tag" x="76" y="603" text-anchor="start">LLM05</text>
  <text class="cname" x="140" y="603" text-anchor="start">Improper Output Handling</text>
  <text class="bsm" x="76" y="633" text-anchor="start">모델 출력을 검증 없이 후속 시스템에 전달</text>
  <rect class="box" x="645" y="195" width="575" height="82" rx="10"/>
  <text class="tag" x="661" y="227" text-anchor="start">LLM06</text>
  <text class="cname" x="725" y="227" text-anchor="start">Excessive Agency</text>
  <text class="bsm" x="661" y="257" text-anchor="start">모델/에이전트에 과도한 기능·권한 부여</text>
  <rect class="box" x="645" y="289" width="575" height="82" rx="10"/>
  <text class="tag" x="661" y="321" text-anchor="start">LLM07</text>
  <text class="cname" x="725" y="321" text-anchor="start">System Prompt Leakage</text>
  <text class="bsm" x="661" y="351" text-anchor="start">시스템 프롬프트 내 민감 정보·로직 노출</text>
  <rect class="box" x="645" y="383" width="575" height="82" rx="10"/>
  <text class="tag" x="661" y="415" text-anchor="start">LLM08</text>
  <text class="cname" x="725" y="415" text-anchor="start">Vector and Embedding Weaknesses</text>
  <text class="bsm" x="661" y="445" text-anchor="start">RAG·벡터 저장소의 취약점</text>
  <rect class="box" x="645" y="477" width="575" height="82" rx="10"/>
  <text class="tag" x="661" y="509" text-anchor="start">LLM09</text>
  <text class="cname" x="725" y="509" text-anchor="start">Misinformation</text>
  <text class="bsm" x="661" y="539" text-anchor="start">환각 등 잘못된 정보 생성과 과신</text>
  <rect class="box" x="645" y="571" width="575" height="82" rx="10"/>
  <text class="tag" x="661" y="603" text-anchor="start">LLM10</text>
  <text class="cname" x="725" y="603" text-anchor="start">Unbounded Consumption</text>
  <text class="bsm" x="661" y="633" text-anchor="start">과도한 자원 사용(DoS 확장, 비용 폭증 포함)</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">10 / 19</text>
</svg>
