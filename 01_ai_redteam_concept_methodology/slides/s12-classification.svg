<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">레드팀의 분류</title>
  <desc id="d">모델/시스템 레벨, 수동/자동화, 레드·블루·퍼플팀 분류.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">레드팀의 분류</text>
  <text class="ssub" x="60" y="154">대상 수준, 수행 방식, 팀 구성</text>
  <text class="cname" x="60" y="215" text-anchor="start">대상 수준</text>
  <rect class="box" x="60" y="235.0" width="370" height="185.5" rx="10"/>
  <text class="cname" x="78" y="271.0" text-anchor="start">모델 레벨</text>
  <text class="bsm" x="78" y="305.0" text-anchor="start">모델 자체의 안전성(유해 출력, 편향, 탈옥</text>
  <text class="bsm" x="78" y="328.925" text-anchor="start">저항성)을 평가한다.</text>
  <rect class="box" x="60" y="434.5" width="370" height="185.5" rx="10"/>
  <text class="cname" x="78" y="470.5" text-anchor="start">시스템 레벨</text>
  <text class="bsm" x="78" y="504.5" text-anchor="start">모델에 프롬프트, RAG, 도구, 권한,</text>
  <text class="bsm" x="78" y="528.425" text-anchor="start">인프라가 결합된 서비스 전체를 평가한다.</text>
  <text class="bsm" x="78" y="552.35" text-anchor="start">실제 피해는 대개 여기서 발생한다.</text>
  <text class="cname" x="455" y="215" text-anchor="start">수행 방식</text>
  <rect class="box" x="455" y="235.0" width="370" height="185.5" rx="10"/>
  <text class="cname" x="473" y="271.0" text-anchor="start">수동 (전문가)</text>
  <text class="bsm" x="473" y="305.0" text-anchor="start">창의적·맥락 의존적 공격을 발견한다. 비용과</text>
  <text class="bsm" x="473" y="328.925" text-anchor="start">시간이 들고 확장성이 낮다.</text>
  <rect class="box" x="455" y="434.5" width="370" height="185.5" rx="10"/>
  <text class="cname" x="473" y="470.5" text-anchor="start">자동화 (도구·모델)</text>
  <text class="bsm" x="473" y="504.5" text-anchor="start">대량·반복 테스트와 회귀 검증에 유리하다.</text>
  <text class="bsm" x="473" y="528.425" text-anchor="start">새로운 유형의 공격 발견에는 약하다.</text>
  <text class="cname" x="850" y="215" text-anchor="start">팀 구성</text>
  <rect class="box" x="850" y="235.0" width="370" height="119.0" rx="10"/>
  <text class="cname" x="868" y="271.0" text-anchor="start">레드팀</text>
  <text class="bsm" x="868" y="305.0" text-anchor="start">공격자 역할로 취약점을 탐색한다.</text>
  <rect class="box" x="850" y="368.0" width="370" height="119.0" rx="10"/>
  <text class="cname" x="868" y="404.0" text-anchor="start">블루팀</text>
  <text class="bsm" x="868" y="438.0" text-anchor="start">방어·탐지·대응을 담당한다.</text>
  <rect class="box" x="850" y="501.0" width="370" height="119.0" rx="10"/>
  <text class="cname" x="868" y="537.0" text-anchor="start">퍼플팀</text>
  <text class="bsm" x="868" y="571.0" text-anchor="start">두 팀이 결과를 공유하며 방어를 함께</text>
  <text class="bsm" x="868" y="594.925" text-anchor="start">개선한다.</text>
  <text class="bsm" x="60" y="652.0" text-anchor="start">수동과 자동화 두 방식을 병행하는 것이 일반적이다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">12 / 19</text>
</svg>
