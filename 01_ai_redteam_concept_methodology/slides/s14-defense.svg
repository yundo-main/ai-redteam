<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">방어 원칙</title>
  <desc id="d">심층 방어, 최소 권한, 신뢰 경계 분리, 출력 비신뢰, 지속 모니터링.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">방어 원칙</text>
  <text class="ssub" x="60" y="154">레드팀 결과를 개선으로 연결하는 다섯 가지 원칙</text>
  <rect class="box ok" x="60" y="200" width="1160" height="80" rx="10"/>
  <circle class="circg" cx="104" cy="240" r="20"/>
  <text class="circt" x="104" y="246" text-anchor="middle">1</text>
  <text class="cname" x="150" y="234" text-anchor="start">심층 방어</text>
  <text class="bsm" x="150" y="262" text-anchor="start">단일 가드레일에 의존하지 않고 입력 필터, 시스템 프롬프트, 출력 검증, 모니터링을 다층으로 구성한다.</text>
  <rect class="box ok" x="60" y="292" width="1160" height="80" rx="10"/>
  <circle class="circg" cx="104" cy="332" r="20"/>
  <text class="circt" x="104" y="338" text-anchor="middle">2</text>
  <text class="cname" x="150" y="326" text-anchor="start">최소 권한</text>
  <text class="bsm" x="150" y="354" text-anchor="start">모델과 에이전트에 필요한 도구와 데이터 접근만 부여한다.</text>
  <rect class="box ok" x="60" y="384" width="1160" height="80" rx="10"/>
  <circle class="circg" cx="104" cy="424" r="20"/>
  <text class="circt" x="104" y="430" text-anchor="middle">3</text>
  <text class="cname" x="150" y="418" text-anchor="start">신뢰 경계 분리</text>
  <text class="bsm" x="150" y="446" text-anchor="start">외부 데이터는 비신뢰 입력으로 취급하고 지시와 데이터를 구분한다.</text>
  <rect class="box ok" x="60" y="476" width="1160" height="80" rx="10"/>
  <circle class="circg" cx="104" cy="516" r="20"/>
  <text class="circt" x="104" y="522" text-anchor="middle">4</text>
  <text class="cname" x="150" y="510" text-anchor="start">출력 비신뢰</text>
  <text class="bsm" x="150" y="538" text-anchor="start">모델 출력도 검증한 뒤 후속 시스템에 전달한다.</text>
  <rect class="box ok" x="60" y="568" width="1160" height="80" rx="10"/>
  <circle class="circg" cx="104" cy="608" r="20"/>
  <text class="circt" x="104" y="614" text-anchor="middle">5</text>
  <text class="cname" x="150" y="602" text-anchor="start">지속 모니터링</text>
  <text class="bsm" x="150" y="630" text-anchor="start">모델·프롬프트가 바뀔 때마다 회귀 테스트를 수행한다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1 · 개요 · 상세는 6-3, 6-4, 6-7</text>
  <text class="foot" x="1220" y="694" text-anchor="end">14 / 19</text>
</svg>
