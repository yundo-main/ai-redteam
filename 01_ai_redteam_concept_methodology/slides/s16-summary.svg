<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">요약</title>
  <desc id="d">AI 레드팀 개념, 공격 표면, 분류 체계, 시스템 레벨 위험, 점수화, ROE와 7단계 절차의 요약.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">요약</text>
  <text class="ssub" x="60" y="154">여섯 가지 핵심 정리</text>
  <rect class="box" x="60" y="200" width="1160" height="64" rx="10"/>
  <circle class="circ" cx="100" cy="232" r="18"/>
  <text class="circt" x="100" y="238" text-anchor="middle">1</text>
  <text class="body" x="136" y="236" text-anchor="start">AI 레드팀은 적대적 시각으로 추론 한계와 가드레일 우회 가능성을 검증하는 활동이다.</text>
  <rect class="box" x="60" y="275" width="1160" height="64" rx="10"/>
  <circle class="circ" cx="100" cy="307" r="18"/>
  <text class="circt" x="100" y="313" text-anchor="middle">2</text>
  <text class="body" x="136" y="311" text-anchor="start">검증 대상은 공격 표면(인젝션·데이터 유출·API 오용)이고, 수단은 적대적 프롬프팅이다.</text>
  <rect class="box" x="60" y="350" width="1160" height="64" rx="10"/>
  <circle class="circ" cx="100" cy="382" r="18"/>
  <text class="circt" x="100" y="388" text-anchor="middle">3</text>
  <text class="body" x="136" y="386" text-anchor="start">OWASP LLM Top 10, MITRE ATLAS, NIST AI RMF로 위협을 분류하고 공통 언어로 보고한다.</text>
  <rect class="box" x="60" y="425" width="1160" height="64" rx="10"/>
  <circle class="circ" cx="100" cy="457" r="18"/>
  <text class="circt" x="100" y="463" text-anchor="middle">4</text>
  <text class="body" x="136" y="461" text-anchor="start">공격은 추론·학습 단계 전반에 걸치며, 실제 위험은 시스템 레벨에서 커진다.</text>
  <rect class="box" x="60" y="500" width="1160" height="64" rx="10"/>
  <circle class="circ" cx="100" cy="532" r="18"/>
  <text class="circt" x="100" y="538" text-anchor="middle">5</text>
  <text class="body" x="136" y="536" text-anchor="start">결과는 ASR·영향도 기반 취약점 점수화로 우선순위화하여 개선(심층 방어·최소 권한)에 연결한다.</text>
  <rect class="box" x="60" y="575" width="1160" height="64" rx="10"/>
  <circle class="circ" cx="100" cy="607" r="18"/>
  <text class="circt" x="100" y="613" text-anchor="middle">6</text>
  <text class="body" x="136" y="611" text-anchor="start">모든 활동은 ROE 안에서 7단계 절차(범위→ROE→모델링→공격→평가→보고→재검증)로 수행한다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">16 / 19</text>
</svg>
