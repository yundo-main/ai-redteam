  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-1</text>
  <text class="stitle" x="60" y="118">이후 챕터와의 연결</text>
  <text class="ssub" x="60" y="154">이 장은 03~07이 전제로 삼는 기초 이론이다</text>
  <rect class="th" x="60" y="195" width="330" height="44"/>
  <text class="thtxt" x="74" y="222.20000000000002" text-anchor="start">이 장의 개념</text>
  <rect class="th" x="390" y="195" width="190" height="44"/>
  <text class="thtxt" x="404" y="222.20000000000002" text-anchor="start">쓰이는 챕터</text>
  <rect class="th" x="580" y="195" width="640" height="44"/>
  <text class="thtxt" x="594" y="222.20000000000002" text-anchor="start">어떻게 쓰이는가</text>
  <rect class="td1" x="60" y="239" width="330" height="44"/>
  <text class="tdb" x="74" y="266.2" text-anchor="start">7단계 수행 절차</text>
  <rect class="td1" x="390" y="239" width="190" height="44"/>
  <text class="tdtxt" x="404" y="266.2" text-anchor="start">6-2 ~ 6-7</text>
  <rect class="td1" x="580" y="239" width="640" height="44"/>
  <text class="tdtxt" x="594" y="266.2" text-anchor="start">②·③은 6-2, ④ 공격 수행은 6-3~6-5, ⑤ 평가는 6-6, ⑥·⑦은 6-7</text>
  <rect class="td2" x="60" y="283" width="330" height="44"/>
  <text class="tdb" x="74" y="310.2" text-anchor="start">ROE</text>
  <rect class="td2" x="390" y="283" width="190" height="44"/>
  <text class="tdtxt" x="404" y="310.2" text-anchor="start">6-3 ~ 6-5</text>
  <rect class="td2" x="580" y="283" width="640" height="44"/>
  <text class="tdtxt" x="594" y="310.2" text-anchor="start">모든 실습의 범위와 금지 행위 기준 (샌드박스, 더미 데이터, 호출량 제한)</text>
  <rect class="td1" x="60" y="327" width="330" height="44"/>
  <text class="tdb" x="74" y="354.2" text-anchor="start">공격 표면</text>
  <rect class="td1" x="390" y="327" width="190" height="44"/>
  <text class="tdtxt" x="404" y="354.2" text-anchor="start">6-2, 6-3, 6-4</text>
  <rect class="td1" x="580" y="327" width="640" height="44"/>
  <text class="tdtxt" x="594" y="354.2" text-anchor="start">시나리오의 공격 벡터 선택, 도구·데이터 유출 경로</text>
  <rect class="td2" x="60" y="371" width="330" height="44"/>
  <text class="tdb" x="74" y="398.2" text-anchor="start">공격 유형 분류</text>
  <rect class="td2" x="390" y="371" width="190" height="44"/>
  <text class="tdtxt" x="404" y="398.2" text-anchor="start">6-3, 6-4</text>
  <rect class="td2" x="580" y="371" width="640" height="44"/>
  <text class="tdtxt" x="594" y="398.2" text-anchor="start">탈옥·도구 오용은 6-3, 간접 인젝션·유출은 6-4에서 상세히 다룸</text>
  <rect class="td1" x="60" y="415" width="330" height="44"/>
  <text class="tdb" x="74" y="442.2" text-anchor="start">위협 분류 체계</text>
  <rect class="td1" x="390" y="415" width="190" height="44"/>
  <text class="tdtxt" x="404" y="442.2" text-anchor="start">6-2, 6-7</text>
  <rect class="td1" x="580" y="415" width="640" height="44"/>
  <text class="tdtxt" x="594" y="442.2" text-anchor="start">시나리오와 발견 사항을 OWASP·ATLAS 항목으로 분류</text>
  <rect class="td2" x="60" y="459" width="330" height="44"/>
  <text class="tdb" x="74" y="486.2" text-anchor="start">점수화·ASR</text>
  <rect class="td2" x="390" y="459" width="190" height="44"/>
  <text class="tdtxt" x="404" y="486.2" text-anchor="start">6-6, 6-7</text>
  <rect class="td2" x="580" y="459" width="640" height="44"/>
  <text class="tdtxt" x="594" y="486.2" text-anchor="start">지표 정의와 측정(6-6), 심각도 평가(6-7)</text>
  <rect class="td1" x="60" y="503" width="330" height="44"/>
  <text class="tdb" x="74" y="530.1999999999999" text-anchor="start">방어 원칙</text>
  <rect class="td1" x="390" y="503" width="190" height="44"/>
  <text class="tdtxt" x="404" y="530.1999999999999" text-anchor="start">6-3, 6-4, 6-7</text>
  <rect class="td1" x="580" y="503" width="640" height="44"/>
  <text class="tdtxt" x="594" y="530.1999999999999" text-anchor="start">통제 지점 설계와 개선안 도출</text>
  <text class="bsm" x="60" y="650.0" text-anchor="start">공격 유형·지표·방어 원칙은 이 장에서 개요만 다루고, 상세는 위 챕터에서 다룬다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-1</text>
  <text class="foot" x="1220" y="694" text-anchor="end">19 / 19</text>
