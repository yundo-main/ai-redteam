  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-2</text>
  <text class="stitle" x="60" y="118">시나리오 설계 절차</text>
  <text class="ssub" x="60" y="154">자산에서 시작해 우선순위화로 끝난다</text>
  <rect class="box" x="60" y="200" width="276" height="200" rx="10"/>
  <text class="tag" x="78" y="228" text-anchor="start">01</text>
  <text class="cname" x="78" y="258.0" text-anchor="start">자산 식별</text>
  <text class="bsm" x="78" y="292.0" text-anchor="start">보호 대상(시스템 프롬프트, RAG</text>
  <text class="bsm" x="78" y="315.2" text-anchor="start">문서, 사용자 데이터, 도구</text>
  <text class="bsm" x="78" y="338.4" text-anchor="start">권한)을 나열</text>
  <rect class="box" x="352" y="200" width="276" height="200" rx="10"/>
  <text class="tag" x="370" y="228" text-anchor="start">02</text>
  <text class="cname" x="370" y="258.0" text-anchor="start">공격 목표 도출</text>
  <text class="bsm" x="370" y="292.0" text-anchor="start">자산별로 기밀성·무결성·가용성</text>
  <text class="bsm" x="370" y="315.2" text-anchor="start">및 안전 정책 위반 관점의 목표</text>
  <text class="bsm" x="370" y="338.4" text-anchor="start">설정</text>
  <rect class="box" x="644" y="200" width="276" height="200" rx="10"/>
  <text class="tag" x="662" y="228" text-anchor="start">03</text>
  <text class="cname" x="662" y="258.0" text-anchor="start">공격자 모델 설정</text>
  <text class="bsm" x="662" y="292.0" text-anchor="start">지식, 접근 수준, 자원을 정의</text>
  <rect class="box" x="936" y="200" width="276" height="200" rx="10"/>
  <text class="tag" x="954" y="228" text-anchor="start">04</text>
  <text class="cname" x="954" y="258.0" text-anchor="start">벡터·기법 선택</text>
  <text class="bsm" x="954" y="292.0" text-anchor="start">공격 표면에서 입력이 들어오는</text>
  <text class="bsm" x="954" y="315.2" text-anchor="start">모든 경로를 대상으로 하고</text>
  <text class="bsm" x="954" y="338.4" text-anchor="start">목표에 맞는 Prompt Attack</text>
  <text class="bsm" x="954" y="361.6" text-anchor="start">기법을 매핑</text>
  <rect class="box" x="60" y="415" width="276" height="200" rx="10"/>
  <text class="tag" x="78" y="443" text-anchor="start">05</text>
  <text class="cname" x="78" y="473.0" text-anchor="start">단계 작성</text>
  <text class="bsm" x="78" y="507.0" text-anchor="start">순서대로 기법과 입력 형태를</text>
  <text class="bsm" x="78" y="530.2" text-anchor="start">기록</text>
  <rect class="box" x="352" y="415" width="276" height="200" rx="10"/>
  <text class="tag" x="370" y="443" text-anchor="start">06</text>
  <text class="cname" x="370" y="473.0" text-anchor="start">성공 조건·증거 정의</text>
  <text class="bsm" x="370" y="507.0" text-anchor="start">판정 기준과 수집할 로그·출력을</text>
  <text class="bsm" x="370" y="530.2" text-anchor="start">정의</text>
  <rect class="box key" x="644" y="415" width="276" height="200" rx="10"/>
  <text class="tag" x="662" y="443" text-anchor="start">07</text>
  <text class="cname" x="662" y="473.0" text-anchor="start">우선순위화</text>
  <text class="bsm" x="662" y="507.0" text-anchor="start">영향도 × 실현 가능성으로 정렬해</text>
  <text class="bsm" x="662" y="530.2" text-anchor="start">한정된 시간에 중요한 것부터</text>
  <text class="bsm" x="662" y="553.4" text-anchor="start">수행</text>
  <rect class="box ok" x="936" y="415" width="276" height="200" rx="10"/>
  <text class="bsm" x="954" y="451.0" text-anchor="start">각 단계 산출물이 다음 단계의</text>
  <text class="bsm" x="954" y="477.1" text-anchor="start">입력이 된다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-2</text>
  <text class="foot" x="1220" y="694" text-anchor="end">5 / 13</text>
</svg>
