  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-2</text>
  <text class="stitle" x="60" y="118">Prompt Attack 기법</text>
  <text class="ssub" x="60" y="154">모델이 지시와 데이터를 구조적으로 구분하지 못한다는 점을 이용한다</text>
  <rect class="th" x="60" y="195" width="250" height="44"/>
  <text class="thtxt" x="74" y="222.36249999999998" text-anchor="start">기법</text>
  <rect class="th" x="310" y="195" width="210" height="44"/>
  <text class="thtxt" x="324" y="222.36249999999998" text-anchor="start">원리</text>
  <rect class="th" x="520" y="195" width="700" height="44"/>
  <text class="thtxt" x="534" y="222.36249999999998" text-anchor="start">설명</text>
  <rect class="td1" x="60" y="239" width="250" height="44"/>
  <text class="tdb" x="74" y="266.3625" text-anchor="start">직접 프롬프트 인젝션</text>
  <rect class="td1" x="310" y="239" width="210" height="44"/>
  <text class="tdtxt" x="324" y="266.3625" text-anchor="start">지시 덮어쓰기</text>
  <rect class="td1" x="520" y="239" width="700" height="44"/>
  <text class="tdtxt" x="534" y="266.3625" text-anchor="start">입력에 새 지시를 삽입해 기존 지시를 무시하게 만듦</text>
  <rect class="td2" x="60" y="283" width="250" height="44"/>
  <text class="tdb" x="74" y="310.3625" text-anchor="start">간접 프롬프트 인젝션</text>
  <rect class="td2" x="310" y="283" width="210" height="44"/>
  <text class="tdtxt" x="324" y="310.3625" text-anchor="start">비신뢰 데이터 경유</text>
  <rect class="td2" x="520" y="283" width="700" height="44"/>
  <text class="tdtxt" x="534" y="310.3625" text-anchor="start">웹·문서·이메일에 숨긴 지시가 RAG·에이전트를 통해 유입</text>
  <rect class="td1" x="60" y="327" width="250" height="44"/>
  <text class="tdb" x="74" y="354.3625" text-anchor="start">다중 세션/멀티턴</text>
  <rect class="td1" x="310" y="327" width="210" height="44"/>
  <text class="tdtxt" x="324" y="354.3625" text-anchor="start">맥락 누적</text>
  <rect class="td1" x="520" y="327" width="700" height="44"/>
  <text class="tdtxt" x="534" y="354.3625" text-anchor="start">여러 턴에 걸쳐 무해해 보이는 요청을 쌓아 점진적으로 경계를 이동</text>
  <rect class="td2" x="60" y="371" width="250" height="44"/>
  <text class="tdb" x="74" y="398.3625" text-anchor="start">구문 경계 교란</text>
  <rect class="td2" x="310" y="371" width="210" height="44"/>
  <text class="tdtxt" x="324" y="398.3625" text-anchor="start">구분자 혼동</text>
  <rect class="td2" x="520" y="371" width="700" height="44"/>
  <text class="tdtxt" x="534" y="398.3625" text-anchor="start">따옴표·태그·마크다운·역할 표지를 위조해 시스템/사용자 영역 경계를 흐림</text>
  <rect class="td1" x="60" y="415" width="250" height="44"/>
  <text class="tdb" x="74" y="442.3625" text-anchor="start">인코딩 변환</text>
  <rect class="td1" x="310" y="415" width="210" height="44"/>
  <text class="tdtxt" x="324" y="442.3625" text-anchor="start">필터 우회</text>
  <rect class="td1" x="520" y="415" width="700" height="44"/>
  <text class="tdtxt" x="534" y="442.3625" text-anchor="start">Base64, 유니코드 변형, 다국어 혼용으로 키워드 기반 탐지를 회피</text>
  <rect class="td2" x="60" y="459" width="250" height="44"/>
  <text class="tdb" x="74" y="486.3625" text-anchor="start">페이로드 분할</text>
  <rect class="td2" x="310" y="459" width="210" height="44"/>
  <text class="tdtxt" x="324" y="486.3625" text-anchor="start">탐지 분산</text>
  <rect class="td2" x="520" y="459" width="700" height="44"/>
  <text class="tdtxt" x="534" y="486.3625" text-anchor="start">요청을 여러 조각으로 나누어 전달하고 모델이 재조합하도록 유도</text>
  <rect class="td1" x="60" y="503" width="250" height="44"/>
  <text class="tdb" x="74" y="530.3625000000001" text-anchor="start">역할극/가정 설정</text>
  <rect class="td1" x="310" y="503" width="210" height="44"/>
  <text class="tdtxt" x="324" y="530.3625000000001" text-anchor="start">정책 맥락 이동</text>
  <rect class="td1" x="520" y="503" width="700" height="44"/>
  <text class="tdtxt" x="534" y="530.3625000000001" text-anchor="start">허구·연구·디버그 모드 등의 맥락으로 정책을 완화시키려는 시도</text>
  <text class="bsm" x="60" y="650" text-anchor="start">기법은 서로 조합된다. 예: 간접 인젝션 + 인코딩 + 멀티턴으로 도구 실행까지 유도.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-2 · 총람 · 심화는 6-3</text>
  <text class="foot" x="1220" y="694" text-anchor="end">6 / 13</text>
</svg>
