<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">공격 연쇄와 통제 지점</title>
  <desc id="d">간접 인젝션에서 시작해 시스템 프롬프트 노출, 도구 권한 파악, 도구 오용, 데이터 외부 전송으로 이어지는 공격 연쇄와 각 단계를 끊는 통제 지점.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90.0" y="60" text-anchor="middle">6-2</text>
  <text class="stitle" x="60" y="118">Exploit Chain: 공격 연쇄와 통제 지점</text>
  <text class="ssub" x="60" y="154">공격 단계마다 끊을 수 있는 통제 지점이 방어 우선순위가 된다</text>
  <g transform="translate(37.7,130) scale(1.115)">
    <rect class="box" x="20" y="70" width="235" height="100" rx="8"/>
    <text class="num" x="32" y="92">01</text>
    <text class="name" x="137.5" y="105.5" text-anchor="middle">간접 인젝션</text>
    <text class="sub" x="137.5" y="130.5" text-anchor="middle">문서에 숨긴 지시</text>
    <text class="sub" x="137.5" y="146.5" text-anchor="middle">가 모델에 유입</text>
    <line class="arrow" x1="255" y1="120" x2="267.0" y2="120.0"/>
    <polygon class="head" points="275,120 267.0,124.0 267.0,116.0"/>
    <line class="arrow" x1="137" y1="170" x2="137.0" y2="198.0"/>
    <polygon class="head" points="137,206 133.0,198.0 141.0,198.0"/>
    <rect class="box ok" x="20" y="206" width="235" height="70" rx="8"/>
    <text class="sub" x="137.5" y="242.0" text-anchor="middle">지시/데이터 분리,</text>
    <text class="sub" x="137.5" y="258.0" text-anchor="middle">입력 정제</text>
    <rect class="box" x="275" y="70" width="235" height="100" rx="8"/>
    <text class="num" x="287" y="92">02</text>
    <text class="name" x="392.5" y="105.5" text-anchor="middle">시스템 프롬프트</text>
    <text class="sub" x="392.5" y="130.5" text-anchor="middle">내부 규칙·도구</text>
    <text class="sub" x="392.5" y="146.5" text-anchor="middle">목록 노출</text>
    <line class="arrow" x1="510" y1="120" x2="522.0" y2="120.0"/>
    <polygon class="head" points="530,120 522.0,124.0 522.0,116.0"/>
    <line class="arrow" x1="392" y1="170" x2="392.0" y2="198.0"/>
    <polygon class="head" points="392,206 388.0,198.0 396.0,198.0"/>
    <rect class="box ok" x="275" y="206" width="235" height="70" rx="8"/>
    <text class="sub" x="392.5" y="242.0" text-anchor="middle">프롬프트에 비밀 제거,</text>
    <text class="sub" x="392.5" y="258.0" text-anchor="middle">출력 검사</text>
    <rect class="box" x="530" y="70" width="235" height="100" rx="8"/>
    <text class="num" x="542" y="92">03</text>
    <text class="name" x="647.5" y="105.5" text-anchor="middle">도구 오용</text>
    <text class="sub" x="647.5" y="130.5" text-anchor="middle">허용되지 않은</text>
    <text class="sub" x="647.5" y="146.5" text-anchor="middle">도구 호출 유도</text>
    <line class="arrow" x1="765" y1="120" x2="777.0" y2="120.0"/>
    <polygon class="head" points="785,120 777.0,124.0 777.0,116.0"/>
    <line class="arrow" x1="647" y1="170" x2="647.0" y2="198.0"/>
    <polygon class="head" points="647,206 643.0,198.0 651.0,198.0"/>
    <rect class="box ok" x="530" y="206" width="235" height="70" rx="8"/>
    <text class="sub" x="647.5" y="242.0" text-anchor="middle">최소 권한,</text>
    <text class="sub" x="647.5" y="258.0" text-anchor="middle">인자 검증·승인</text>
    <rect class="box" x="785" y="70" width="235" height="100" rx="8"/>
    <text class="num" x="797" y="92">04</text>
    <text class="name" x="902.5" y="105.5" text-anchor="middle">데이터 외부 전송</text>
    <text class="sub" x="902.5" y="130.5" text-anchor="middle">민감 정보가 외부</text>
    <text class="sub" x="902.5" y="146.5" text-anchor="middle">서버로 유출</text>
    <line class="arrow" x1="902" y1="170" x2="902.0" y2="198.0"/>
    <polygon class="head" points="902,206 898.0,198.0 906.0,198.0"/>
    <rect class="box ok" x="785" y="206" width="235" height="70" rx="8"/>
    <text class="sub" x="902.5" y="242.0" text-anchor="middle">외부 통신 허용 목록,</text>
    <text class="sub" x="902.5" y="258.0" text-anchor="middle">URL 제한</text>
    <text class="note" x="20" y="305" text-anchor="start">위쪽: 공격 단계 (각 단계 성공률이 곱해져 전체 성공률이 결정됨)   /   아래쪽(초록): 그 단계를 끊는 통제 지점</text>
    <text class="note" x="20" y="326" text-anchor="start">한 단계만 막혀도 체인이 끊기므로, 끊기 쉽고 효과가 큰 지점이 방어 우선순위가 된다.</text>
  </g>
  <text class="foot" x="60" y="694">AI Red Team · 6-2</text>
  <text class="foot" x="1220" y="694" text-anchor="end">7 / 13</text>
</svg>
