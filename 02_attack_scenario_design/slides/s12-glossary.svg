  <rect class="td2" x="60" y="388.0" width="360" height="47.0"/>
  <text class="tdb" x="74" y="418.0" text-anchor="start">Success Metric</text>
  <rect class="td2" x="420" y="388.0" width="800" height="47.0"/>
