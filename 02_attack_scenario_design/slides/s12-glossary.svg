  <rect class="td1" x="60" y="247.0" width="360" height="47.0"/>
  <text class="tdb" x="74" y="277.0" text-anchor="start">Attack Scenario</text>
  <rect class="td1" x="420" y="247.0" width="800" height="47.0"/>
  <text class="tdtxt" x="434" y="277.0" text-anchor="start">공격 목표, 전제 조건, 공격 단계 및 성공 기준을 정의한 시뮬레이션 문서</text>
  <rect class="td2" x="60" y="294.0" width="360" height="47.0"/>
  <text class="tdb" x="74" y="324.0" text-anchor="start">Prompt Attack Vector</text>
  <rect class="td2" x="420" y="294.0" width="800" height="47.0"/>
  <text class="tdtxt" x="434" y="324.0" text-anchor="start">프롬프트 인젝션, 탈옥 등 공격 전달 경로 및 방식</text>
  <rect class="td1" x="60" y="341.0" width="360" height="47.0"/>
  <text class="tdb" x="74" y="371.0" text-anchor="start">Pre-requisite Condition</text>
  <rect class="td1" x="420" y="341.0" width="800" height="47.0"/>
