  <rect class="td1" x="60" y="435.0" width="360" height="47.0"/>
  <text class="tdb" x="74" y="465.0" text-anchor="start">Exploit Chain</text>
  <rect class="td1" x="420" y="435.0" width="800" height="47.0"/>
  <text class="tdtxt" x="434" y="465.0" text-anchor="start">단일 취약점 공격을 연쇄적으로 연결하여 최종 권한을 탈취하는 공격 시퀀스</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-2</text>
  <text class="foot" x="1220" y="694" text-anchor="end">12 / 13</text>
