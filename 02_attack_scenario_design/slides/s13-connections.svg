  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-2</text>
  <text class="stitle" x="60" y="118">이후 챕터와의 연결</text>
  <text class="ssub" x="60" y="154">시나리오는 03~05에서 실행되고 06에서 평가셋이 되며 07에서 발견 사항이 된다</text>
  <rect class="th" x="60" y="195" width="330" height="44"/>
  <text class="thtxt" x="74" y="222.20000000000002" text-anchor="start">이 장의 개념</text>
  <rect class="th" x="390" y="195" width="190" height="44"/>
  <text class="thtxt" x="404" y="222.20000000000002" text-anchor="start">쓰이는 챕터</text>
  <rect class="th" x="580" y="195" width="640" height="44"/>
  <text class="thtxt" x="594" y="222.20000000000002" text-anchor="start">어떻게 쓰이는가</text>
  <rect class="td1" x="60" y="239" width="330" height="44"/>
  <text class="tdb" x="74" y="266.2" text-anchor="start">시나리오 워크시트</text>
  <rect class="td1" x="390" y="239" width="190" height="44"/>
  <text class="tdtxt" x="404" y="266.2" text-anchor="start">6-3, 6-4, 6-5</text>
  <rect class="td1" x="580" y="239" width="640" height="44"/>
  <text class="tdtxt" x="594" y="266.2" text-anchor="start">각 챕터의 대표 시나리오를 워크시트 항목으로 작성 (6-3: TA-01, JB-01)</text>
  <rect class="td2" x="60" y="283" width="330" height="44"/>
  <text class="tdb" x="74" y="310.2" text-anchor="start">성공 조건</text>
  <rect class="td2" x="390" y="283" width="190" height="44"/>
  <text class="tdtxt" x="404" y="310.2" text-anchor="start">6-3, 6-6</text>
  <rect class="td2" x="580" y="283" width="640" height="44"/>
  <text class="tdtxt" x="594" y="310.2" text-anchor="start">판정 근거(실행 로그·응답 내용)와 평가셋 판정 기준</text>
  <rect class="td1" x="60" y="327" width="330" height="44"/>
  <text class="tdb" x="74" y="354.2" text-anchor="start">공격자 모델</text>
  <rect class="td1" x="390" y="327" width="190" height="44"/>
  <text class="tdtxt" x="404" y="354.2" text-anchor="start">6-3, 6-4</text>
  <rect class="td1" x="580" y="327" width="640" height="44"/>
  <text class="tdtxt" x="594" y="354.2" text-anchor="start">같은 기법도 공격자 모델에 따라 위험도가 달라지는 사례</text>
  <rect class="td2" x="60" y="371" width="330" height="44"/>
  <text class="tdb" x="74" y="398.2" text-anchor="start">Prompt Attack 기법</text>
  <rect class="td2" x="390" y="371" width="190" height="44"/>
  <text class="tdtxt" x="404" y="398.2" text-anchor="start">6-3, 6-5</text>
  <rect class="td2" x="580" y="371" width="640" height="44"/>
  <text class="tdtxt" x="594" y="398.2" text-anchor="start">탈옥 유형의 심화(6-3), 자동 스캔 Probe 범주(6-5)</text>
  <rect class="td1" x="60" y="415" width="330" height="44"/>
  <text class="tdb" x="74" y="442.2" text-anchor="start">Exploit Chain</text>
  <rect class="td1" x="390" y="415" width="190" height="44"/>
  <text class="tdtxt" x="404" y="442.2" text-anchor="start">6-4, 6-7</text>
  <rect class="td1" x="580" y="415" width="640" height="44"/>
  <text class="tdtxt" x="594" y="442.2" text-anchor="start">유출 경로의 연쇄(6-4), 합산 영향 평가(6-7)</text>
  <rect class="td2" x="60" y="459" width="330" height="44"/>
  <text class="tdb" x="74" y="486.2" text-anchor="start">통제 지점</text>
  <rect class="td2" x="390" y="459" width="190" height="44"/>
  <text class="tdtxt" x="404" y="486.2" text-anchor="start">6-3, 6-4, 6-7</text>
  <rect class="td2" x="580" y="459" width="640" height="44"/>
  <text class="tdtxt" x="594" y="486.2" text-anchor="start">방어 설계와 개선안</text>
  <rect class="td1" x="60" y="503" width="330" height="44"/>
  <text class="tdb" x="74" y="530.1999999999999" text-anchor="start">워크시트 항목</text>
  <rect class="td1" x="390" y="503" width="190" height="44"/>
  <text class="tdtxt" x="404" y="530.1999999999999" text-anchor="start">6-7</text>
  <rect class="td1" x="580" y="503" width="640" height="44"/>
  <text class="tdtxt" x="594" y="530.1999999999999" text-anchor="start">발견 사항 작성 형식의 기반</text>
  <text class="bsm" x="60" y="650.0" text-anchor="start">Prompt Attack 기법은 이 장에서 총람만 다루고, 탈옥·도구 오용의 심화는 6-3에서 다룬다.</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-2</text>
  <text class="foot" x="1220" y="694" text-anchor="end">13 / 13</text>
