  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Jailbreak: 정의와 원인</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">프롬프트 인젝션은 지시 체계를, 탈옥은 안전 정책 자체를 겨냥한다</text>
  <rect class="box" x="60" y="195" width="560" height="200" rx="10"/>
  <text class="tag" x="78" y="223.0" text-anchor="start">정의</text>
  <text class="cname" x="78" y="253.0" text-anchor="start">안전 정책 자체를 무력화</text>
  <text class="bsm" x="78" y="285.0" text-anchor="start">모델의 안전 정렬(alignment)과 가드레일을 우회해 원래 거부해야 할</text>
  <text class="bsm" x="78" y="309.8" text-anchor="start">응답을 얻어내는 공격.</text>
  <rect class="box key" x="660" y="195" width="560" height="200" rx="10"/>
  <text class="tag" x="678" y="223.0" text-anchor="start">왜 가능한가</text>
  <text class="bsm" x="678" y="253.0" text-anchor="start">· 안전 학습은 확률적 경향이라 모든 표현·맥락을 포괄하지 못한다.</text>
  <text class="bsm" x="678" y="277.8" text-anchor="start">· 유용성과 안전성의 목표 충돌을 공격자가 이용한다.</text>
  <text class="bsm" x="678" y="302.6" text-anchor="start">· 긴 대화에서 초기 지시의 영향이 약해지고, 학습 분포 밖 입력(인코딩,</text>
  <text class="bsm" x="678" y="327.4" text-anchor="start">희귀 언어)에서 안전 행동이 일반화되지 않는다.</text>
  <rect class="box" x="60" y="440" width="560" height="110" rx="10"/>
  <text class="tag" x="78" y="468.0" text-anchor="start">프롬프트 인젝션</text>
  <text class="cname" x="78" y="498.0" text-anchor="start">애플리케이션의 지시 체계 탈취</text>
  <rect class="box key" x="660" y="440" width="560" height="110" rx="10"/>
  <text class="tag" x="678" y="468.0" text-anchor="start">탈옥(Jailbreak)</text>
  <text class="cname" x="678" y="498.0" text-anchor="start">모델의 안전 정책 무력화</text>
  <text class="name" x="640" y="502.0" text-anchor="middle">vs</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">3 / 35</text>
</svg>
