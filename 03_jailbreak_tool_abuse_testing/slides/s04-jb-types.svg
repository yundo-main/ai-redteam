  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Jailbreak 주요 유형</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">모델 안전 학습의 빈틈을 서로 다른 방식으로 찌른다</text>
  <rect class="th" x="60" y="195" width="310" height="44"/>
  <rect class="th" x="370" y="195" width="850" height="44"/>
  <text class="thtxt" x="74" y="223.0" text-anchor="start">유형</text>
  <text class="thtxt" x="384" y="223.0" text-anchor="start">방식</text>
  <rect class="td1" x="60" y="239" width="310" height="44"/>
  <text class="tdb" x="74" y="267.8" text-anchor="start">페르소나/역할극</text>
  <rect class="td1" x="370" y="239" width="850" height="44"/>
  <text class="tdtxt" x="384" y="267.8" text-anchor="start">규칙이 없는 가상 인물·모드를 부여해 "그 인물로서" 답하게 함</text>
  <rect class="td2" x="60" y="283" width="310" height="44"/>
  <text class="tdb" x="74" y="311.8" text-anchor="start">가상 시나리오</text>
  <rect class="td2" x="370" y="283" width="850" height="44"/>
  <text class="tdtxt" x="384" y="311.8" text-anchor="start">소설·연구·게임 등 허구 맥락 속에 요청을 감싸 정책을 완화</text>
  <rect class="td1" x="60" y="327" width="310" height="44"/>
  <text class="tdb" x="74" y="355.8" text-anchor="start">점진적 유도(멀티턴)</text>
  <rect class="td1" x="370" y="327" width="850" height="44"/>
  <text class="tdtxt" x="384" y="355.8" text-anchor="start">무해한 질문에서 시작해 단계적으로 수위를 높임</text>
  <rect class="td2" x="60" y="371" width="310" height="44"/>
  <text class="tdb" x="74" y="399.8" text-anchor="start">다수 예시(Many-shot)</text>
  <rect class="td2" x="370" y="371" width="850" height="44"/>
  <text class="tdtxt" x="384" y="399.8" text-anchor="start">긴 컨텍스트에 규칙 위반 응답 예시를 대량 삽입해 패턴을 모방시킴</text>
  <rect class="td1" x="60" y="415" width="310" height="44"/>
  <text class="tdb" x="74" y="443.8" text-anchor="start">접두어 강요</text>
  <rect class="td1" x="370" y="415" width="850" height="44"/>
  <text class="tdtxt" x="384" y="443.8" text-anchor="start">응답의 첫 문장을 승낙 문구로 시작하도록 지시</text>
  <rect class="td2" x="60" y="459" width="310" height="44"/>
  <text class="tdb" x="74" y="487.8" text-anchor="start">난독화/인코딩</text>
  <rect class="td2" x="370" y="459" width="850" height="44"/>
  <text class="tdtxt" x="384" y="487.8" text-anchor="start">인코딩·다국어·문자 치환으로 필터와 안전 학습 범위를 회피</text>
  <rect class="td1" x="60" y="503" width="310" height="44"/>
  <text class="tdb" x="74" y="531.8" text-anchor="start">목표 충돌 유도</text>
  <rect class="td1" x="370" y="503" width="850" height="44"/>
  <text class="tdtxt" x="384" y="531.8" text-anchor="start">"거절하면 사용자가 피해를 본다" 등으로 유용성과 안전의 균형을 흔듦</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">4 / 35</text>
</svg>
