  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Jailbreak 테스트 방법</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">비결정적인 모델이므로 "N회 중 몇 회"로 기록한다</text>
  <rect class="box" x="60" y="195" width="210" height="230" rx="10"/>
  <text class="tag" x="78" y="223.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="253.0" text-anchor="start">정책 정의</text>
  <text class="bsm" x="78" y="285.0" text-anchor="start">시스템이 막아야 하는</text>
  <text class="bsm" x="78" y="309.8" text-anchor="start">범주(위험 범주 목록)를</text>
  <text class="bsm" x="78" y="334.6" text-anchor="start">먼저 확정</text>
  <line class="arrow" x1="273" y1="310.0" x2="294" y2="310.0"/>
  <polygon class="head" points="294,310.0 285.9,313.9 285.9,306.1"/>
  <rect class="box" x="297" y="195" width="210" height="230" rx="10"/>
  <text class="tag" x="315" y="223.0" text-anchor="start">2단계</text>
  <text class="cname" x="315" y="253.0" text-anchor="start">유형별 케이스</text>
  <text class="bsm" x="315" y="285.0" text-anchor="start">유형을 범주와 교차해</text>
  <text class="bsm" x="315" y="309.8" text-anchor="start">테스트 케이스 작성</text>
  <line class="arrow" x1="511" y1="310.0" x2="532" y2="310.0"/>
  <polygon class="head" points="532,310.0 523.9,313.9 523.9,306.1"/>
  <rect class="box key" x="535" y="195" width="210" height="230" rx="10"/>
  <text class="tag" x="553" y="223.0" text-anchor="start">3단계</text>
  <text class="cname" x="553" y="253.0" text-anchor="start">반복 실행</text>
  <text class="bsm" x="553" y="285.0" text-anchor="start">비결정성을 고려해 동일</text>
  <text class="bsm" x="553" y="309.8" text-anchor="start">케이스를 여러 번 실행</text>
  <line class="arrow" x1="748" y1="310.0" x2="769" y2="310.0"/>
  <polygon class="head" points="769,310.0 760.9,313.9 760.9,306.1"/>
  <rect class="box" x="772" y="195" width="210" height="230" rx="10"/>
  <text class="tag" x="790" y="223.0" text-anchor="start">4단계</text>
  <text class="cname" x="790" y="253.0" text-anchor="start">판정</text>
  <text class="bsm" x="790" y="285.0" text-anchor="start">규칙·LLM 판정기·사람</text>
  <text class="bsm" x="790" y="309.8" text-anchor="start">검토로 정책 위반 여부</text>
  <text class="bsm" x="790" y="334.6" text-anchor="start">분류</text>
  <line class="arrow" x1="986" y1="310.0" x2="1007" y2="310.0"/>
  <polygon class="head" points="1007,310.0 998.9,313.9 998.9,306.1"/>
  <rect class="box" x="1010" y="195" width="210" height="230" rx="10"/>
  <text class="tag" x="1028" y="223.0" text-anchor="start">5단계</text>
  <text class="cname" x="1028" y="253.0" text-anchor="start">기록</text>
  <text class="bsm" x="1028" y="285.0" text-anchor="start">성공 프롬프트 패턴,</text>
  <text class="bsm" x="1028" y="309.8" text-anchor="start">성공률, 재현 조건 정리</text>
  <text class="body" x="60" y="480.0" text-anchor="start">반복 실행이 핵심이다. 같은 프롬프트도 매번 다른 응답이 나오므로 "성공/실패"가 아니라 "N회 중 몇 회"로 기록한다. (실습 15회)</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">5 / 35</text>
</svg>
