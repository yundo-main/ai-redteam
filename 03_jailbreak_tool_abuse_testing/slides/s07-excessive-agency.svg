  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Excessive Agency</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">기능·권한·자율성이 과하면 피해 범위가 커진다</text>
  <rect class="box key" x="60" y="195" width="360" height="300" rx="10"/>
  <text class="tag" x="78" y="223.0" text-anchor="start">요인 1</text>
  <text class="cname" x="78" y="253.0" text-anchor="start">과도한 기능</text>
  <text class="bsm" x="78" y="285.0" text-anchor="start">필요 이상의 도구가 연결됨</text>
  <text class="bsm" x="78" y="309.8" text-anchor="start"></text>
  <text class="bsm" x="78" y="334.6" text-anchor="start">예) 요약만 하는 에이전트에 파일 삭제</text>
  <text class="bsm" x="78" y="359.4" text-anchor="start">도구가 있음</text>
  <rect class="box key" x="460" y="195" width="360" height="300" rx="10"/>
  <text class="tag" x="478" y="223.0" text-anchor="start">요인 2</text>
  <text class="cname" x="478" y="253.0" text-anchor="start">과도한 권한</text>
  <text class="bsm" x="478" y="285.0" text-anchor="start">도구가 필요 이상의 접근 권한을 가짐</text>
  <text class="bsm" x="478" y="309.8" text-anchor="start"></text>
  <text class="bsm" x="478" y="334.6" text-anchor="start">예) 조회용 에이전트가 DB 쓰기 권한 보유</text>
  <rect class="box key" x="860" y="195" width="360" height="300" rx="10"/>
  <text class="tag" x="878" y="223.0" text-anchor="start">요인 3</text>
  <text class="cname" x="878" y="253.0" text-anchor="start">과도한 자율성</text>
  <text class="bsm" x="878" y="285.0" text-anchor="start">고위험 행동이 사람 확인 없이 실행됨</text>
  <text class="bsm" x="878" y="309.8" text-anchor="start"></text>
  <text class="bsm" x="878" y="334.6" text-anchor="start">예) 외부 송금·메일 발송이 자동 승인됨</text>
  <text class="body" x="60" y="545.0" text-anchor="start">OWASP LLM06 Excessive Agency의 세 가지 원인. 공격이 성공한 뒤의 피해 크기는 이 셋이 정한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">7 / 35</text>
</svg>
