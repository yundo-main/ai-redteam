  <text class="bsm" x="78" y="515.0" text-anchor="start">외부 데이터에서 온 지시는 도구 실행 근거로</text>
  <text class="bsm" x="78" y="539.8" text-anchor="start">인정하지 않음</text>
  <rect class="box ok" x="460" y="425" width="360" height="200" rx="10"/>
  <text class="tag" x="478" y="453.0" text-anchor="start">Tool Abuse 방어</text>
