  <text class="bsm" x="478" y="337.8" text-anchor="start">(스키마, 허용 목록, 범위)</text>
  <rect class="box ok" x="860" y="195" width="360" height="200" rx="10"/>
  <text class="tag" x="878" y="223.0" text-anchor="start">Tool Abuse 방어</text>
  <text class="cname" x="878" y="253.0" text-anchor="start">Human-in-the-loop</text>
  <text class="bsm" x="878" y="285.0" text-anchor="start">삭제·송금·외부 전송 같은 고위험 행동은</text>
  <text class="bsm" x="878" y="309.8" text-anchor="start">사람 승인</text>
  <rect class="box ok" x="60" y="425" width="360" height="200" rx="10"/>
  <text class="tag" x="78" y="453.0" text-anchor="start">Tool Abuse 방어</text>
