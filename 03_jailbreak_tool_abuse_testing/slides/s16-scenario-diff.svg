  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">두 시나리오의 차이</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">무엇을 보고 성공을 판정하는지가 다르다</text>
  <rect class="th" x="60" y="195" width="200" height="44"/>
  <rect class="th" x="260" y="195" width="480" height="44"/>
  <rect class="th" x="740" y="195" width="480" height="44"/>
  <text class="thtxt" x="74" y="223.0" text-anchor="start">구분</text>
  <text class="thtxt" x="274" y="223.0" text-anchor="start">Tool Abuse (TA-01)</text>
  <text class="thtxt" x="754" y="223.0" text-anchor="start">Jailbreak (JB-01)</text>
  <rect class="td1" x="60" y="239" width="200" height="44"/>
  <text class="tdb" x="74" y="267.8" text-anchor="start">성공 판정의 근거</text>
  <rect class="td1" x="260" y="239" width="480" height="44"/>
  <text class="tdtxt" x="274" y="267.8" text-anchor="start">응답이 아니라 실행 로그</text>
  <rect class="td1" x="740" y="239" width="480" height="44"/>
  <text class="tdtxt" x="754" y="267.8" text-anchor="start">응답 내용</text>
  <rect class="td2" x="60" y="283" width="200" height="44"/>
  <text class="tdb" x="74" y="311.8" text-anchor="start">전제 조건과 벡터</text>
  <rect class="td2" x="260" y="283" width="480" height="44"/>
  <text class="tdtxt" x="274" y="311.8" text-anchor="start">도구 연결과 권한 구조에 좌우</text>
  <rect class="td2" x="740" y="283" width="480" height="44"/>
  <text class="tdtxt" x="754" y="311.8" text-anchor="start">대화 이력과 필터 구성에 좌우</text>
  <rect class="td1" x="60" y="327" width="200" height="44"/>
  <text class="tdb" x="74" y="355.8" text-anchor="start">통제 지점</text>
  <rect class="td1" x="260" y="327" width="480" height="44"/>
  <text class="tdtxt" x="274" y="355.8" text-anchor="start">권한·인자·승인 같은 구조적 통제</text>
  <rect class="td1" x="740" y="327" width="480" height="44"/>
  <text class="tdtxt" x="754" y="355.8" text-anchor="start">분류기·탐지·회귀 테스트 같은 모델·필터 통제</text>
  <text class="body" x="60" y="411.0" text-anchor="start">같은 "성공"이라도 무엇을 보고 판정하는지가 다르므로, 하네스도 판정 함수를 따로 둔다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">16 / 35</text>
</svg>
