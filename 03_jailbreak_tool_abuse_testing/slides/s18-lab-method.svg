<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 1 · 방식: 가설 → 실행 → 관찰 → 변형 → 기록</title>
  <desc id="d">실습의 진행 방식 5단계, 변형 실험, 산출물, 안전 규칙.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 1 · 방식: 가설 → 실행 → 관찰 → 변형 → 기록</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">실행만 하지 않고, 예상과 결과의 차이를 설명하는 것이 목표다</text>
  <rect class="box key" x="60" y="190" width="210" height="200" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">가설</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start">results/hypothesis-</text>
  <text class="bsm" x="78" y="304.8" text-anchor="start">ch03.json에 통제</text>
  <text class="bsm" x="78" y="329.6" text-anchor="start">OFF/ON 성공률 예상을</text>
  <text class="bsm" x="78" y="354.4" text-anchor="start">실행 전에 적는다</text>
  <line class="arrow" x1="273" y1="290.0" x2="294" y2="290.0"/>
  <polygon class="head" points="294,290.0 285.9,293.9 285.9,286.1"/>
  <rect class="box" x="297" y="190" width="210" height="200" rx="10"/>
  <text class="tag" x="315" y="218.0" text-anchor="start">2단계</text>
  <text class="cname" x="315" y="248.0" text-anchor="start">실행</text>
  <text class="bsm" x="315" y="280.0" text-anchor="start">LLM(Ollama)을 켜고</text>
  <text class="bsm" x="315" y="304.8" text-anchor="start">하네스로 N회 수집,</text>
  <text class="bsm" x="315" y="329.6" text-anchor="start">OFF/ON을 판정한다</text>
  <line class="arrow" x1="511" y1="290.0" x2="532" y2="290.0"/>
  <polygon class="head" points="532,290.0 523.9,293.9 523.9,286.1"/>
  <rect class="box" x="535" y="190" width="210" height="200" rx="10"/>
  <text class="tag" x="553" y="218.0" text-anchor="start">3단계</text>
  <text class="cname" x="553" y="248.0" text-anchor="start">관찰</text>
  <text class="bsm" x="553" y="280.0" text-anchor="start">응답 원문이 아니라</text>
  <text class="bsm" x="553" y="304.8" text-anchor="start">도구 호출 기록·거부</text>
  <text class="bsm" x="553" y="329.6" text-anchor="start">사유(증거)를 본다</text>
  <line class="arrow" x1="748" y1="290.0" x2="769" y2="290.0"/>
  <polygon class="head" points="769,290.0 760.9,293.9 760.9,286.1"/>
  <rect class="box key" x="772" y="190" width="210" height="200" rx="10"/>
  <text class="tag" x="790" y="218.0" text-anchor="start">4단계</text>
  <text class="cname" x="790" y="248.0" text-anchor="start">변형</text>
  <text class="bsm" x="790" y="280.0" text-anchor="start">조건을 하나만 바꿔</text>
  <text class="bsm" x="790" y="304.8" text-anchor="start">다시 실행하고 차이를</text>
  <text class="bsm" x="790" y="329.6" text-anchor="start">비교한다</text>
  <line class="arrow" x1="986" y1="290.0" x2="1007" y2="290.0"/>
  <polygon class="head" points="1007,290.0 998.9,293.9 998.9,286.1"/>
  <rect class="box" x="1010" y="190" width="210" height="200" rx="10"/>
  <text class="tag" x="1028" y="218.0" text-anchor="start">5단계</text>
  <text class="cname" x="1028" y="248.0" text-anchor="start">기록</text>
  <text class="bsm" x="1028" y="280.0" text-anchor="start">가설 대비 표에서</text>
  <text class="bsm" x="1028" y="304.8" text-anchor="start">빗나간 항목의 이유를</text>
  <text class="bsm" x="1028" y="329.6" text-anchor="start">쓰고 --json으로</text>
  <text class="bsm" x="1028" y="354.4" text-anchor="start">저장한다</text>
  <rect class="box" x="60" y="420" width="360" height="230" rx="10"/>
  <text class="tag" x="78" y="448.0" text-anchor="start">변형 실험 (한 번에 하나만)</text>
  <text class="bsm" x="78" y="478.0" text-anchor="start">· 모델 바꾸기: OLLAMA_MODEL</text>
  <text class="bsm" x="78" y="502.8" text-anchor="start">· 반복 횟수: QUICK=1 대 기본, 구간 폭</text>
  <text class="bsm" x="78" y="527.6" text-anchor="start">비교</text>
  <text class="bsm" x="78" y="552.4" text-anchor="start">· 워크시트 JSON의 문서·대화 내용 수정</text>
  <rect class="box" x="460" y="420" width="360" height="230" rx="10"/>
  <text class="tag" x="478" y="448.0" text-anchor="start">산출물</text>
  <text class="bsm" x="478" y="478.0" text-anchor="start">· 가설 파일</text>
  <text class="bsm" x="478" y="502.8" text-anchor="start">results/hypothesis-ch03.json (실행</text>
  <text class="bsm" x="478" y="527.6" text-anchor="start">전)</text>
  <text class="bsm" x="478" y="552.4" text-anchor="start">· 실행 기록 results/ch03.json (가설과</text>
  <text class="bsm" x="478" y="577.2" text-anchor="start">결과, 6-7 입력)</text>
  <text class="bsm" x="478" y="602.0" text-anchor="start">· 빗나간 항목의 차이와 이유 한 줄</text>
  <rect class="box key" x="860" y="420" width="360" height="230" rx="10"/>
  <text class="tag" x="878" y="448.0" text-anchor="start">안전 규칙 (ROE)</text>
  <text class="bsm" x="878" y="478.0" text-anchor="start">· 로컬 모델과 더미 데이터만 쓴다</text>
  <text class="bsm" x="878" y="502.8" text-anchor="start">· 수신 주소는 더미(example.com 등 예약</text>
  <text class="bsm" x="878" y="527.6" text-anchor="start">도메인)</text>
  <text class="bsm" x="878" y="552.4" text-anchor="start">· 새 공격 페이로드를 만들지 않는다</text>
  <text class="bsm" x="878" y="577.2" text-anchor="start">· 유해 결과물은 보관·유포하지 않는다</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">18 / 35</text>
</svg>
