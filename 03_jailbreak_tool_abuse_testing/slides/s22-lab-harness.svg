  <text class="bsm" x="60" y="546.8" text-anchor="start">시도 i의 seed는 7+i, temperature 0.7, 최대 256토큰. 결과(케이스 2 × 통제 OFF/ON = 4건)는 --json으로 저장된다.</text>
