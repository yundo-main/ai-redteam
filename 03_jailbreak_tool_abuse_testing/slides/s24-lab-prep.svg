<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 6 · 준비 단계 (실행 1~3)</title>
  <desc id="d">방어 모듈·통계 도구 단위 테스트와 Ollama 준비의 명령, 확인 내용, 이유, 실패 시 조치.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 6 · 준비 단계 (실행 1~3)</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">각 단계의 통과 기준을 만족해야 다음으로 넘어간다</text>
  <text class="note" x="60" y="176.0" text-anchor="start">공통 0단계: 저장소 루트에서 .venv 활성화 후 실행 — source .venv/bin/activate (python --version 3.10 이상)</text>
  <circle class="circ" cx="84" cy="221" r="16"/>
  <text class="circt" x="84" y="227.0" text-anchor="middle">1</text>
  <rect class="cmdbg" x="116" y="185" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="216.0" text-anchor="start">python -m unittest -v</text>
  <text class="cmd" x="132" y="238.0" text-anchor="start">  03_jailbreak_tool_abuse_testing/src/test_tool_guard.py</text>
  <text class="bsm" x="776" y="207.0" text-anchor="start">[LLM 불필요] 방어 모듈이 의도대로 막는가</text>
  <circle class="circ" cx="84" cy="305" r="16"/>
  <text class="circt" x="84" y="311.0" text-anchor="middle">2</text>
  <rect class="cmdbg" x="116" y="269" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="300.0" text-anchor="start">python -m unittest -v</text>
  <text class="cmd" x="132" y="322.0" text-anchor="start">  03_jailbreak_tool_abuse_testing/src/test_stats.py</text>
  <text class="bsm" x="776" y="291.0" text-anchor="start">[LLM 불필요] 반복 횟수 기준·Wilson 구간 계산이 맞는가</text>
  <circle class="circ" cx="84" cy="378" r="16"/>
  <text class="circt" x="84" y="384.0" text-anchor="middle">3</text>
  <rect class="cmdbg" x="116" y="353" width="640" height="50" rx="8"/>
  <text class="cmd" x="132" y="384.0" text-anchor="start">Ollama 준비 — 다음 장에서 설치·서버·모델·확인 순서로 진행</text>
  <text class="bsm" x="776" y="375.0" text-anchor="start">[LLM 실행] 서버를 켜고 모델을 받는다 (다음 장 참고)</text>
  <rect class="th" x="60" y="435" width="50" height="44"/>
  <rect class="th" x="110" y="435" width="400" height="44"/>
  <rect class="th" x="510" y="435" width="400" height="44"/>
  <rect class="th" x="910" y="435" width="310" height="44"/>
  <text class="thtxt" x="74" y="463.0" text-anchor="start">순서</text>
  <text class="thtxt" x="124" y="463.0" text-anchor="start">통과 기준 (이렇게 나와야 한다)</text>
  <text class="thtxt" x="524" y="463.0" text-anchor="start">왜 필요한가</text>
  <text class="thtxt" x="924" y="463.0" text-anchor="start">실패하면</text>
  <rect class="td1" x="60" y="479" width="50" height="60.0"/>
  <text class="tdb" x="74" y="504.5" text-anchor="start">1</text>
  <rect class="td1" x="110" y="479" width="400" height="60.0"/>
  <text class="tdtxt" x="124" y="504.5" text-anchor="start">마지막 줄 OK, 'Ran 10 tests', FAIL·ERROR 0건</text>
  <text class="tdtxt" x="124" y="525.5" text-anchor="start">(테스트 수는 코드에 따라 달라질 수 있다)</text>
  <rect class="td1" x="510" y="479" width="400" height="60.0"/>
  <text class="tdtxt" x="524" y="504.5" text-anchor="start">모델 없이 결정적으로 돈다. 이후 ON=0%가 방어</text>
  <text class="tdtxt" x="524" y="525.5" text-anchor="start">때문인지 코드 결함 때문인지 가르는 전제다.</text>
  <rect class="td1" x="910" y="479" width="310" height="60.0"/>
  <text class="tdtxt" x="924" y="504.5" text-anchor="start">여기서 멈추고 코드부터 고친다.</text>
  <rect class="td2" x="60" y="539.0" width="50" height="44"/>
  <text class="tdb" x="74" y="567.0" text-anchor="start">2</text>
  <rect class="td2" x="110" y="539.0" width="400" height="44"/>
  <text class="tdtxt" x="124" y="567.0" text-anchor="start">마지막 줄 OK, 'Ran 9 tests', FAIL·ERROR 0건</text>
  <rect class="td2" x="510" y="539.0" width="400" height="44"/>
  <text class="tdtxt" x="524" y="567.0" text-anchor="start">구간 계산이 틀리면 이후 모든 숫자의 해석이 틀린다.</text>
  <rect class="td2" x="910" y="539.0" width="310" height="44"/>
  <text class="tdtxt" x="924" y="567.0" text-anchor="start">여기서 멈추고 코드부터 고친다.</text>
  <rect class="td1" x="60" y="583.0" width="50" height="60.0"/>
  <text class="tdb" x="74" y="608.5" text-anchor="start">3</text>
  <rect class="td1" x="110" y="583.0" width="400" height="60.0"/>
  <text class="tdtxt" x="124" y="608.5" text-anchor="start">ready()가 (True, '', '모델명')을 돌려준다. 첫</text>
  <text class="tdtxt" x="124" y="629.5" text-anchor="start">값이 False면 사유 문구를 읽고 조치한다 (다음 장)</text>
  <rect class="td1" x="510" y="583.0" width="400" height="60.0"/>
  <text class="tdtxt" x="524" y="608.5" text-anchor="start">이론의 주장은 실제 모델 출력으로만 확인된다. 고정</text>
  <text class="tdtxt" x="524" y="629.5" text-anchor="start">응답(스텁)은 매번 같아 비율이 의미 없다.</text>
  <rect class="td1" x="910" y="583.0" width="310" height="60.0"/>
  <text class="tdtxt" x="924" y="608.5" text-anchor="start">4~5번이 '건너뜀(skipped)'으로</text>
  <text class="tdtxt" x="924" y="629.5" text-anchor="start">끝난다. 건너뜀은 통과가 아니다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">24 / 35</text>
</svg>
