  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 7 · 준비 3 상세: LLM 실행 (Ollama)</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">실행 순서 3~5번은 로컬에서 LLM이 돌고 있어야 한다</text>
  <circle class="circ" cx="84" cy="210" r="16"/>
  <text class="circt" x="84" y="216.0" text-anchor="middle">1</text>
  <rect class="cmdbg" x="116" y="185" width="700" height="50" rx="8"/>
  <text class="cmd" x="132" y="216.0" text-anchor="start">brew install ollama</text>
  <text class="bsm" x="836" y="207.0" text-anchor="start">설치 (macOS). 다른 OS는 ollama.com/download</text>
  <circle class="circ" cx="84" cy="272" r="16"/>
  <text class="circt" x="84" y="278.0" text-anchor="middle">2</text>
  <rect class="cmdbg" x="116" y="247" width="700" height="50" rx="8"/>
  <text class="cmd" x="132" y="278.0" text-anchor="start">ollama serve</text>
  <text class="bsm" x="836" y="269.0" text-anchor="start">서버 실행. 별도 터미널에 계속 켜 둔다 (앱으로</text>
  <text class="bsm" x="836" y="289.0" text-anchor="start">설치했다면 이미 실행 중)</text>
  <circle class="circ" cx="84" cy="334" r="16"/>
  <text class="circt" x="84" y="340.0" text-anchor="middle">3</text>
  <rect class="cmdbg" x="116" y="309" width="700" height="50" rx="8"/>
  <text class="cmd" x="132" y="340.0" text-anchor="start">ollama pull qwen2.5:3b</text>
  <text class="bsm" x="836" y="331.0" text-anchor="start">모델 받기 (약 2GB). 2~4B 급 권장</text>
  <circle class="circ" cx="84" cy="396" r="16"/>
  <text class="circt" x="84" y="402.0" text-anchor="middle">4</text>
  <rect class="cmdbg" x="116" y="371" width="700" height="50" rx="8"/>
  <text class="cmd" x="132" y="402.0" text-anchor="start">python 03_jailbreak_tool_abuse_testing/src/llm.py</text>
  <text class="bsm" x="836" y="393.0" text-anchor="start">저장소 루트에서 확인: (True, '',</text>
  <text class="bsm" x="836" y="413.0" text-anchor="start">'qwen2.5:3b')이면 준비 완료</text>
  <rect class="th" x="60" y="450" width="380" height="44"/>
  <rect class="th" x="440" y="450" width="380" height="44"/>
  <rect class="th" x="820" y="450" width="400" height="44"/>
  <text class="thtxt" x="74" y="478.0" text-anchor="start">메시지·증상</text>
  <text class="thtxt" x="454" y="478.0" text-anchor="start">원인</text>
  <text class="thtxt" x="834" y="478.0" text-anchor="start">조치</text>
  <rect class="td1" x="60" y="494" width="380" height="44"/>
  <text class="tdb" x="74" y="522.4" text-anchor="start">Ollama 서버에 연결할 수 없음</text>
  <rect class="td1" x="440" y="494" width="380" height="44"/>
  <text class="tdtxt" x="454" y="522.4" text-anchor="start">서버가 꺼져 있음</text>
  <rect class="td1" x="820" y="494" width="400" height="44"/>
  <text class="tdtxt" x="834" y="522.4" text-anchor="start">ollama serve</text>
  <rect class="td2" x="60" y="538" width="380" height="44"/>
  <text class="tdb" x="74" y="566.4" text-anchor="start">모델 미설치 · 설치된 모델이 없음</text>
  <rect class="td2" x="440" y="538" width="380" height="44"/>
  <text class="tdtxt" x="454" y="566.4" text-anchor="start">모델을 받지 않음</text>
  <rect class="td2" x="820" y="538" width="400" height="44"/>
  <text class="tdtxt" x="834" y="566.4" text-anchor="start">ollama pull qwen2.5:3b</text>
  <rect class="td1" x="60" y="582" width="380" height="44"/>
  <text class="tdb" x="74" y="610.4" text-anchor="start">TA-01이 0/30으로 나옴</text>
  <rect class="td1" x="440" y="582" width="380" height="44"/>
  <text class="tdtxt" x="454" y="610.4" text-anchor="start">도구 호출 미지원·형식 불이행 모델</text>
  <rect class="td1" x="820" y="582" width="400" height="44"/>
  <text class="tdtxt" x="834" y="610.4" text-anchor="start">qwen2.5:3b, llama3.2:3b로 교체</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">25 / 35</text>
