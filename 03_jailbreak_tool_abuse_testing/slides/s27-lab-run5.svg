  <text class="bsm" x="684" y="501.0" text-anchor="start">않는다.</text>
  <text class="bsm" x="60" y="501.0" text-anchor="start">4번과의 차이: 입력이 코드 상수가 아니라 6-2 워크시트 JSON이다. 문서·대화를</text>
