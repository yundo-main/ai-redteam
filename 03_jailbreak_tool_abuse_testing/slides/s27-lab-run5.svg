  <text class="bsm" x="776" y="207.0" text-anchor="start">[LLM 필요] 6-2 워크시트 JSON을 읽어 같은 수집·평가 함수로</text>
  <text class="bsm" x="776" y="227.0" text-anchor="start">실행</text>
