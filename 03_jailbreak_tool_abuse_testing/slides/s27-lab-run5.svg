  <text class="bsm" x="684" y="313.0" text-anchor="start">4번(하네스)과 비슷한 수치가 나오는가 본다. 같은 seed라 같은 모델이면 거의</text>
  <text class="bsm" x="684" y="335.0" text-anchor="start">같다.</text>
  <circle class="circ" cx="661" cy="377" r="11"/>
  <text class="circt" x="661" y="382.0" text-anchor="middle">2</text>
  <text class="cname" x="684" y="383.0" text-anchor="start">판정 줄</text>
  <text class="bsm" x="684" y="407.0" text-anchor="start">'줄였다'는 구간이 겹치지 않을 때만 나온다. 겹치면 차이를 단정하지 않는다.</text>
  <circle class="circ" cx="661" cy="449" r="11"/>
  <text class="circt" x="661" y="454.0" text-anchor="middle">3</text>
