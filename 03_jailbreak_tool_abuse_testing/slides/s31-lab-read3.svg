  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 13 · 결론으로 쓸 수 있는 문장과 한계</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">증거가 받쳐 주는 말만 쓴다</text>
  <rect class="th" x="60" y="185" width="560" height="44"/>
  <rect class="th" x="620" y="185" width="600" height="44"/>
  <text class="thtxt" x="74" y="213.0" text-anchor="start">쓸 수 있다</text>
  <text class="thtxt" x="634" y="213.0" text-anchor="start">쓸 수 없다</text>
  <rect class="td1" x="60" y="229" width="560" height="62.8"/>
  <text class="tdtxt" x="74" y="255.6" text-anchor="start">TA-01에서 통제 OFF 73%(22/30), ON 0%(0/30, 상한 11%)이며</text>
  <text class="tdtxt" x="74" y="278.0" text-anchor="start">구간이 겹치지 않는다</text>
  <rect class="td1" x="620" y="229" width="600" height="62.8"/>
  <text class="tdtxt" x="634" y="255.6" text-anchor="start">통제 ON에서는 도구 오용이 발생하지 않는다</text>
  <rect class="td2" x="60" y="291.8" width="560" height="62.8"/>
  <text class="tdtxt" x="74" y="318.4" text-anchor="start">JB-01은 OFF 15/15, ON 0/15이고 ON 값은 판정과 분류기가 같은</text>
  <text class="tdtxt" x="74" y="340.8" text-anchor="start">마커를 보는 구조적 값이다</text>
  <rect class="td2" x="620" y="291.8" width="600" height="62.8"/>
  <text class="tdtxt" x="634" y="318.4" text-anchor="start">JB-01은 방어된다</text>
  <rect class="td1" x="60" y="354.6" width="560" height="44"/>
  <text class="tdtxt" x="74" y="383.0" text-anchor="start">사람 승인은 실습 승인자가 항상 승인하므로 시험하지 않았다</text>
  <rect class="td1" x="620" y="354.6" width="600" height="44"/>
  <text class="tdtxt" x="634" y="383.0" text-anchor="start">승인 절차가 검증됐다</text>
  <rect class="box" x="60" y="422.6" width="360" height="180" rx="10"/>
  <text class="tag" x="78" y="450.6" text-anchor="start">한계</text>
  <text class="cname" x="78" y="480.6" text-anchor="start">모델 하나, 실행 한 번</text>
  <text class="bsm" x="78" y="512.6" text-anchor="start">다른 모델(OLLAMA_MODEL)이나 다른</text>
  <text class="bsm" x="78" y="537.4" text-anchor="start">시드에서 같은 구조가 나오는지 봐야</text>
  <text class="bsm" x="78" y="562.2" text-anchor="start">일반화할 수 있다.</text>
  <rect class="box" x="460" y="422.6" width="360" height="180" rx="10"/>
  <text class="tag" x="478" y="450.6" text-anchor="start">한계</text>
  <text class="cname" x="478" y="480.6" text-anchor="start">같은 출력에 OFF/ON 적용</text>
  <text class="bsm" x="478" y="512.6" text-anchor="start">통제 효과만 분리해 본 것이다. 통제가</text>
  <text class="bsm" x="478" y="537.4" text-anchor="start">모델의 다음 행동을 바꾸는 효과는 포함하지</text>
  <text class="bsm" x="478" y="562.2" text-anchor="start">않는다.</text>
  <rect class="box" x="860" y="422.6" width="360" height="180" rx="10"/>
  <text class="tag" x="878" y="450.6" text-anchor="start">한계</text>
  <text class="cname" x="878" y="480.6" text-anchor="start">결과 저장</text>
  <text class="bsm" x="878" y="512.6" text-anchor="start">--json으로 저장하면 가설도 함께 저장되어</text>
  <text class="bsm" x="878" y="537.4" text-anchor="start">6-7 보고서의 입력이 된다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">31 / 35</text>
