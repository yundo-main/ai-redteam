  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">복습 질문</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">스스로 답해 본다</text>
  <circle class="circ" cx="84" cy="209" r="16"/>
  <text class="circt" x="84" y="215.0" text-anchor="middle">1</text>
  <text class="body" x="120" y="216.0" text-anchor="start">프롬프트 인젝션과 Jailbreak의 차이를 한 문장으로 설명하라.</text>
  <circle class="circ" cx="84" cy="281" r="16"/>
  <text class="circt" x="84" y="287.0" text-anchor="middle">2</text>
  <text class="body" x="120" y="288.0" text-anchor="start">Tool Abuse 테스트에서 "모델이 도구를 호출하겠다고 답했다"만으로 성공 판정을 하면 안 되는 이유는?</text>
  <circle class="circ" cx="84" cy="353" r="16"/>
  <text class="circt" x="84" y="359.0" text-anchor="middle">3</text>
  <text class="body" x="120" y="360.0" text-anchor="start">간접 도구 실행을 막기 위해 설계 단계에서 적용할 수 있는 통제는?</text>
  <circle class="circ" cx="84" cy="425" r="16"/>
  <text class="circt" x="84" y="431.0" text-anchor="middle">4</text>
  <text class="body" x="120" y="432.0" text-anchor="start">실습에서 통제 ON 결과가 0/30이었다. "안전하다"고 말할 수 없는 이유는?</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">33 / 35</text>
