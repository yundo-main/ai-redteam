      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-3</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">용어 설명</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">6-3에서 쓰는 용어</text>
  <rect class="th" x="60" y="190" width="300" height="44"/>
  <rect class="th" x="360" y="190" width="860" height="44"/>
  <text class="thtxt" x="74" y="218.0" text-anchor="start">용어</text>
  <text class="thtxt" x="374" y="218.0" text-anchor="start">설명</text>
  <rect class="td1" x="60" y="234" width="300" height="44"/>
  <text class="tdb" x="74" y="262.4" text-anchor="start">Jailbreak Testing</text>
  <rect class="td1" x="360" y="234" width="860" height="44"/>
  <text class="tdtxt" x="374" y="262.4" text-anchor="start">모델의 윤리 및 보안 통제를 우회하는 페르소나/역할극 공격 테스트</text>
  <rect class="td2" x="60" y="278" width="300" height="44"/>
  <text class="tdb" x="74" y="306.4" text-anchor="start">Tool Abuse</text>
  <rect class="td2" x="360" y="278" width="860" height="44"/>
  <text class="tdtxt" x="374" y="306.4" text-anchor="start">에이전트가 연결된 툴(DB 쿼리, API 호출 등)을 악의적으로 오용하도록 유도하는 공격</text>
  <rect class="td1" x="60" y="322" width="300" height="44"/>
  <text class="tdb" x="74" y="350.4" text-anchor="start">Excessive Agency</text>
  <rect class="td1" x="360" y="322" width="860" height="44"/>
  <text class="tdtxt" x="374" y="350.4" text-anchor="start">에이전트에게 필요 이상의 수행 권한이 부여되어 발생하는 취약점</text>
  <rect class="td2" x="60" y="366" width="300" height="44"/>
  <text class="tdb" x="74" y="394.4" text-anchor="start">Indirect Tool Execution</text>
  <rect class="td2" x="360" y="366" width="860" height="44"/>
  <text class="tdtxt" x="374" y="394.4" text-anchor="start">외부 문서에 포함된 악성 지시문으로 에이전트 툴이 무단 실행되는 현상</text>
  <rect class="td1" x="60" y="410" width="300" height="44"/>
  <text class="tdb" x="74" y="438.4" text-anchor="start">Function Calling Sanity Check</text>
  <rect class="td1" x="360" y="410" width="860" height="44"/>
  <text class="tdtxt" x="374" y="438.4" text-anchor="start">에이전트의 툴 호출 인자 및 명령을 실행 전 검증하는 통제 로직</text>
  <rect class="td2" x="60" y="454" width="300" height="44"/>
  <text class="tdb" x="74" y="482.4" text-anchor="start">하네스(Test Harness)</text>
  <rect class="td2" x="360" y="454" width="860" height="44"/>
  <text class="tdtxt" x="374" y="482.4" text-anchor="start">테스트 케이스를 정해진 조건으로 반복 실행하고, 판정 결과와 증거를 기록하는 실행 틀</text>
  <rect class="td1" x="60" y="498" width="300" height="44"/>
  <text class="tdb" x="74" y="526.4" text-anchor="start">Wilson 구간</text>
  <rect class="td1" x="360" y="498" width="860" height="44"/>
  <text class="tdtxt" x="374" y="526.4" text-anchor="start">성공 k/N의 95% 신뢰구간. 0건·N건에서도 0~1 범위를 벗어나지 않아 소표본에 적합</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-3</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">34 / 35</text>
</svg>
