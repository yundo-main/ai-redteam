  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-4</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Data Exfiltration이란</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">모델이 접근 가능한 정보가 곧 유출 후보다</text>
  <text class="body" x="60" y="200.0" text-anchor="start">Data Exfiltration은 시스템 내부의 민감한 지식 데이터나 개인정보를 외부로 무단 유출하는 행위다. 모델이 접근 가능한 정보가 곧</text>
  <text class="body" x="60" y="230.4" text-anchor="start">유출 후보이고, 모델의 출력이 외부 통신 수단으로 이어질 때 위험이 커진다.</text>
  <rect class="th" x="60" y="266.8" width="230" height="44"/>
  <rect class="th" x="290" y="266.8" width="400" height="44"/>
  <rect class="th" x="690" y="266.8" width="530" height="44"/>
  <text class="thtxt" x="74" y="294.8" text-anchor="start">자산</text>
  <text class="thtxt" x="304" y="294.8" text-anchor="start">예시</text>
  <text class="thtxt" x="704" y="294.8" text-anchor="start">관련 위험</text>
  <rect class="td1" x="60" y="310.8" width="230" height="44"/>
  <text class="tdb" x="74" y="339.2" text-anchor="start">시스템 프롬프트</text>
  <rect class="td1" x="290" y="310.8" width="400" height="44"/>
  <text class="tdtxt" x="304" y="339.2" text-anchor="start">내부 규칙, 비밀 설정, 키</text>
  <rect class="td1" x="690" y="310.8" width="530" height="44"/>
  <text class="tdtxt" x="704" y="339.2" text-anchor="start">OWASP LLM07 System Prompt Leakage</text>
  <rect class="td2" x="60" y="354.8" width="230" height="44"/>
  <text class="tdb" x="74" y="383.2" text-anchor="start">RAG 문서</text>
  <rect class="td2" x="290" y="354.8" width="400" height="44"/>
  <text class="tdtxt" x="304" y="383.2" text-anchor="start">사내 문서, 타 사용자 문서</text>
  <rect class="td2" x="690" y="354.8" width="530" height="44"/>
  <text class="tdtxt" x="704" y="383.2" text-anchor="start">LLM02 Sensitive Information Disclosure, LLM08</text>
  <rect class="td1" x="60" y="398.8" width="230" height="44"/>
  <text class="tdb" x="74" y="427.2" text-anchor="start">대화 기록·메모리</text>
  <rect class="td1" x="290" y="398.8" width="400" height="44"/>
  <text class="tdtxt" x="304" y="427.2" text-anchor="start">이전 세션, 장기 메모리</text>
  <rect class="td1" x="690" y="398.8" width="530" height="44"/>
  <text class="tdtxt" x="704" y="427.2" text-anchor="start">LLM02</text>
  <rect class="td2" x="60" y="442.8" width="230" height="44"/>
  <text class="tdb" x="74" y="471.2" text-anchor="start">개인정보(PII)</text>
  <rect class="td2" x="290" y="442.8" width="400" height="44"/>
  <text class="tdtxt" x="304" y="471.2" text-anchor="start">이름, 연락처, 계정 정보</text>
  <rect class="td2" x="690" y="442.8" width="530" height="44"/>
  <text class="tdtxt" x="704" y="471.2" text-anchor="start">LLM02</text>
  <rect class="td1" x="60" y="486.8" width="230" height="44"/>
  <text class="tdb" x="74" y="515.2" text-anchor="start">자격 증명</text>
  <rect class="td1" x="290" y="486.8" width="400" height="44"/>
  <text class="tdtxt" x="304" y="515.2" text-anchor="start">API 키, 토큰</text>
  <rect class="td1" x="690" y="486.8" width="530" height="44"/>
  <text class="tdtxt" x="704" y="515.2" text-anchor="start">LLM02, LLM06</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-4</text>
