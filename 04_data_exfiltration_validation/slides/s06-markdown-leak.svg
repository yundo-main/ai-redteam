  <line class="arrow" x1="333" y1="360.0" x2="354" y2="360.0"/>
  <polygon class="head" points="354,360.0 345.9,363.9 345.9,356.1"/>
  <rect class="box" x="357" y="285" width="270" height="150" rx="10"/>
  <text class="tag" x="375" y="313.0" text-anchor="start">2단계</text>
  <text class="cname" x="375" y="343.0" text-anchor="start">민감 정보 접근</text>
  <text class="bsm" x="375" y="375.0" text-anchor="start">모델이 비공개 데이터를 읽음</text>
  <line class="arrow" x1="630" y1="360.0" x2="650" y2="360.0"/>
  <polygon class="head" points="650,360.0 641.9,363.9 641.9,356.1"/>
  <rect class="box" x="654" y="285" width="270" height="150" rx="10"/>
  <text class="tag" x="672" y="313.0" text-anchor="start">3단계</text>
  <text class="cname" x="672" y="343.0" text-anchor="start">이미지 URL 생성</text>
  <text class="bsm" x="672" y="375.0" text-anchor="start">쿼리에 유출 데이터를 실음</text>
  <line class="arrow" x1="926" y1="360.0" x2="947" y2="360.0"/>
  <polygon class="head" points="947,360.0 938.9,363.9 938.9,356.1"/>
  <rect class="box key" x="950" y="285" width="270" height="150" rx="10"/>
  <text class="tag" x="968" y="313.0" text-anchor="start">4단계</text>
  <text class="cname" x="968" y="343.0" text-anchor="start">자동 로드</text>
  <text class="bsm" x="968" y="375.0" text-anchor="start">렌더링 시 외부 서버로 요청</text>
  <rect class="box key" x="60" y="465" width="1160" height="150" rx="10"/>
  <text class="tag" x="78" y="493.0" text-anchor="start">왜 위험한가</text>
  <text class="bsm" x="78" y="523.0" text-anchor="start">· 사용자가 아무것도 클릭하지 않아도 렌더링 시점에 외부 서버로 요청이 나가고, URL 쿼리에 데이터가 실려 나간다.</text>
  <text class="bsm" x="78" y="547.8" text-anchor="start">· 링크(클릭 필요)보다 이미지(자동 로드)가 더 위험하다.</text>
  <text class="bsm" x="78" y="572.6" text-anchor="start">· 공격자의 지시는 보통 간접 인젝션(문서·웹 페이지)으로 주입된다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-4</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">6 / 27</text>
