  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-4</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">방어 관점</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">경로의 한 곳이 아니라 여러 곳에서 끊는다</text>
  <rect class="th" x="60" y="190" width="300" height="44"/>
  <rect class="th" x="360" y="190" width="860" height="44"/>
  <text class="thtxt" x="74" y="218.0" text-anchor="start">통제</text>
  <text class="thtxt" x="374" y="218.0" text-anchor="start">설명</text>
  <rect class="td1" x="60" y="234" width="300" height="44"/>
  <text class="tdb" x="74" y="262.4" text-anchor="start">출력 URL 제한</text>
  <rect class="td1" x="360" y="234" width="860" height="44"/>
  <text class="tdtxt" x="374" y="262.4" text-anchor="start">렌더링 가능한 이미지·링크 도메인을 허용 목록으로 제한, 이미지 프록시 사용</text>
  <rect class="td2" x="60" y="278" width="300" height="44"/>
  <text class="tdb" x="74" y="306.4" text-anchor="start">CSP 등 클라이언트 통제</text>
  <rect class="td2" x="360" y="278" width="860" height="44"/>
  <text class="tdtxt" x="374" y="306.4" text-anchor="start">외부 도메인 리소스 자동 로드 차단</text>
  <rect class="td1" x="60" y="322" width="300" height="44"/>
  <text class="tdb" x="74" y="350.4" text-anchor="start">치명적 3요소 분리</text>
  <rect class="td1" x="360" y="322" width="860" height="44"/>
  <text class="tdtxt" x="374" y="350.4" text-anchor="start">비공개 데이터·비신뢰 입력·외부 통신을 같은 컨텍스트에 두지 않음</text>
  <rect class="td2" x="60" y="366" width="300" height="44"/>
  <text class="tdb" x="74" y="394.4" text-anchor="start">접근 통제(ACL)</text>
  <rect class="td2" x="360" y="366" width="860" height="44"/>
  <text class="tdtxt" x="374" y="394.4" text-anchor="start">요청 사용자 권한 기준으로 검색·응답 범위 제한 (RAG의 문서 단위 ACL)</text>
  <rect class="td1" x="60" y="410" width="300" height="44"/>
  <text class="tdb" x="74" y="438.4" text-anchor="start">DLP/출력 검사</text>
  <rect class="td1" x="360" y="410" width="860" height="44"/>
  <text class="tdtxt" x="374" y="438.4" text-anchor="start">민감 패턴·카나리 문자열이 출력에 포함되면 차단</text>
  <rect class="td2" x="60" y="454" width="300" height="44"/>
  <text class="tdb" x="74" y="482.4" text-anchor="start">외부 통신 도구 통제</text>
  <rect class="td2" x="360" y="454" width="860" height="44"/>
  <text class="tdtxt" x="374" y="482.4" text-anchor="start">목적지 허용 목록, 사람 승인</text>
  <rect class="td1" x="60" y="498" width="300" height="44"/>
  <text class="tdb" x="74" y="526.4" text-anchor="start">모니터링</text>
  <rect class="td1" x="360" y="498" width="860" height="44"/>
  <text class="tdtxt" x="374" y="526.4" text-anchor="start">비정상적 외부 요청, 인코딩된 긴 문자열 탐지</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-4</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">10 / 27</text>
