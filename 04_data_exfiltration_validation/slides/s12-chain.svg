  <rect class="td1" x="60" y="284.4" width="300" height="44"/>
  <text class="tdb" x="74" y="312.8" text-anchor="start">간접 인젝션(문서 유입)</text>
  <rect class="td1" x="360" y="284.4" width="480" height="44"/>
  <text class="tdtxt" x="374" y="312.8" text-anchor="start">2장 조건 ②(비신뢰 콘텐츠)</text>
  <rect class="td1" x="840" y="284.4" width="380" height="44"/>
  <text class="tdtxt" x="854" y="312.8" text-anchor="start">지시/데이터 분리, 입력 정제</text>
  <rect class="td2" x="60" y="328.4" width="300" height="44"/>
  <text class="tdb" x="74" y="356.8" text-anchor="start">민감 정보 접근</text>
  <rect class="td2" x="360" y="328.4" width="480" height="44"/>
  <text class="tdtxt" x="374" y="356.8" text-anchor="start">1.1, 2장 조건 ①(비공개 데이터)</text>
  <rect class="td2" x="840" y="328.4" width="380" height="44"/>
  <text class="tdtxt" x="854" y="356.8" text-anchor="start">문서 단위 ACL</text>
  <rect class="td1" x="60" y="372.4" width="300" height="44"/>
  <text class="tdb" x="74" y="400.8" text-anchor="start">외부 전송</text>
  <rect class="td1" x="360" y="372.4" width="480" height="44"/>
  <text class="tdtxt" x="374" y="400.8" text-anchor="start">3.2~3.4, 2장 조건 ③(통신 능력)</text>
  <rect class="td1" x="840" y="372.4" width="380" height="44"/>
  <text class="tdtxt" x="854" y="400.8" text-anchor="start">URL 허용 목록, 외부 통신 제한</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-4</text>
