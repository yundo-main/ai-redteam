  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-4</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">6-2 Exploit Chain과의 대응</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">이 일차는 정보 노출과 외부 전송 구간을 다룬다</text>
  <text class="body" x="60" y="200.0" text-anchor="start">6-2의 연쇄 "간접 인젝션 → 정보 노출 → 도구 권한 파악 → 도구 오용 → 외부 전송"에서 이 일차는 정보 노출과 외부 전송 구간을 다룬다.</text>
  <rect class="th" x="60" y="240.4" width="300" height="44"/>
  <rect class="th" x="360" y="240.4" width="480" height="44"/>
  <rect class="th" x="840" y="240.4" width="380" height="44"/>
