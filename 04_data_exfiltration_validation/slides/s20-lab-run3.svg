  <text class="bsm" x="60" y="481.0" text-anchor="start">아니면: 오탐률이 10%를 넘으면 카나리·URL 필터 규칙이 너무 넓은지 본다.</text>
  <text class="bsm" x="60" y="505.0" text-anchor="start">카나리 유출이 1건 이상이면 test_context_excludes_unauthorized_docs부터</text>
  <text class="bsm" x="60" y="529.0" text-anchor="start">확인한다.</text>
