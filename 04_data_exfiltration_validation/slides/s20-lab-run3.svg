  <text class="bsm" x="684" y="342.0" text-anchor="start">없는 것이라 통과로 세지 않는다.</text>
  <circle class="circ" cx="661" cy="384" r="11"/>
  <text class="circt" x="661" y="389.0" text-anchor="middle">2</text>
