      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-4</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 10 · 실패 시 확인과 결론 문장</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">원인을 좁히고, 증거가 받쳐 주는 말만 쓴다</text>
  <rect class="th" x="60" y="185" width="320" height="44"/>
  <rect class="th" x="380" y="185" width="400" height="44"/>
  <rect class="th" x="780" y="185" width="440" height="44"/>
  <text class="thtxt" x="74" y="213.0" text-anchor="start">증상</text>
  <text class="thtxt" x="394" y="213.0" text-anchor="start">원인 후보</text>
  <text class="thtxt" x="794" y="213.0" text-anchor="start">확인할 것</text>
  <rect class="td1" x="60" y="229" width="320" height="44"/>
  <text class="tdb" x="74" y="257.0" text-anchor="start">skipped 발생</text>
  <rect class="td1" x="380" y="229" width="400" height="44"/>
  <text class="tdtxt" x="394" y="257.0" text-anchor="start">LLM 꺼짐, 패키지 미설치</text>
  <rect class="td1" x="780" y="229" width="440" height="44"/>
  <text class="tdtxt" x="794" y="257.0" text-anchor="start">0~2번 준비 단계</text>
  <rect class="td2" x="60" y="273" width="320" height="44"/>
  <text class="tdb" x="74" y="301.0" text-anchor="start">오탐률 10% 초과</text>
  <rect class="td2" x="380" y="273" width="400" height="44"/>
  <text class="tdtxt" x="394" y="301.0" text-anchor="start">카나리·URL 필터 규칙이 너무 넓다</text>
  <rect class="td2" x="780" y="273" width="440" height="44"/>
  <text class="tdtxt" x="794" y="301.0" text-anchor="start">막힌 정상 응답의 차단 사유</text>
  <rect class="td1" x="60" y="317" width="320" height="44"/>
  <text class="tdb" x="74" y="345.0" text-anchor="start">카나리 유출 1건 이상</text>
  <rect class="td1" x="380" y="317" width="400" height="44"/>
  <text class="tdtxt" x="394" y="345.0" text-anchor="start">ACL 필터가 권한 없는 문서를 컨텍스트에 넣었다</text>
  <rect class="td1" x="780" y="317" width="440" height="44"/>
  <text class="tdtxt" x="794" y="345.0" text-anchor="start">test_context_excludes_unauthorized_docs</text>
  <rect class="td2" x="60" y="361" width="320" height="44"/>
  <text class="tdb" x="74" y="389.0" text-anchor="start">유출 0인데 응답이 비어 있다</text>
  <rect class="td2" x="380" y="361" width="400" height="44"/>
  <text class="tdtxt" x="394" y="389.0" text-anchor="start">과차단으로 응답 자체가 막혔다</text>
  <rect class="td2" x="780" y="361" width="440" height="44"/>
  <text class="tdtxt" x="794" y="389.0" text-anchor="start">오탐률과 함께 확인</text>
  <rect class="th" x="60" y="427" width="560" height="44"/>
  <rect class="th" x="620" y="427" width="600" height="44"/>
  <text class="thtxt" x="74" y="455.0" text-anchor="start">쓸 수 있다</text>
  <text class="thtxt" x="634" y="455.0" text-anchor="start">쓸 수 없다</text>
  <rect class="td1" x="60" y="471" width="560" height="60.0"/>
  <text class="tdtxt" x="74" y="496.5" text-anchor="start">권한 없는 사용자 응답의 카나리 유출 0/10(상한 28%). 컨텍스트에 기밀</text>
  <text class="tdtxt" x="74" y="517.5" text-anchor="start">문서가 없는 구조적 결과다</text>
  <rect class="td1" x="620" y="471" width="600" height="60.0"/>
  <text class="tdtxt" x="634" y="496.5" text-anchor="start">모델은 기밀을 유출하지 않는다</text>
  <rect class="td2" x="60" y="531.0" width="560" height="44"/>
  <text class="tdtxt" x="74" y="559.0" text-anchor="start">정상 질문 오탐 0/30(상한 11%)</text>
  <rect class="td2" x="620" y="531.0" width="600" height="44"/>
  <text class="tdtxt" x="634" y="559.0" text-anchor="start">정상 질문은 막히지 않는다</text>
  <rect class="td1" x="60" y="575.0" width="560" height="44"/>
  <text class="tdtxt" x="74" y="603.0" text-anchor="start">표지 밖의 유출(문장 풀어쓰기)은 확인하지 않았다</text>
  <rect class="td1" x="620" y="575.0" width="600" height="44"/>
  <text class="tdtxt" x="634" y="603.0" text-anchor="start">데이터 유출이 방어된다</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-4</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">23 / 27</text>
</svg>
