  <text class="tdb" x="74" y="267.8" text-anchor="start">카나리 탐지·URL 허용 목록·ACL</text>
  <rect class="td1" x="390" y="239" width="190" height="44"/>
  <text class="tdtxt" x="404" y="267.8" text-anchor="start">6-5, 6-6</text>
  <rect class="td1" x="580" y="239" width="640" height="44"/>
  <text class="tdtxt" x="594" y="267.8" text-anchor="start">같은 방어 모듈로 자동 검증하고 평가셋 판정 기준으로 쓴다</text>
  <rect class="td2" x="60" y="283" width="330" height="44"/>
  <text class="tdb" x="74" y="311.8" text-anchor="start">오탐률과 신뢰구간</text>
  <rect class="td2" x="390" y="283" width="190" height="44"/>
  <text class="tdtxt" x="404" y="311.8" text-anchor="start">6-5, 6-6</text>
  <rect class="td2" x="580" y="283" width="640" height="44"/>
  <text class="tdtxt" x="594" y="311.8" text-anchor="start">합격/불합격 게이트와 방어율 보고의 기준</text>
  <rect class="td1" x="60" y="327" width="330" height="44"/>
  <text class="tdb" x="74" y="355.8" text-anchor="start">증거 수집 항목</text>
  <rect class="td1" x="390" y="327" width="190" height="44"/>
  <text class="tdtxt" x="404" y="355.8" text-anchor="start">6-7</text>
  <rect class="td1" x="580" y="327" width="640" height="44"/>
  <text class="tdtxt" x="594" y="355.8" text-anchor="start">발견 사항의 증거·재현 절차 작성의 재료</text>
  <rect class="td2" x="60" y="371" width="330" height="44"/>
  <text class="tdb" x="74" y="399.8" text-anchor="start">도구를 통한 유출 경로</text>
  <rect class="td2" x="390" y="371" width="190" height="44"/>
  <text class="tdtxt" x="404" y="399.8" text-anchor="start">6-3</text>
  <rect class="td2" x="580" y="371" width="640" height="44"/>
  <text class="tdtxt" x="594" y="399.8" text-anchor="start">Tool Abuse와 결합되는 유출 시나리오</text>
  <rect class="td1" x="60" y="415" width="330" height="44"/>
  <text class="tdb" x="74" y="443.8" text-anchor="start">EX-01 워크시트</text>
  <rect class="td1" x="390" y="415" width="190" height="44"/>
  <text class="tdtxt" x="404" y="443.8" text-anchor="start">6-6, 6-7</text>
  <rect class="td1" x="580" y="415" width="640" height="44"/>
  <text class="tdtxt" x="594" y="443.8" text-anchor="start">평가셋 케이스와 보고서 발견 사항으로 변환</text>
  <text class="bsm" x="60" y="495.0" text-anchor="start">선행: 6-1 공격 표면(2.1)·ROE(4장)·OWASP LLM02/LLM07(5.1), 6-2 시나리오 워크시트(6장)·Exploit Chain(5장)</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-4</text>
