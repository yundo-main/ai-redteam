  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">왜 자동화하는가</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">수동은 창의적이지만 느리고 재현이 어렵다</text>
  <rect class="box" x="60" y="190" width="275" height="170" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">자동화의 이점</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">규모</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start">수백~수천 건의 공격 페이로드를</text>
  <text class="bsm" x="78" y="304.8" text-anchor="start">반복 전송</text>
  <rect class="box" x="355" y="190" width="275" height="170" rx="10"/>
  <text class="tag" x="373" y="218.0" text-anchor="start">자동화의 이점</text>
  <text class="cname" x="373" y="248.0" text-anchor="start">재현성</text>
  <text class="bsm" x="373" y="280.0" text-anchor="start">같은 설정으로 다시 실행해</text>
  <text class="bsm" x="373" y="304.8" text-anchor="start">결과를 비교</text>
  <rect class="box" x="650" y="190" width="275" height="170" rx="10"/>
  <text class="tag" x="668" y="218.0" text-anchor="start">자동화의 이점</text>
  <text class="cname" x="668" y="248.0" text-anchor="start">회귀 검증</text>
  <text class="bsm" x="668" y="280.0" text-anchor="start">모델·프롬프트·가드레일 변경 후</text>
  <text class="bsm" x="668" y="304.8" text-anchor="start">같은 스캔으로 방어력 유지 확인</text>
  <rect class="box" x="945" y="190" width="275" height="170" rx="10"/>
  <text class="tag" x="963" y="218.0" text-anchor="start">자동화의 이점</text>
  <text class="cname" x="963" y="248.0" text-anchor="start">비결정성 대응</text>
  <text class="bsm" x="963" y="280.0" text-anchor="start">같은 프롬프트를 여러 번 시도해</text>
  <text class="bsm" x="963" y="304.8" text-anchor="start">성공률을 통계로 산출</text>
  <rect class="th" x="60" y="390" width="200" height="44"/>
  <rect class="th" x="260" y="390" width="480" height="44"/>
  <rect class="th" x="740" y="390" width="480" height="44"/>
  <text class="thtxt" x="74" y="418.0" text-anchor="start">구분</text>
  <text class="thtxt" x="274" y="418.0" text-anchor="start">수동</text>
  <text class="thtxt" x="754" y="418.0" text-anchor="start">자동화</text>
  <rect class="td1" x="60" y="434" width="200" height="44"/>
  <text class="tdb" x="74" y="462.4" text-anchor="start">강점</text>
  <rect class="td1" x="260" y="434" width="480" height="44"/>
  <text class="tdtxt" x="274" y="462.4" text-anchor="start">새로운 공격·맥락 의존적 취약점 발견</text>
  <rect class="td1" x="740" y="434" width="480" height="44"/>
  <text class="tdtxt" x="754" y="462.4" text-anchor="start">대량·반복·회귀 테스트</text>
  <rect class="td2" x="60" y="478" width="200" height="44"/>
  <text class="tdb" x="74" y="506.4" text-anchor="start">약점</text>
  <rect class="td2" x="260" y="478" width="480" height="44"/>
  <text class="tdtxt" x="274" y="506.4" text-anchor="start">비용, 확장성</text>
  <rect class="td2" x="740" y="478" width="480" height="44"/>
  <text class="tdtxt" x="754" y="506.4" text-anchor="start">알려진 패턴 중심, 판정 오류</text>
  <text class="bsm" x="60" y="546.0" text-anchor="start">자동화는 수동을 대체하지 않고 보완한다. 자동 스캔으로 폭넓게 확인하고, 수동으로 깊이 파고든다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">2 / 25</text>
</svg>
