      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Garak: 구성 요소</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">Probe → Detector 쌍이 핵심이다</text>
  <text class="body" x="60" y="190.0" text-anchor="start">LLM의 프롬프트 인젝션, 탈옥, 정보 유출, 환각 등을 자동 스캔하는 오픈소스 LLM 취약점 스캐너. nmap 같은 소프트웨어 취약점 스캐너와</text>
  <text class="body" x="60" y="218.8" text-anchor="start">비슷한 방식으로 LLM을 점검한다.</text>
  <rect class="th" x="60" y="253.60000000000002" width="200" height="44"/>
  <rect class="th" x="260" y="253.60000000000002" width="960" height="44"/>
  <text class="thtxt" x="74" y="281.6" text-anchor="start">구성</text>
  <text class="thtxt" x="274" y="281.6" text-anchor="start">역할</text>
  <rect class="td1" x="60" y="297.6" width="200" height="44"/>
  <text class="tdb" x="74" y="326.0" text-anchor="start">Generator</text>
  <rect class="td1" x="260" y="297.6" width="960" height="44"/>
  <text class="tdtxt" x="274" y="326.0" text-anchor="start">테스트 대상 모델/엔드포인트에 대한 연결(OpenAI 호환 API, 로컬 모델, REST 등)</text>
  <rect class="td2" x="60" y="341.6" width="200" height="44"/>
  <text class="tdb" x="74" y="370.0" text-anchor="start">Probe</text>
  <rect class="td2" x="260" y="341.6" width="960" height="44"/>
  <text class="tdtxt" x="274" y="370.0" text-anchor="start">특정 취약점 유형을 유발하도록 설계된 공격 프롬프트 묶음(jailbreak, prompt injection 계열)</text>
  <rect class="td1" x="60" y="385.6" width="200" height="44"/>
  <text class="tdb" x="74" y="414.0" text-anchor="start">Detector</text>
  <rect class="td1" x="260" y="385.6" width="960" height="44"/>
  <text class="tdtxt" x="274" y="414.0" text-anchor="start">응답을 분석해 취약 여부를 판정하는 모듈</text>
  <rect class="td2" x="60" y="429.6" width="200" height="44"/>
  <text class="tdb" x="74" y="458.0" text-anchor="start">Harness</text>
  <rect class="td2" x="260" y="429.6" width="960" height="44"/>
  <text class="tdtxt" x="274" y="458.0" text-anchor="start">어떤 Probe와 Detector를 어떻게 묶어 실행할지 조정</text>
  <rect class="td1" x="60" y="473.6" width="200" height="44"/>
  <text class="tdb" x="74" y="502.0" text-anchor="start">Evaluator</text>
  <rect class="td1" x="260" y="473.6" width="960" height="44"/>
  <text class="tdtxt" x="274" y="502.0" text-anchor="start">판정 결과를 집계하고 보고서로 출력</text>
  <text class="bsm" x="60" y="541.6" text-anchor="start">핵심은 Probe(공격 전송) → Detector(취약 판정) 쌍이다. 세부 구성은 버전에 따라 달라지므로 공식 문서를 확인한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">4 / 32</text>
</svg>
