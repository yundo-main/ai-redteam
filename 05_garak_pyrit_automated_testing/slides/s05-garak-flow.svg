  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">Garak: 실행 흐름</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">각 Probe는 프롬프트를 여러 번 생성해 보낸다</text>
  <rect class="box" x="60" y="200" width="210" height="200" rx="10"/>
  <text class="tag" x="78" y="228.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="258.0" text-anchor="start">대상 연결</text>
  <text class="bsm" x="78" y="290.0" text-anchor="start">모델 종류, 엔드포인트,</text>
  <text class="bsm" x="78" y="314.8" text-anchor="start">인증</text>
  <line class="arrow" x1="273" y1="300.0" x2="294" y2="300.0"/>
  <polygon class="head" points="294,300.0 285.9,303.9 285.9,296.1"/>
  <rect class="box" x="297" y="200" width="210" height="200" rx="10"/>
  <text class="tag" x="315" y="228.0" text-anchor="start">2단계</text>
  <text class="cname" x="315" y="258.0" text-anchor="start">Probe 선택</text>
  <text class="bsm" x="315" y="290.0" text-anchor="start">탈옥, 프롬프트 인젝션</text>
  <text class="bsm" x="315" y="314.8" text-anchor="start">등</text>
  <line class="arrow" x1="511" y1="300.0" x2="532" y2="300.0"/>
  <polygon class="head" points="532,300.0 523.9,303.9 523.9,296.1"/>
  <rect class="box key" x="535" y="200" width="210" height="200" rx="10"/>
  <text class="tag" x="553" y="228.0" text-anchor="start">3단계</text>
  <text class="cname" x="553" y="258.0" text-anchor="start">스캔 실행</text>
  <text class="bsm" x="553" y="290.0" text-anchor="start">각 Probe가 프롬프트를</text>
  <text class="bsm" x="553" y="314.8" text-anchor="start">여러 번 생성·전송</text>
  <line class="arrow" x1="748" y1="300.0" x2="769" y2="300.0"/>
  <polygon class="head" points="769,300.0 760.9,303.9 760.9,296.1"/>
  <rect class="box" x="772" y="200" width="210" height="200" rx="10"/>
  <text class="tag" x="790" y="228.0" text-anchor="start">4단계</text>
  <text class="cname" x="790" y="258.0" text-anchor="start">판정</text>
  <text class="bsm" x="790" y="290.0" text-anchor="start">Detector가 응답 판정</text>
  <line class="arrow" x1="986" y1="300.0" x2="1007" y2="300.0"/>
  <polygon class="head" points="1007,300.0 998.9,303.9 998.9,296.1"/>
  <rect class="box key" x="1010" y="200" width="210" height="200" rx="10"/>
  <text class="tag" x="1028" y="228.0" text-anchor="start">5단계</text>
  <text class="cname" x="1028" y="258.0" text-anchor="start">리포트</text>
  <text class="bsm" x="1028" y="290.0" text-anchor="start">Probe별 통과/실패</text>
  <text class="bsm" x="1028" y="314.8" text-anchor="start">비율</text>
  <rect class="box key" x="60" y="450" width="1160" height="150" rx="10"/>
  <text class="tag" x="78" y="478.0" text-anchor="start">반복이 핵심이다</text>
  <text class="bsm" x="78" y="508.0" text-anchor="start">· 같은 Probe를 여러 번 생성해 보내는 이유는 모델 출력이 매번 달라지기 때문이다.</text>
  <text class="bsm" x="78" y="532.8" text-anchor="start">· 리포트의 통과/실패 비율은 반복 수가 충분할 때만 의미가 있다. 반복이 적으면 결과가 흔들린다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">5 / 33</text>
</svg>
