  <text class="tdtxt" x="754" y="306.8" text-anchor="start">멀티턴·적응형 공격 설계가 용이</text>
  <rect class="td1" x="60" y="322" width="200" height="44"/>
  <text class="tdb" x="74" y="350.8" text-anchor="start">사용 형태</text>
