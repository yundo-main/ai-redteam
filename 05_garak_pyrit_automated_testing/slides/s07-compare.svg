  <text class="tdb" x="74" y="394.8" text-anchor="start">적합한 용도</text>
  <rect class="td2" x="260" y="366" width="480" height="44"/>
  <text class="tdtxt" x="274" y="394.8" text-anchor="start">초기 광범위 점검, 회귀 스캔</text>
  <rect class="td2" x="740" y="366" width="480" height="44"/>
  <text class="tdtxt" x="754" y="394.8" text-anchor="start">특정 목표 중심의 심층 검증, 커스텀 시나리오</text>
  <rect class="box key" x="60" y="440" width="1160" height="110" rx="10"/>
  <text class="tag" x="78" y="468.0" text-anchor="start">선택</text>
  <text class="bsm" x="78" y="498.0" text-anchor="start">초기 점검과 회귀에는 Garak, 특정 목표를 깊게 파는 검증에는 PyRIT을 먼저 고려한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
