      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">결과 해석: 핵심 지표와 활용</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">통과율은 곧 방어 성공, 실패율은 ASR이다</text>
  <rect class="box" x="60" y="195" width="360" height="200" rx="10"/>
  <text class="tag" x="78" y="223.0" text-anchor="start">핵심 지표</text>
  <text class="cname" x="78" y="253.0" text-anchor="start">통과율(Pass rate)</text>
  <text class="bsm" x="78" y="285.0" text-anchor="start">방어에 성공한 비율. 취약성은 보통 실패율 =</text>
  <text class="bsm" x="78" y="309.8" text-anchor="start">공격 성공률(ASR)로 본다.</text>
  <rect class="box" x="460" y="195" width="360" height="200" rx="10"/>
  <text class="tag" x="478" y="223.0" text-anchor="start">핵심 지표</text>
  <text class="cname" x="478" y="253.0" text-anchor="start">유형별 분포</text>
  <text class="bsm" x="478" y="285.0" text-anchor="start">Probe/공격 유형별로 어떤 유형이 취약한지</text>
  <text class="bsm" x="478" y="309.8" text-anchor="start">파악한다.</text>
  <rect class="box" x="860" y="195" width="360" height="200" rx="10"/>
  <text class="tag" x="878" y="223.0" text-anchor="start">핵심 지표</text>
  <text class="cname" x="878" y="253.0" text-anchor="start">심각도</text>
  <text class="bsm" x="878" y="285.0" text-anchor="start">성공한 공격이 가져오는 영향. 6-1의</text>
  <text class="bsm" x="878" y="309.8" text-anchor="start">점수화와 연계한다.</text>
  <text class="name" x="60" y="425.0" text-anchor="start">결과 활용</text>
  <rect class="box" x="60" y="440" width="270" height="170" rx="10"/>
  <text class="tag" x="78" y="468.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="498.0" text-anchor="start">패턴 도출</text>
  <text class="bsm" x="78" y="530.0" text-anchor="start">실패한 프롬프트 패턴을 찾는다</text>
  <line class="arrow" x1="333" y1="525.0" x2="354" y2="525.0"/>
  <polygon class="head" points="354,525.0 345.9,528.9 345.9,521.1"/>
  <rect class="box" x="357" y="440" width="270" height="170" rx="10"/>
  <text class="tag" x="375" y="468.0" text-anchor="start">2단계</text>
  <text class="cname" x="375" y="498.0" text-anchor="start">개선</text>
  <text class="bsm" x="375" y="530.0" text-anchor="start">가드레일/프롬프트를 고친다</text>
  <line class="arrow" x1="630" y1="525.0" x2="650" y2="525.0"/>
  <polygon class="head" points="650,525.0 641.9,528.9 641.9,521.1"/>
  <rect class="box key" x="654" y="440" width="270" height="170" rx="10"/>
  <text class="tag" x="672" y="468.0" text-anchor="start">3단계</text>
  <text class="cname" x="672" y="498.0" text-anchor="start">재스캔</text>
  <text class="bsm" x="672" y="530.0" text-anchor="start">동일 스캔으로 효과 검증</text>
  <line class="arrow" x1="926" y1="525.0" x2="947" y2="525.0"/>
  <polygon class="head" points="947,525.0 938.9,528.9 938.9,521.1"/>
  <rect class="box" x="950" y="440" width="270" height="170" rx="10"/>
  <text class="tag" x="968" y="468.0" text-anchor="start">4단계</text>
  <text class="cname" x="968" y="498.0" text-anchor="start">평가셋 편입</text>
  <text class="bsm" x="968" y="530.0" text-anchor="start">6-6 회귀 테스트로 만든다</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">8 / 32</text>
</svg>
