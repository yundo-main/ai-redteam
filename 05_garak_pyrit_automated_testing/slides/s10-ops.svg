      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">운영상 고려사항</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">대량 요청은 장애와 비용으로 이어질 수 있다</text>
  <rect class="box key" x="60" y="195" width="570" height="210" rx="10"/>
  <text class="tag" x="78" y="223.0" text-anchor="start">운영 고려사항</text>
  <text class="cname" x="78" y="253.0" text-anchor="start">ROE 준수</text>
  <text class="bsm" x="78" y="285.0" text-anchor="start">ROE(합의한 허용·금지 범위)에 따라 대상, 호출량(속도 제한), 비용,</text>
  <text class="bsm" x="78" y="309.8" text-anchor="start">환경 분리를 사전에 합의한다. 대량 요청이 서비스 장애(DoS)를 일으키지</text>
  <text class="bsm" x="78" y="334.6" text-anchor="start">않게 한다.</text>
  <rect class="box" x="650" y="195" width="570" height="210" rx="10"/>
  <text class="tag" x="668" y="223.0" text-anchor="start">운영 고려사항</text>
  <text class="cname" x="668" y="253.0" text-anchor="start">비용 관리</text>
  <text class="bsm" x="668" y="285.0" text-anchor="start">외부 모델 API는 호출 수에 비례해 비용이 발생한다.</text>
  <rect class="box" x="60" y="425" width="570" height="210" rx="10"/>
  <text class="tag" x="78" y="453.0" text-anchor="start">운영 고려사항</text>
  <text class="cname" x="78" y="483.0" text-anchor="start">API 키·결과 보호</text>
  <text class="bsm" x="78" y="515.0" text-anchor="start">설정 파일의 자격 증명과 스캔 결과(유해 응답 포함)는 접근을 통제한다.</text>
  <rect class="box" x="650" y="425" width="570" height="210" rx="10"/>
  <text class="tag" x="668" y="453.0" text-anchor="start">운영 고려사항</text>
  <text class="cname" x="668" y="483.0" text-anchor="start">CI 연동</text>
  <text class="bsm" x="668" y="515.0" text-anchor="start">배포 파이프라인에 스캔을 넣어 변경 시마다 회귀 점검한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">10 / 32</text>
</svg>
