  <text class="tdb" x="74" y="389.0" text-anchor="start">전제 조건</text>
  <rect class="td2" x="270" y="361" width="950" height="44"/>
  <text class="tdtxt" x="284" y="389.0" text-anchor="start">대상이 REST로 연동됨, 호출량·비용 상한이 합의됨</text>
