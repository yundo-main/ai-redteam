  <text class="tdtxt" x="284" y="477.0" text-anchor="start">대상 연결 설정 → Probe 범주 선택 → 반복 스캔 → Detector 판정 → 변경 전후 리포트 비교</text>
  <rect class="td1" x="60" y="493" width="210" height="44"/>
