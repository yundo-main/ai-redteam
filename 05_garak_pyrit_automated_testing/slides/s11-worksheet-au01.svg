  <rect class="td1" x="270" y="493" width="950" height="44"/>
  <text class="tdtxt" x="284" y="521.0" text-anchor="start">변경 후 ASR이 변경 전보다 증가하거나 기준을 넘음 (스캔 리포트, 설정 파일 버전)</text>
  <rect class="td2" x="60" y="537" width="210" height="44"/>
  <text class="tdb" x="74" y="565.0" text-anchor="start">영향도·우선순위</text>
