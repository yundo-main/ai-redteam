  <text class="sub" x="640.0" y="266" text-anchor="middle">wilson() · trials() · fmt()</text>
  <rect class="box" x="880" y="190" width="340" height="90" rx="8"/>
  <text class="name" x="1050.0" y="222" text-anchor="middle">hypothesis_log.py</text>
