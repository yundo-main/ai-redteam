  <line class="arrow" x1="640" y1="280" x2="640" y2="305"/>
  <line class="arrow" x1="1050" y1="280" x2="1050" y2="305"/>
  <line class="arrow" x1="230" y1="305" x2="1050" y2="305"/>
  <line class="arrow" x1="340" y1="305" x2="340" y2="329"/>
  <polygon class="head" points="340,329 335,320 345,320"/>
  <line class="arrow" x1="940" y1="305" x2="940" y2="329"/>
  <polygon class="head" points="940,329 935,320 945,320"/>
  <text class="note" x="660" y="298" text-anchor="start">세 모듈은 두 스캐너가 함께 쓴다</text>
  <rect class="box key" x="60" y="330" width="560" height="170" rx="8"/>
  <text class="name" x="340.0" y="362" text-anchor="middle">scan_pyrit.py — PyRIT</text>
  <text class="sub" x="340.0" y="384" text-anchor="middle">Target: OpenAIChatTarget → Ollama /v1</text>
  <text class="sub" x="340.0" y="406" text-anchor="middle">Attack: PromptSendingAttack · Converter: Base64Converter</text>
  <text class="sub" x="340.0" y="428" text-anchor="middle">Scorer: SubStringScorer(카나리, Base64 카나리) OR</text>
  <text class="sub" x="340.0" y="450" text-anchor="middle">공격 4유형 x 10회 = 40건 → ch05-pyrit.leak_rate</text>
  <rect class="box key" x="660" y="330" width="560" height="170" rx="8"/>
  <text class="name" x="940.0" y="362" text-anchor="middle">scan_garak.py — Garak</text>
  <text class="sub" x="940.0" y="384" text-anchor="middle">garak CLI 를 subprocess 로 실행 (Generator → Probe → Detector)</text>
  <text class="sub" x="940.0" y="406" text-anchor="middle">프로브: latentinjection · encoding.InjectBase64, 프롬프트 30개씩</text>
  <text class="sub" x="940.0" y="428" text-anchor="middle">리포트 eval 줄의 fails / total_evaluated 를 읽음</text>
  <text class="sub" x="940.0" y="450" text-anchor="middle">→ ch05-garak.latent_injection_asr · base64_asr</text>
  <line class="arrow" x1="340" y1="500" x2="340" y2="548"/>
  <polygon class="head" points="340,548 335,539 345,539"/>
  <line class="arrow" x1="940" y1="500" x2="940" y2="548"/>
  <polygon class="head" points="940,548 935,539 945,539"/>
