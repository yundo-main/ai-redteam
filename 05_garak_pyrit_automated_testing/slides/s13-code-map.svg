  <text class="stitle" x="60" y="118">소스 코드 구조 — Garak·PyRIT 스캐너</text>
  <text class="ssub" x="60" y="154">방어 전 모델 원본 응답을 스캔·채점 (두 스캐너는 서로 독립 실행)</text>
