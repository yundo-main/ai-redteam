<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">참고: test_* 시리즈 — LangGraph 평가·게이트</title>
  <desc id="d">05 일차 src/의 모듈 구성: 04에서 복사한 defense.py의 집계 지표를 LangGraph 노드로 엮어 합격/불합격 게이트를 만든다.</desc>
