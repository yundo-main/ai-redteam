<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 2 · 가설이란: 실행 전에 적는 예상</title>
  <desc id="d">가설을 왜 실행 전에 적는지, 무엇을 적는지, 빗나가면 무엇을 얻는지.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  
    .tdk { fill: #1b2433; font-size: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
    .tdv { fill: #1b2433; font-size: 15px; }
    .cm { fill: #8fa3c4; font-size: 15px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .sm { fill: #4a5568; font-size: 15px; }
    @media (prefers-color-scheme: dark) { .tdk, .tdv { fill: #eef1f6; } .sm { fill: #aab3c2; } }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 2 · 가설이란: 실행 전에 적는 예상</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">결과를 보기 전에 숫자로 예상을 고정해 두면, 틀린 가정이 드러난다</text>
  <rect class="box key" x="60" y="185" width="380" height="235" rx="10"/>
  <text class="tag" x="78" y="213" text-anchor="start">1</text>
  <text class="cname" x="78" y="243" text-anchor="start">왜 먼저 적나</text>
  <text class="bsm" x="78" y="275.0" text-anchor="start">결과를 본 뒤에는 '그럴 줄</text>
  <text class="bsm" x="78" y="299.5" text-anchor="start">알았다'며 예상을 맞춰 쓰기</text>
  <text class="bsm" x="78" y="324.0" text-anchor="start">쉽다. 실행 전에 파일로</text>
  <text class="bsm" x="78" y="348.5" text-anchor="start">저장해 고정한다.</text>
  <text class="bsm" x="78" y="373.0" text-anchor="start">(수정 시각이 실행 뒤면</text>
  <text class="bsm" x="78" y="397.5" text-anchor="start">'사후 작성'으로 표시)</text>
  <rect class="box " x="460" y="185" width="380" height="235" rx="10"/>
  <text class="tag" x="478" y="213" text-anchor="start">2</text>
  <text class="cname" x="478" y="243" text-anchor="start">무엇을 적나</text>
  <text class="bsm" x="478" y="275.0" text-anchor="start">측정될 값에 대한 숫자 예상:</text>
  <text class="bsm" x="478" y="299.5" text-anchor="start">방어율·유출률·오탐률(0~1)과</text>
  <text class="bsm" x="478" y="324.0" text-anchor="start">게이트 판정(PASS/FAIL).</text>
  <text class="bsm" x="478" y="348.5" text-anchor="start">이유는 memo에 한 줄 쓴다.</text>
  <text class="bsm" x="478" y="373.0" text-anchor="start">예) 방어가 없으니</text>
  <text class="bsm" x="478" y="397.5" text-anchor="start">유출이 많을 것이다</text>
  <rect class="box ok" x="860" y="185" width="380" height="235" rx="10"/>
  <text class="tag" x="878" y="213" text-anchor="start">3</text>
  <text class="cname" x="878" y="243" text-anchor="start">빗나가면</text>
  <text class="bsm" x="878" y="275.0" text-anchor="start">틀려도 감점이 아니다.</text>
  <text class="bsm" x="878" y="299.5" text-anchor="start">어느 가정이 틀렸는지 찾는 것이</text>
  <text class="bsm" x="878" y="324.0" text-anchor="start">목적이다. 가설 대비 표에서</text>
  <text class="bsm" x="878" y="348.5" text-anchor="start">'높게/낮게 예상'인 줄의</text>
  <text class="bsm" x="878" y="373.0" text-anchor="start">이유를 한 줄 적어 기록한다.</text>
  <rect class="th" x="60" y="445" width="1160" height="36"/>
  <text class="thtxt" x="72" y="469" text-anchor="start" style="font-size:15px">예: 가설 키</text>
  <text class="thtxt" x="330" y="469" text-anchor="start" style="font-size:15px">가설</text>
  <text class="thtxt" x="440" y="469" text-anchor="start" style="font-size:15px">실제 (95% 구간)</text>
  <text class="thtxt" x="680" y="469" text-anchor="start" style="font-size:15px">비교 결과 · 읽는 법</text>
  <rect class="td1" x="60" y="481" width="1160" height="40"/>
  <text class="tdk" x="72" y="507" text-anchor="start">ch05.no_guard.defense_rate</text>
  <text class="tdv" x="330" y="507" text-anchor="start">10%</text>
  <text class="tdv" x="440" y="507" text-anchor="start">7% [2%–21%]</text>
  <text class="tdv" x="680" y="507" text-anchor="start">적중 · 가설 10%가 구간 안이다. 예상이 맞았다</text>
  <rect class="td2" x="60" y="521" width="1160" height="40"/>
  <text class="tdk" x="72" y="547" text-anchor="start">ch05.raw_leak_rate</text>
  <text class="tdv" x="330" y="547" text-anchor="start">50%</text>
  <text class="tdv" x="440" y="547" text-anchor="start">93% [79%–98%]</text>
  <text class="tdv" x="680" y="547" text-anchor="start">낮게 예상 · 50%가 구간 밖. 모델이 더 취약했다</text>
  <rect class="td1" x="60" y="561" width="1160" height="40"/>
  <text class="tdk" x="72" y="587" text-anchor="start">ch05.guard.verdict</text>
  <text class="tdv" x="330" y="587" text-anchor="start">PASS</text>
  <text class="tdv" x="440" y="587" text-anchor="start">PASS</text>
  <text class="tdv" x="680" y="587" text-anchor="start">적중 · 판정이 같다</text>
  <rect class="warn" x="60" y="612" width="1160" height="52" rx="10"/>
  <text class="otxt" x="78" y="634.0" text-anchor="start">핵심</text>
  <text class="sm" x="78" y="654.0" text-anchor="start">가설은 맞히기 시험이 아니다. 예상과 실제의 차이에서 '내가 모델·방어를 어떻게 잘못 가정했는지'를 배운다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">16 / 32</text>
</svg>
