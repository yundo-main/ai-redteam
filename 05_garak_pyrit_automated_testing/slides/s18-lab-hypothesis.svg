  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 3 · 가설 파일 읽는 법</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">실행 전에 예상을 적어 두면, 실행 뒤 실제 측정값과 자동으로 대조된다</text>
  <rect class="cmdbg" x="60" y="180" width="520" height="330" rx="8"/>
  <text class="cm" x="78" y="206.0">hypothesis.example.json → results/hypothesis-ch05.json</text>
  <text class="cmd" x="78" y="238" xml:space="preserve" style="font-size:15px">{</text>
  <text class="cmd" x="78" y="260" xml:space="preserve" style="font-size:15px">  "predictions": {</text>
  <text class="cmd" x="78" y="282" xml:space="preserve" style="font-size:15px">    "ch05.raw_leak_rate": 0.5,</text>
  <text class="cmd" x="78" y="304" xml:space="preserve" style="font-size:15px">    "ch05.no_guard.defense_rate": 0.1,</text>
  <text class="cmd" x="78" y="326" xml:space="preserve" style="font-size:15px">    "ch05.no_guard.verdict": "FAIL",</text>
  <text class="cmd" x="78" y="348" xml:space="preserve" style="font-size:15px">    "ch05.guard.defense_rate": 1.0,</text>
  <text class="cmd" x="78" y="370" xml:space="preserve" style="font-size:15px">    "ch05.guard.false_positive_rate": 0.0,</text>
  <text class="cmd" x="78" y="392" xml:space="preserve" style="font-size:15px">    "ch05.guard.verdict": "PASS"</text>
  <text class="cmd" x="78" y="414" xml:space="preserve" style="font-size:15px">  },</text>
  <text class="cmd" x="78" y="436" xml:space="preserve" style="font-size:15px">  "memo": { "ch05.no_guard.verdict": "이유 한 줄" }</text>
  <text class="cmd" x="78" y="458" xml:space="preserve" style="font-size:15px">}</text>
  <text class="cm" x="78" y="492">+ ch05-pyrit·garak 키 3개도 같은 방식</text>
  <rect class="warn" x="60" y="530" width="520" height="120" rx="10"/>
  <text class="otxt" x="78" y="558.0">JSON 주의</text>
  <text class="sm" x="78" y="584.0">· JSON에는 주석이 없다. 설명은 readme 표에서 본다</text>
  <text class="sm" x="78" y="607.0">· 값은 0~1 숫자 또는 PASS·FAIL만. 다른 값은 오류</text>
  <text class="sm" x="78" y="630.0">· 마지막 항목 뒤에 쉼표를 붙이지 않는다</text>
  <rect class="th" x="600" y="180" width="620" height="30"/>
  <text class="thtxt" x="612" y="201" text-anchor="start" style="font-size:14px">predictions 키</text>
  <text class="thtxt" x="892" y="201" text-anchor="start" style="font-size:14px">뜻</text>
  <text class="thtxt" x="1132" y="201" text-anchor="start" style="font-size:14px">값</text>
  <rect class="td1" x="600" y="210" width="620" height="31"/>
  <text class="tdk" x="612" y="231" text-anchor="start" style="font-size:13px">ch05.raw_leak_rate</text>
  <text class="tdv" x="892" y="231" text-anchor="start" style="font-size:14px">방어 전 유출 비율</text>
  <text class="tdv" x="1132" y="231" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="td2" x="600" y="241" width="620" height="31"/>
  <text class="tdk" x="612" y="262" text-anchor="start" style="font-size:13px">ch05.no_guard.defense_rate</text>
  <text class="tdv" x="892" y="262" text-anchor="start" style="font-size:14px">방어 없음 방어율</text>
  <text class="tdv" x="1132" y="262" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="td1" x="600" y="272" width="620" height="31"/>
  <text class="tdk" x="612" y="293" text-anchor="start" style="font-size:13px">ch05.no_guard.verdict</text>
  <text class="tdv" x="892" y="293" text-anchor="start" style="font-size:14px">방어 없음 게이트 판정</text>
  <text class="tdv" x="1132" y="293" text-anchor="start" style="font-size:14px">PASS·FAIL</text>
  <rect class="td2" x="600" y="303" width="620" height="31"/>
  <text class="tdk" x="612" y="324" text-anchor="start" style="font-size:13px">ch05.guard.defense_rate</text>
  <text class="tdv" x="892" y="324" text-anchor="start" style="font-size:14px">방어 있음 방어율</text>
  <text class="tdv" x="1132" y="324" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="td1" x="600" y="334" width="620" height="31"/>
  <text class="tdk" x="612" y="355" text-anchor="start" style="font-size:13px">ch05.guard.false_positive_rate</text>
  <text class="tdv" x="892" y="355" text-anchor="start" style="font-size:14px">방어 있음 오탐률</text>
  <text class="tdv" x="1132" y="355" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="td2" x="600" y="365" width="620" height="31"/>
  <text class="tdk" x="612" y="386" text-anchor="start" style="font-size:13px">ch05.guard.verdict</text>
  <text class="tdv" x="892" y="386" text-anchor="start" style="font-size:14px">방어 있음 게이트 판정</text>
  <text class="tdv" x="1132" y="386" text-anchor="start" style="font-size:14px">PASS·FAIL</text>
  <rect class="td1" x="600" y="396" width="620" height="31"/>
  <text class="tdk" x="612" y="417" text-anchor="start" style="font-size:13px">ch05-pyrit.leak_rate</text>
  <text class="tdv" x="892" y="417" text-anchor="start" style="font-size:14px">PyRIT 공격 40건 유출 비율</text>
  <text class="tdv" x="1132" y="417" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="td2" x="600" y="427" width="620" height="31"/>
  <text class="tdk" x="612" y="448" text-anchor="start" style="font-size:13px">ch05-garak.latent_injection_asr</text>
  <text class="tdv" x="892" y="448" text-anchor="start" style="font-size:14px">Garak 문서 속 지시 성공률</text>
  <text class="tdv" x="1132" y="448" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="td1" x="600" y="458" width="620" height="31"/>
  <text class="tdk" x="612" y="479" text-anchor="start" style="font-size:13px">ch05-garak.base64_asr</text>
  <text class="tdv" x="892" y="479" text-anchor="start" style="font-size:14px">Garak Base64 해독 성공률</text>
  <text class="tdv" x="1132" y="479" text-anchor="start" style="font-size:14px">0~1</text>
  <rect class="box" x="600" y="500" width="620" height="72" rx="10"/>
  <text class="tag" x="618" y="522" text-anchor="start">대조 규칙</text>
  <text class="sm" x="618" y="543" text-anchor="start" style="font-size:14px">비율: 가설이 실제 95% 구간 안이면 적중, 밖이면 높게·낮게 예상</text>
  <text class="sm" x="618" y="562" text-anchor="start" style="font-size:14px">판정: 실제와 같으면 적중. 가설에만 있는 키는 "측정 안 됨"</text>
  <rect class="box key" x="600" y="582" width="620" height="68" rx="10"/>
  <text class="otxt" x="618" y="604" text-anchor="start">작성 시점</text>
  <text class="sm" x="618" y="625" text-anchor="start" style="font-size:14px">실행을 시작하기 전에 저장한다. 시작 뒤에 고치면</text>
  <text class="sm" x="618" y="643" text-anchor="start" style="font-size:14px">"사후 작성"으로 표시되어 사전 가설로 인정되지 않는다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">18 / 33</text>
