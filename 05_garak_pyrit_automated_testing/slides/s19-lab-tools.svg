  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 4 · 도구와 역할: PyRIT, Garak, 게이트</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">같은 모델(qwen2.5:3b)에 도구마다 다른 일을 시킨다</text>
  <rect class="box key" x="60" y="185" width="370" height="330" rx="10"/>
  <text class="tag" x="78" y="213" text-anchor="start">① 공격을 보내 채점</text>
  <text class="cname" x="78" y="245" text-anchor="start">PyRIT</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start" style="font-size:15px">우리가 정한 공격을 보낸다</text>
  <text class="bsm" x="78" y="332.0" text-anchor="start" style="font-size:15px">Target  OpenAIChatTarget</text>
  <text class="bsm" x="78" y="358.0" text-anchor="start" style="font-size:15px">Attack  PromptSendingAttack</text>
  <text class="bsm" x="78" y="384.0" text-anchor="start" style="font-size:15px">Converter  Base64Converter</text>
  <text class="bsm" x="78" y="410.0" text-anchor="start" style="font-size:15px">Scorer  SubStringScorer(카나리)</text>
  <text class="mono" x="78" y="470" text-anchor="start" style="font-size:15px">scan_pyrit.py</text>
  <text class="sm" x="78" y="495" text-anchor="start">공격 4유형 x 10회 = 40건</text>
  <rect class="box key" x="450" y="185" width="370" height="330" rx="10"/>
  <text class="tag" x="468" y="213" text-anchor="start">② 취약점을 스캔</text>
  <text class="cname" x="468" y="245" text-anchor="start">Garak</text>
  <text class="bsm" x="468" y="280.0" text-anchor="start" style="font-size:15px">내장 프로브로 스캔한다</text>
  <text class="bsm" x="468" y="332.0" text-anchor="start" style="font-size:15px">Generator  OllamaGeneratorChat</text>
  <text class="bsm" x="468" y="358.0" text-anchor="start" style="font-size:15px">Probe  latentinjection · encoding</text>
  <text class="bsm" x="468" y="384.0" text-anchor="start" style="font-size:15px">Detector  TriggerList · DecodeMatch</text>
  <text class="bsm" x="468" y="410.0" text-anchor="start" style="font-size:15px">Evaluator  리포트 passed/fails</text>
  <text class="mono" x="468" y="470" text-anchor="start" style="font-size:15px">scan_garak.py</text>
  <text class="sm" x="468" y="495" text-anchor="start">프로브 2개 x 프롬프트 30개</text>
  <rect class="box ok" x="840" y="185" width="370" height="330" rx="10"/>
  <text class="tag" x="858" y="213" text-anchor="start">③ 독립 실행: 방어 후 판정</text>
  <text class="cname" x="858" y="245" text-anchor="start">LangGraph 게이트</text>
  <text class="bsm" x="858" y="280.0" text-anchor="start" style="font-size:15px">스캐너와 독립, 자체 질문 3유형</text>
  <text class="bsm" x="858" y="332.0" text-anchor="start" style="font-size:15px">ask_model → run_cases</text>
  <text class="bsm" x="858" y="358.0" text-anchor="start" style="font-size:15px">→ aggregate → gate</text>
  <text class="bsm" x="858" y="384.0" text-anchor="start" style="font-size:15px">방어 없음 / 있음을 같은 출력에</text>
  <text class="bsm" x="858" y="410.0" text-anchor="start" style="font-size:15px">적용해 방어율·오탐률 비교</text>
  <text class="mono" x="858" y="470" text-anchor="start" style="font-size:15px">test_graph.py</text>
  <text class="sm" x="858" y="495" text-anchor="start">공격 30 + 정상 30건</text>
  <rect class="warn" x="60" y="535" width="1160" height="115" rx="10"/>
  <text class="otxt" x="78" y="561" text-anchor="start">무엇을 보는가</text>
  <text class="sm" x="78" y="586" text-anchor="start" style="font-size:16px">· PyRIT·Garak은 방어 전 모델 응답을 채점한다 → 모델이 얼마나 취약한가 (유출률·공격 성공률)</text>
  <text class="sm" x="78" y="611" text-anchor="start" style="font-size:16px">· 게이트는 같은 응답에 방어 계층을 적용한다 → 방어가 얼마나 막는가, 정상 질문은 안 막는가</text>
  <text class="sm" x="78" y="636" text-anchor="start" style="font-size:16px">· 스캐너는 무겁다: 같은 .venv에 requirements-scan.txt를 따로 추가 설치한다</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">19 / 33</text>
</svg>
