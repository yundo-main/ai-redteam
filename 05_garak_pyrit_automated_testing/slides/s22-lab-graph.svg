  <text class="tag" x="790" y="200.0" text-anchor="start">4단계</text>
  <text class="cname" x="790" y="230.0" text-anchor="start">gate</text>
  <text class="bsm" x="790" y="262.0" text-anchor="start">조건부 엣지, 기준 비교</text>
  <line class="arrow" x1="986" y1="247.0" x2="1007" y2="247.0"/>
  <polygon class="head" points="1007,247.0 998.9,250.9 998.9,243.1"/>
  <rect class="box" x="1010" y="172" width="210" height="150" rx="10"/>
  <text class="tag" x="1028" y="200.0" text-anchor="start">5단계</text>
  <text class="cname" x="1028" y="230.0" text-anchor="start">mark_pass |</text>
  <text class="cname" x="1028" y="258.0" text-anchor="start">mark_fail</text>
  <text class="bsm" x="1028" y="290.0" text-anchor="start">PASS 또는 FAIL 기록</text>
  <rect class="th" x="60" y="335" width="200" height="44"/>
  <rect class="th" x="260" y="335" width="280" height="44"/>
  <rect class="th" x="540" y="335" width="680" height="44"/>
