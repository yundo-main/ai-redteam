  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 7 · 게이트 구성: 한 번 호출, 두 번 평가</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">같은 모델 출력에 방어 없음/있음을 적용해 비교한다</text>
