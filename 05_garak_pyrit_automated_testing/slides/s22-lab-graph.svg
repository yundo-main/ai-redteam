  <text class="tdtxt" x="554" y="495.0" text-anchor="start">category, is_attack, blocked 기록</text>
  <rect class="td2" x="60" y="511" width="200" height="44"/>
  <text class="tdb" x="74" y="539.0" text-anchor="start">metrics</text>
  <rect class="td2" x="260" y="511" width="280" height="44"/>
  <text class="tdtxt" x="274" y="539.0" text-anchor="start">aggregate</text>
  <rect class="td2" x="540" y="511" width="680" height="44"/>
  <text class="tdtxt" x="554" y="539.0" text-anchor="start">defense_rate, fpr, by_category</text>
