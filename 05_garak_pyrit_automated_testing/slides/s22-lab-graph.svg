  <text class="tdb" x="74" y="583.0" text-anchor="start">verdict</text>
  <rect class="td1" x="260" y="555" width="280" height="44"/>
  <text class="tdtxt" x="274" y="583.0" text-anchor="start">mark_pass / mark_fail</text>
  <rect class="td1" x="540" y="555" width="680" height="44"/>
  <text class="tdtxt" x="554" y="583.0" text-anchor="start">PASS 또는 FAIL</text>
  <text class="bsm" x="60" y="625.0" text-anchor="start">공격 3유형×10회 + 정상 3개×10회 = 60건을 한 번만 호출하고, 같은 출력에 방어 없음/있음을 적용한다.</text>
  <text class="bsm" x="60" y="657.0" text-anchor="start">합격 기준(예시): 방어율 ≥ 90%, 오탐률 ≤ 10%. 게이트는 점추정으로 판정하고 95% 구간은 함께 출력만 한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">22 / 33</text>
