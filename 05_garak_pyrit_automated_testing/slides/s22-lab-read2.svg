<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 9 · 한계와 결론 문장</title>
  <desc id="d">표지 밖 유출, 단일 모델·실행의 한계, 실패 시 조치, 쓸 수 있는 결론과 쓸 수 없는 결론.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 9 · 한계와 결론 문장</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">100%가 증명하지 못하는 것과 증거가 받쳐 주는 말</text>
  <rect class="box" x="60" y="185" width="360" height="215" rx="10"/>
  <text class="tag" x="78" y="213.0" text-anchor="start">한계와 활용</text>
  <text class="cname" x="78" y="243.0" text-anchor="start">표지 밖의 유출은 못 잡는다</text>
  <text class="bsm" x="78" y="275.0" text-anchor="start">카나리 값을 풀어 쓰거나 일부만 노출하는</text>
  <text class="bsm" x="78" y="299.8" text-anchor="start">응답은 판정도 방어도 놓친다. 별도 케이스와</text>
  <text class="bsm" x="78" y="324.6" text-anchor="start">판정기를 추가한다.</text>
  <rect class="box" x="460" y="185" width="360" height="215" rx="10"/>
  <text class="tag" x="478" y="213.0" text-anchor="start">한계와 활용</text>
  <text class="cname" x="478" y="243.0" text-anchor="start">모델 하나, 실행 한 번</text>
  <text class="bsm" x="478" y="275.0" text-anchor="start">다른 모델에서 방어 전 유출이 다르면</text>
  <text class="bsm" x="478" y="299.8" text-anchor="start">방어율도 달라진다.</text>
  <rect class="box" x="860" y="185" width="360" height="215" rx="10"/>
  <text class="tag" x="878" y="213.0" text-anchor="start">한계와 활용</text>
  <text class="cname" x="878" y="243.0" text-anchor="start">FAIL이 나오면</text>
  <text class="bsm" x="878" y="275.0" text-anchor="start">유형별 방어율에서 낮은 유형을 찾고 실패</text>
  <text class="bsm" x="878" y="299.8" text-anchor="start">응답을 사람이 읽어 규칙 문제인지 판정</text>
  <text class="bsm" x="878" y="324.6" text-anchor="start">문제인지 가른다. 고친 뒤 같은 입력으로</text>
  <text class="bsm" x="878" y="349.4" text-anchor="start">재실행한다.</text>
  <rect class="th" x="60" y="420" width="560" height="44"/>
  <rect class="th" x="620" y="420" width="600" height="44"/>
  <text class="thtxt" x="74" y="448.0" text-anchor="start">쓸 수 있다</text>
  <text class="thtxt" x="634" y="448.0" text-anchor="start">쓸 수 없다</text>
  <rect class="td1" x="60" y="464" width="560" height="44"/>
  <text class="tdtxt" x="74" y="492.0" text-anchor="start">방어 없음은 7%(2/30)로 FAIL, 있음은 30/30(하한 89%)으로 PASS</text>
  <rect class="td1" x="620" y="464" width="600" height="44"/>
  <text class="tdtxt" x="634" y="492.0" text-anchor="start">방어율 100%다</text>
  <rect class="td2" x="60" y="508" width="560" height="44"/>
  <text class="tdtxt" x="74" y="536.0" text-anchor="start">방어 전 유출 93%(28/30)이므로 방어 효과를 비교할 수 있다</text>
  <rect class="td2" x="620" y="508" width="600" height="44"/>
  <text class="tdtxt" x="634" y="536.0" text-anchor="start">모델은 안전하다</text>
  <rect class="td1" x="60" y="552" width="560" height="44"/>
  <text class="tdtxt" x="74" y="580.0" text-anchor="start">카나리·도메인 표지 밖의 유출은 확인하지 않았다</text>
  <rect class="td1" x="620" y="552" width="600" height="44"/>
  <text class="tdtxt" x="634" y="580.0" text-anchor="start">모든 유출 유형을 막는다</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">22 / 25</text>
</svg>
