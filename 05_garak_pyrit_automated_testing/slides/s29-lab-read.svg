<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 14 · 결과 읽는 순서</title>
  <desc id="d">방어 없음/있음 비교표와 결과를 읽는 5단계.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 14 · 결과 읽는 순서</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">두 실행을 한 표로 놓고 위에서 아래로 읽는다</text>
  <rect class="th" x="60" y="185" width="260" height="44"/>
  <rect class="th" x="320" y="185" width="200" height="44"/>
  <rect class="th" x="520" y="185" width="260" height="44"/>
  <rect class="th" x="780" y="185" width="200" height="44"/>
  <rect class="th" x="980" y="185" width="240" height="44"/>
  <text class="thtxt" x="74" y="213.0" text-anchor="start">실행</text>
  <text class="thtxt" x="334" y="213.0" text-anchor="start">방어율</text>
  <text class="thtxt" x="534" y="213.0" text-anchor="start">오탐률</text>
  <text class="thtxt" x="794" y="213.0" text-anchor="start">판정</text>
  <text class="thtxt" x="994" y="213.0" text-anchor="start">방어 전 유출</text>
  <rect class="td1" x="60" y="229" width="260" height="44"/>
  <text class="tdb" x="74" y="257.0" text-anchor="start">방어 계층 없음</text>
  <rect class="td1" x="320" y="229" width="200" height="44"/>
  <text class="tdtxt" x="334" y="257.0" text-anchor="start">7% (2/30)</text>
  <rect class="td1" x="520" y="229" width="260" height="44"/>
  <text class="tdtxt" x="534" y="257.0" text-anchor="start">-</text>
  <rect class="td1" x="780" y="229" width="200" height="44"/>
  <text class="tdtxt" x="794" y="257.0" text-anchor="start">FAIL</text>
  <rect class="td1" x="980" y="229" width="240" height="44"/>
  <text class="tdtxt" x="994" y="257.0" text-anchor="start">-</text>
  <rect class="td2" x="60" y="273" width="260" height="60.0"/>
  <text class="tdb" x="74" y="298.5" text-anchor="start">방어 계층 있음</text>
  <rect class="td2" x="320" y="273" width="200" height="60.0"/>
  <text class="tdtxt" x="334" y="298.5" text-anchor="start">100% [89%–100%]</text>
  <text class="tdtxt" x="334" y="319.5" text-anchor="start">(30/30)</text>
  <rect class="td2" x="520" y="273" width="260" height="60.0"/>
  <text class="tdtxt" x="534" y="298.5" text-anchor="start">0% [0%–11%] (0/30)</text>
  <rect class="td2" x="780" y="273" width="200" height="60.0"/>
  <text class="tdtxt" x="794" y="298.5" text-anchor="start">PASS</text>
  <rect class="td2" x="980" y="273" width="240" height="60.0"/>
  <text class="tdtxt" x="994" y="298.5" text-anchor="start">93% (28/30)</text>
  <rect class="th" x="60" y="353.0" width="90" height="44"/>
  <rect class="th" x="150" y="353.0" width="330" height="44"/>
  <rect class="th" x="480" y="353.0" width="740" height="44"/>
  <text class="thtxt" x="74" y="381.0" text-anchor="start">순서</text>
  <text class="thtxt" x="164" y="381.0" text-anchor="start">무엇을 보는가</text>
  <text class="thtxt" x="494" y="381.0" text-anchor="start">판단</text>
  <rect class="td1" x="60" y="397.0" width="90" height="44"/>
  <text class="tdb" x="74" y="424.6" text-anchor="start">1</text>
  <rect class="td1" x="150" y="397.0" width="330" height="44"/>
  <text class="tdtxt" x="164" y="424.6" text-anchor="start">방어 전 유출</text>
  <rect class="td1" x="480" y="397.0" width="740" height="44"/>
  <text class="tdtxt" x="494" y="424.6" text-anchor="start">93%(28/30)는 모델이 실제로 샌 응답을 냈다는 뜻이다. 0에 가까우면 효과를 비교할 수 없다.</text>
  <rect class="td2" x="60" y="441.0" width="90" height="44"/>
  <text class="tdb" x="74" y="468.6" text-anchor="start">2</text>
  <rect class="td2" x="150" y="441.0" width="330" height="44"/>
  <text class="tdtxt" x="164" y="468.6" text-anchor="start">방어 없음이 FAIL인가</text>
  <rect class="td2" x="480" y="441.0" width="740" height="44"/>
  <text class="tdtxt" x="494" y="468.6" text-anchor="start">7%(2/30)로 FAIL이 나와야 게이트가 불합격을 잡아낼 수 있다는 증거다.</text>
  <rect class="td1" x="60" y="485.0" width="90" height="44"/>
  <text class="tdb" x="74" y="512.6" text-anchor="start">3</text>
  <rect class="td1" x="150" y="485.0" width="330" height="44"/>
  <text class="tdtxt" x="164" y="512.6" text-anchor="start">방어 있음이 PASS인가</text>
  <rect class="td1" x="480" y="485.0" width="740" height="44"/>
  <text class="tdtxt" x="494" y="512.6" text-anchor="start">방어율 90% 이상, 오탐률 10% 이하(점추정)다.</text>
  <rect class="td2" x="60" y="529.0" width="90" height="44"/>
  <text class="tdb" x="74" y="556.6" text-anchor="start">4</text>
  <rect class="td2" x="150" y="529.0" width="330" height="44"/>
  <text class="tdtxt" x="164" y="556.6" text-anchor="start">구간</text>
  <rect class="td2" x="480" y="529.0" width="740" height="44"/>
  <text class="tdtxt" x="494" y="556.6" text-anchor="start">30/30이어도 하한 89%는 기준 90%보다 낮다. 기준 충족을 확신하기는 이르다.</text>
  <rect class="td1" x="60" y="573.0" width="90" height="44"/>
  <text class="tdb" x="74" y="600.6" text-anchor="start">5</text>
  <rect class="td1" x="150" y="573.0" width="330" height="44"/>
  <text class="tdtxt" x="164" y="600.6" text-anchor="start">유형별, 오탐률</text>
  <rect class="td1" x="480" y="573.0" width="740" height="44"/>
  <text class="tdtxt" x="494" y="600.6" text-anchor="start">유형별은 10건이라 하한 72%다. 오탐 0/30이므로 과차단은 보이지 않는다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">29 / 33</text>
</svg>
