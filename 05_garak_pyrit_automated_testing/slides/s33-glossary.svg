<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">용어 설명</title>
  <desc id="d">Garak, PyRIT, Probe &amp; Detector 등 용어.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-5</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">용어 설명</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">6-5에서 쓰는 용어</text>
  <rect class="th" x="60" y="190" width="330" height="44"/>
  <rect class="th" x="390" y="190" width="830" height="44"/>
  <text class="thtxt" x="74" y="218.0" text-anchor="start">용어</text>
  <text class="thtxt" x="404" y="218.0" text-anchor="start">설명</text>
  <rect class="td1" x="60" y="234" width="330" height="44"/>
  <text class="tdb" x="74" y="262.4" text-anchor="start">Garak</text>
  <rect class="td1" x="390" y="234" width="830" height="44"/>
  <text class="tdtxt" x="404" y="262.4" text-anchor="start">LLM의 프롬프트 인젝션, 탈옥, 환각 취약점을 자동 스캔하는 오픈소스 프레임워크</text>
  <rect class="td2" x="60" y="278" width="330" height="44"/>
  <text class="tdb" x="74" y="306.4" text-anchor="start">PyRIT</text>
  <rect class="td2" x="390" y="278" width="830" height="44"/>
  <text class="tdtxt" x="404" y="306.4" text-anchor="start">Python Risk Identification Tool. Microsoft가 만든 AI 시스템 자동 레드팀 SDK</text>
  <rect class="td1" x="60" y="322" width="330" height="44"/>
  <text class="tdb" x="74" y="350.4" text-anchor="start">Automated Vulnerability Scan</text>
  <rect class="td1" x="390" y="322" width="830" height="44"/>
  <text class="tdtxt" x="404" y="350.4" text-anchor="start">다양한 적대적 프롬프트 페이로드를 자동 생성해 LLM에 반복 전송하는 진단</text>
  <rect class="td2" x="60" y="366" width="330" height="44"/>
  <text class="tdb" x="74" y="394.4" text-anchor="start">Probe &amp; Detector</text>
  <rect class="td2" x="390" y="366" width="830" height="44"/>
  <text class="tdtxt" x="404" y="394.4" text-anchor="start">Garak에서 공격 프롬프트 전송(Probe)과 응답 취약점 판정(Detector)을 수행하는 모듈</text>
  <rect class="td1" x="60" y="410" width="330" height="44"/>
  <text class="tdb" x="74" y="438.4" text-anchor="start">Scanning Report</text>
  <rect class="td1" x="390" y="410" width="830" height="44"/>
  <text class="tdtxt" x="404" y="438.4" text-anchor="start">자동 스캔 결과 취약점 통과율, 성공 공격 유형 및 위험 수준을 수록한 보고서</text>
  <rect class="td2" x="60" y="454" width="330" height="44"/>
  <text class="tdb" x="74" y="482.4" text-anchor="start">ROE (Rules of Engagement)</text>
  <rect class="td2" x="390" y="454" width="830" height="44"/>
  <text class="tdtxt" x="404" y="482.4" text-anchor="start">테스트 전에 합의하는 허용·금지 범위 문서</text>
  <rect class="td1" x="60" y="498" width="330" height="44"/>
  <text class="tdb" x="74" y="526.4" text-anchor="start">Converter (PyRIT)</text>
  <rect class="td1" x="390" y="498" width="830" height="44"/>
  <text class="tdtxt" x="404" y="526.4" text-anchor="start">프롬프트를 인코딩·번역·난독화로 바꿔 보내는 구성 요소 (실습: Base64Converter)</text>
  <rect class="td2" x="60" y="542" width="330" height="44"/>
  <text class="tdb" x="74" y="570.4" text-anchor="start">Scorer (PyRIT)</text>
  <rect class="td2" x="390" y="542" width="830" height="44"/>
  <text class="tdtxt" x="404" y="570.4" text-anchor="start">응답이 공격 목표를 달성했는지 판정하는 구성 요소 (실습: SubStringScorer로 카나리 검사)</text>
  <rect class="td1" x="60" y="586" width="330" height="44"/>
  <text class="tdb" x="74" y="614.4" text-anchor="start">카나리 (Canary)</text>
  <rect class="td1" x="390" y="586" width="830" height="44"/>
  <text class="tdtxt" x="404" y="614.4" text-anchor="start">유출 여부를 확인하려고 심어 둔 더미 값. 실제 비밀은 쓰지 않는다</text>
  <rect class="td2" x="60" y="630" width="330" height="44"/>
  <text class="tdb" x="74" y="658.4" text-anchor="start">게이트 (Gate)</text>
  <rect class="td2" x="390" y="630" width="830" height="44"/>
  <text class="tdtxt" x="404" y="658.4" text-anchor="start">방어율·오탐률이 합격 기준을 넘는지 PASS/FAIL로 판정하는 단계 (실습: test_graph.py)</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-5</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">33 / 33</text>
</svg>
