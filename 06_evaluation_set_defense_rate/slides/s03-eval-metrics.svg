<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">평가셋과 방어율·오탐률</title>
  <desc id="d">공격 평가셋은 방어율을, 정상 평가셋은 오탐률을 산출한다. 필터 강도에 따라 두 지표는 상충한다.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90.0" y="60" text-anchor="middle">6-6</text>
  <text class="stitle" x="60" y="118">평가셋 → 방어율 · 오탐률</text>
  <text class="ssub" x="60" y="154">방어율과 오탐률을 함께 보고, 유형별로 분리해서 본다</text>
  <g transform="translate(37.7,130) scale(1.115)">
    <rect class="box" x="20" y="70" width="230" height="80" rx="8"/>
    <text class="name" x="135.0" y="103.5" text-anchor="middle">공격 평가셋</text>
    <text class="sub" x="135.0" y="128.5" text-anchor="middle">인젝션·탈옥·유출·도구 오용</text>
    <rect class="box ok" x="20" y="190" width="230" height="80" rx="8"/>
    <text class="name" x="135.0" y="223.5" text-anchor="middle">정상(Benign) 평가셋</text>
    <text class="sub" x="135.0" y="248.5" text-anchor="middle">일반 요청 + 경계 사례</text>
    <rect class="box" x="380" y="100" width="250" height="140" rx="8"/>
    <text class="name" x="505.0" y="155.5" text-anchor="middle">대상 시스템</text>
    <text class="sub" x="505.0" y="180.5" text-anchor="middle">모델 + 가드레일</text>
    <text class="sub" x="505.0" y="196.5" text-anchor="middle">(여러 번 반복 실행)</text>
    <line class="arrow" x1="250" y1="110" x2="372.4" y2="147.6"/>
    <polygon class="head" points="380,150 371.2,151.5 373.5,143.8"/>
    <line class="arrow" x1="250" y1="230" x2="372.4" y2="192.4"/>
    <polygon class="head" points="380,190 373.5,196.2 371.2,188.5"/>
    <rect class="box" x="760" y="70" width="265" height="80" rx="8"/>
    <text class="name" x="892.5" y="103.5" text-anchor="middle">방어율 = 차단 ÷ 공격 수</text>
    <text class="sub" x="892.5" y="128.5" text-anchor="middle">ASR = 1 − 방어율 (낮을수록 안전)</text>
    <rect class="box ok" x="760" y="190" width="265" height="80" rx="8"/>
    <text class="name" x="892.5" y="223.5" text-anchor="middle">오탐률 = 오차단 ÷ 정상 수</text>
    <text class="sub" x="892.5" y="248.5" text-anchor="middle">낮을수록 사용성 우수</text>
    <line class="arrow" x1="630" y1="150" x2="752.4" y2="112.4"/>
    <polygon class="head" points="760,110 753.5,116.2 751.2,108.5"/>
    <line class="arrow" x1="630" y1="190" x2="752.4" y2="227.6"/>
    <polygon class="head" points="760,230 751.2,231.5 753.5,223.8"/>
    <line class="arrow" x1="380" y1="312" x2="632.0" y2="312.0"/>
    <polygon class="head" points="640,312 632.0,316.0 632.0,308.0"/>
    <text class="sub" x="20" y="308" text-anchor="start">필터 느슨</text>
    <text class="sub" x="654" y="308" text-anchor="start">필터 엄격</text>
    <text class="note" x="510" y="334" text-anchor="middle">엄격할수록 방어율 ↑ 이지만 오탐률도 ↑  (상충, 허용 기준을 사전에 합의)</text>
    <text class="note" x="20" y="364" text-anchor="start">유형별로 분리해서 본다: 평균 방어율이 높아도 특정 유형이 낮으면 그것이 실제 위험이다.</text>
  </g>
  <text class="foot" x="60" y="694">AI Red Team · 6-6</text>
  <text class="foot" x="1220" y="694" text-anchor="end">3 / 19</text>
</svg>
