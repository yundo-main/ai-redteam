    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-6</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">통계적 고려</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">표본 크기가 결론의 강도를 정한다</text>
  <rect class="box" x="60" y="190" width="373" height="190" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">통계적 고려</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">반복 실행</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start">모델은 비결정적이므로 같은 케이스를 여러 번</text>
  <text class="bsm" x="78" y="304.8" text-anchor="start">실행해 성공률로 표현한다.</text>
  <rect class="box" x="453" y="190" width="373" height="190" rx="10"/>
  <text class="tag" x="471" y="218.0" text-anchor="start">통계적 고려</text>
  <text class="cname" x="471" y="248.0" text-anchor="start">신뢰 구간</text>
  <text class="bsm" x="471" y="280.0" text-anchor="start">표본이 작으면 방어율의 신뢰 구간이 넓다.</text>
  <text class="bsm" x="471" y="304.8" text-anchor="start">케이스 수와 반복 수를 함께 보고한다.</text>
  <rect class="box" x="846" y="190" width="373" height="190" rx="10"/>
  <text class="tag" x="864" y="218.0" text-anchor="start">통계적 고려</text>
  <text class="cname" x="864" y="248.0" text-anchor="start">우연 변동</text>
  <text class="bsm" x="864" y="280.0" text-anchor="start">변경 전후 차이가 우연 변동 범위를 넘는지</text>
  <text class="bsm" x="864" y="304.8" text-anchor="start">확인한다.</text>
  <rect class="box key" x="60" y="410" width="1160" height="200" rx="10"/>
  <text class="tag" x="78" y="438.0" text-anchor="start">예제 코드: 06 일차의 src/</text>
  <text class="bsm" x="78" y="468.0" text-anchor="start">· stats.py의 Wilson 95% 신뢰구간(fmt, differs)과 evalset.py가 위 내용을 구현한다.</text>
  <text class="bsm" x="78" y="492.8" text-anchor="start">· 공격·정상 각 30건 실행에서 방어율 30/30이어도 하한은 약 89%, 유형별(10건씩) 10/10이어도 하한은 72%다. 표본 크기가 결론의 강도를 정한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-6</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">10 / 26</text>
</svg>
