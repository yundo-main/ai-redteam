  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-6</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">벤치마크와 회귀 테스트</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">변경마다 같은 평가셋으로 재검증한다</text>
  <rect class="box" x="60" y="195" width="373" height="280" rx="10"/>
  <text class="tag" x="78" y="223.0" text-anchor="start">벤치마크와 회귀</text>
  <text class="cname" x="78" y="253.0" text-anchor="start">Benchmark Suite</text>
  <text class="bsm" x="78" y="285.0" text-anchor="start">배포 전 보안 표준 충족 여부를 판단하는 종합</text>
  <text class="bsm" x="78" y="309.8" text-anchor="start">평가 묶음. 합격 기준(게이트)을 두면 릴리스</text>
  <text class="bsm" x="78" y="334.6" text-anchor="start">판단에 쓸 수 있다.</text>
  <rect class="box key" x="453" y="195" width="373" height="280" rx="10"/>
  <text class="tag" x="471" y="223.0" text-anchor="start">벤치마크와 회귀</text>
  <text class="cname" x="471" y="253.0" text-anchor="start">Regression Testing</text>
  <text class="bsm" x="471" y="285.0" text-anchor="start">모델 교체, 프롬프트 수정, 가드레일</text>
  <text class="bsm" x="471" y="309.8" text-anchor="start">업데이트, 보안 패치 후 기존 공격에 대한</text>
  <text class="bsm" x="471" y="334.6" text-anchor="start">방어력이 유지되는지 동일 평가셋으로</text>
  <text class="bsm" x="471" y="359.4" text-anchor="start">재검증한다.</text>
  <rect class="box" x="846" y="195" width="373" height="280" rx="10"/>
  <text class="tag" x="864" y="223.0" text-anchor="start">벤치마크와 회귀</text>
  <text class="cname" x="864" y="253.0" text-anchor="start">영구 편입</text>
  <text class="bsm" x="864" y="285.0" text-anchor="start">발견된 취약점은 수정 후 평가셋에 영구 편입해</text>
  <text class="bsm" x="864" y="309.8" text-anchor="start">같은 문제가 재발하지 않게 한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-6</text>
