  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 1 · 평가셋 도구 실행</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">평가셋과 결과로 방어율을 계산한다</text>
  <circle class="circ" cx="84" cy="221" r="16"/>
  <text class="circt" x="84" y="227.0" text-anchor="middle">1</text>
  <rect class="cmdbg" x="116" y="185" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="216.0" text-anchor="start">python -m unittest -v</text>
  <text class="cmd" x="132" y="238.0" text-anchor="start">  06_evaluation_set_defense_rate/src/test_evalset.py</text>
  <text class="bsm" x="776" y="207.0" text-anchor="start">[LLM 불필요] 검증·계산·게이트 규칙이 맞는가 (18개 통과)</text>
  <circle class="circ" cx="84" cy="294" r="16"/>
  <text class="circt" x="84" y="300.0" text-anchor="middle">2</text>
  <rect class="cmdbg" x="116" y="269" width="640" height="50" rx="8"/>
  <text class="cmd" x="132" y="300.0" text-anchor="start">python 06_evaluation_set_defense_rate/src/evalset.py</text>
  <text class="bsm" x="776" y="291.0" text-anchor="start">저장소 루트에서 예제 평가셋과 예제 결과로 지표를 계산한다</text>
  <circle class="circ" cx="84" cy="367" r="16"/>
  <text class="circt" x="84" y="373.0" text-anchor="middle">3</text>
  <rect class="cmdbg" x="116" y="331" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="362.0" text-anchor="start">python 06_evaluation_set_defense_rate/src/evalset.py</text>
  <text class="cmd" x="132" y="384.0" text-anchor="start">  --max-asr 0.2 --max-fpr 0.1</text>
  <text class="bsm" x="776" y="353.0" text-anchor="start">합격 기준(게이트)까지 판정한다</text>
  <rect class="box key" x="60" y="435" width="1160" height="150" rx="10"/>
  <text class="tag" x="78" y="463.0" text-anchor="start">주의</text>
  <text class="bsm" x="78" y="493.0" text-anchor="start">예제 파일의 값은 설명용 더미다. evalset.py는 모델을 호출하지 않고, 이미 얻은 차단 여부를 받아 계산만 한다.</text>
  <text class="bsm" x="78" y="517.8" text-anchor="start">실제 측정은 6-3~6-5 도구나 직접 만든 결과를 outcomes JSON으로 옮겨 넣는다. 심각도 가중치(low 1, medium 2, high 3)는 이 실습의 가정값이다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-6</text>
