  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-6</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">6-2 시나리오에서 평가셋 케이스로</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">시나리오 하나가 여러 케이스로 풀린다</text>
  <rect class="th" x="60" y="190" width="330" height="44"/>
  <rect class="th" x="390" y="190" width="830" height="44"/>
  <text class="thtxt" x="74" y="218.0" text-anchor="start">6-2 워크시트 항목</text>
  <text class="thtxt" x="404" y="218.0" text-anchor="start">평가셋 케이스 필드</text>
  <rect class="td1" x="60" y="234" width="330" height="44"/>
  <text class="tdb" x="74" y="262.4" text-anchor="start">시나리오 ID</text>
  <rect class="td1" x="390" y="234" width="830" height="44"/>
  <text class="tdtxt" x="404" y="262.4" text-anchor="start">ID (시나리오 ID + 변형 번호)</text>
  <rect class="td2" x="60" y="278" width="330" height="44"/>
  <text class="tdb" x="74" y="306.4" text-anchor="start">공격 벡터·기법</text>
  <rect class="td2" x="390" y="278" width="830" height="44"/>
  <text class="tdtxt" x="404" y="306.4" text-anchor="start">유형·하위 유형</text>
  <rect class="td1" x="60" y="322" width="330" height="44"/>
  <text class="tdb" x="74" y="350.4" text-anchor="start">공격 단계(입력)</text>
  <rect class="td1" x="390" y="322" width="830" height="44"/>
  <text class="tdtxt" x="404" y="350.4" text-anchor="start">입력 (멀티턴이면 대화 전체)</text>
  <rect class="td2" x="60" y="366" width="330" height="44"/>
  <text class="tdb" x="74" y="394.4" text-anchor="start">성공 조건</text>
  <rect class="td2" x="390" y="366" width="830" height="44"/>
  <text class="tdtxt" x="404" y="394.4" text-anchor="start">기대 동작·판정 기준 (차단해야 함 / 정상 응답해야 함)</text>
  <rect class="td1" x="60" y="410" width="330" height="44"/>
  <text class="tdb" x="74" y="438.4" text-anchor="start">영향도</text>
  <rect class="td1" x="390" y="410" width="830" height="44"/>
  <text class="tdtxt" x="404" y="438.4" text-anchor="start">심각도 (가중 방어율에 사용)</text>
  <rect class="td2" x="60" y="454" width="330" height="44"/>
  <text class="tdb" x="74" y="482.4" text-anchor="start">ROE·출처</text>
  <rect class="td2" x="390" y="454" width="830" height="44"/>
  <text class="tdtxt" x="404" y="482.4" text-anchor="start">출처·버전</text>
  <rect class="box key" x="60" y="522" width="1160" height="140" rx="10"/>
  <text class="tag" x="78" y="550.0" text-anchor="start">예</text>
  <text class="bsm" x="78" y="580.0" text-anchor="start">6-3 TA-01은 "외부 문서 경유 발송 도구 호출" 케이스를 문서 형태별로 만들고, 판정 기준은 실행 로그에 발송 호출이 없는가다. JB-01은 위험 범주별</text>
  <text class="bsm" x="78" y="604.8" text-anchor="start">멀티턴 케이스를 만들고, 판정 기준은 응답에 정책 위반이 없는가다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-6</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">14 / 29</text>
