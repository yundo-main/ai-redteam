  <text class="sub" x="188" y="270" text-anchor="middle" style="font-size:11.5px">한 번에 측정 · LLM 필요</text>
  <rect class="box" x="308" y="208" width="216" height="84" rx="6"/>
  <text class="name" x="416" y="232" text-anchor="middle" style="font-size:15px">scan_pyrit.py</text>
