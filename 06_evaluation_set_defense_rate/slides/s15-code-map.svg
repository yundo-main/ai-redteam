  <rect class="box" x="60" y="328" width="1160" height="112" rx="10" style="fill-opacity:.35"/>
  <text class="num" x="80" y="352" style="font-size:15px">target/  공격 대상과 방어</text>
  <rect class="box" x="80" y="360" width="262" height="70" rx="6"/>
  <text class="name" x="211" y="384" text-anchor="middle" style="font-size:15px">garak_target.py</text>
  <text class="sub" x="211" y="404" text-anchor="middle" style="font-size:12px">Garak 호출: 입력 → 모델 → 출력</text>
  <rect class="box" x="366" y="360" width="262" height="70" rx="6"/>
  <text class="name" x="497" y="384" text-anchor="middle" style="font-size:15px">pyrit_target.py</text>
  <text class="sub" x="497" y="404" text-anchor="middle" style="font-size:12px">PyRIT 앞뒤: 입력 검사·응답 검사</text>
  <rect class="box" x="652" y="360" width="262" height="70" rx="6"/>
  <text class="name" x="783" y="384" text-anchor="middle" style="font-size:15px">input_guard.py</text>
  <text class="sub" x="783" y="404" text-anchor="middle" style="font-size:12px">입력 방어: 지시·Base64 검사</text>
  <rect class="box" x="938" y="360" width="262" height="70" rx="6"/>
  <text class="name" x="1069" y="384" text-anchor="middle" style="font-size:15px">output_guard.py</text>
  <text class="sub" x="1069" y="404" text-anchor="middle" style="font-size:12px">출력 방어: 카나리·외부 링크</text>
  <line class="arrow" x1="640" y1="440" x2="640" y2="457"/>
  <polygon class="head" points="640,466 635,457 645,457"/>
  <rect class="box" x="60" y="466" width="1160" height="92" rx="10" style="fill-opacity:.35"/>
  <text class="num" x="80" y="490" style="font-size:15px">base/  기반 — 다른 계층에 의존하지 않는다</text>
  <rect class="box" x="80" y="500" width="340" height="50" rx="6"/>
  <text class="name" x="250.0" y="524" text-anchor="middle" style="font-size:15px">llm.py</text>
  <text class="sub" x="250.0" y="544" text-anchor="middle" style="font-size:12px">Ollama 호출·ready()</text>
  <rect class="box" x="450" y="500" width="340" height="50" rx="6"/>
  <text class="name" x="620.0" y="524" text-anchor="middle" style="font-size:15px">stats.py</text>
  <text class="sub" x="620.0" y="544" text-anchor="middle" style="font-size:12px">Wilson 신뢰구간·반복 횟수</text>
  <rect class="box" x="820" y="500" width="380" height="50" rx="6"/>
  <text class="name" x="1010.0" y="524" text-anchor="middle" style="font-size:15px">hypothesis_log.py</text>
  <text class="sub" x="1010.0" y="544" text-anchor="middle" style="font-size:12px">가설 대조·결과 저장</text>
