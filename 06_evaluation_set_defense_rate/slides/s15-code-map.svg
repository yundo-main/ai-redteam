  <text class="sub" x="416" y="270" text-anchor="middle" style="font-size:11.5px">GUARD=1 지원 · LLM 필요</text>
  <rect class="box" x="536" y="208" width="216" height="84" rx="6"/>
  <text class="name" x="644" y="232" text-anchor="middle" style="font-size:15px">scan_garak.py</text>
  <text class="sub" x="644" y="252" text-anchor="middle" style="font-size:11.5px">Garak 프로브 2개 + 정상 질문</text>
  <text class="sub" x="644" y="270" text-anchor="middle" style="font-size:11.5px">GUARD=1 지원 · LLM 필요</text>
  <rect class="box key" x="764" y="208" width="216" height="84" rx="6"/>
  <text class="name" x="872" y="232" text-anchor="middle" style="font-size:15px">from_scan.py</text>
  <text class="sub" x="872" y="252" text-anchor="middle" style="font-size:11.5px">스캔 기록 → 평가셋·결과 JSON</text>
  <text class="sub" x="872" y="270" text-anchor="middle" style="font-size:11.5px">변환 후 지표 출력</text>
  <rect class="box key" x="992" y="208" width="216" height="84" rx="6"/>
  <text class="name" x="1100" y="232" text-anchor="middle" style="font-size:15px">evalset.py</text>
  <text class="sub" x="1100" y="252" text-anchor="middle" style="font-size:11.5px">검증 · 지표 · 게이트 판정</text>
  <text class="sub" x="1100" y="270" text-anchor="middle" style="font-size:11.5px">모델 호출 없음</text>
  <line class="arrow" x1="640" y1="302" x2="640" y2="319"/>
  <polygon class="head" points="640,328 635,319 645,319"/>
