<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 흐름 — 스캔 결과로 평가셋 지표 만들기</title>
  <desc id="d">measure.py 가 Garak·PyRIT 스캔 4번(방어 없음, GUARD=1)을 실행하고 from_scan.py 변환과 evalset.py 계산(방어율·오탐률·게이트)까지 한 번에 하는 흐름.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60" text-anchor="middle">6-6</text>
  <text class="stitle" x="60" y="118">실습 흐름 — 측정하고 평가셋 지표 만들기</text>
  <text class="ssub" x="60" y="154">measure.py 한 번이 스캔 4번 → 변환 → 계산을 모두 실행한다 (raw·guard 두 벌)</text>
  <rect class="loop" x="48" y="172" width="1184" height="336" rx="12"/>
  <text class="note" x="1216" y="192" text-anchor="end" style="font-size:13px">measure.py 가 ①~⑥ 을 한 번에 실행</text>
  <rect class="box" x="60" y="196" width="420" height="68" rx="8"/>
  <text class="name" x="270" y="220" text-anchor="middle" style="font-size:16px">① scan_pyrit.py (방어 없음)</text>
  <text class="sub" x="270" y="238" text-anchor="middle" style="font-size:12.5px">모델 원본 기준선 + 정상 질문</text>
  <text class="sub" x="270" y="254" text-anchor="middle" style="font-size:12.5px">→ results/ch06-pyrit-raw.json</text>
  <line class="arrow" x1="480" y1="230" x2="551" y2="230"/>
  <polygon class="head" points="560,230 551,225 551,235"/>
  <rect class="box" x="60" y="272" width="420" height="68" rx="8"/>
  <text class="name" x="270" y="296" text-anchor="middle" style="font-size:16px">② scan_pyrit.py GUARD=1</text>
  <text class="sub" x="270" y="314" text-anchor="middle" style="font-size:12.5px">입력·출력 가드 통과 후 채점</text>
  <text class="sub" x="270" y="330" text-anchor="middle" style="font-size:12.5px">→ results/ch06-pyrit-guard.json</text>
  <line class="arrow" x1="480" y1="306" x2="551" y2="306"/>
  <polygon class="head" points="560,306 551,301 551,311"/>
  <rect class="box" x="60" y="348" width="420" height="68" rx="8"/>
  <text class="name" x="270" y="372" text-anchor="middle" style="font-size:16px">③ scan_garak.py (방어 없음)</text>
  <text class="sub" x="270" y="390" text-anchor="middle" style="font-size:12.5px">Garak 프로브 2개 · 모델 원본</text>
  <text class="sub" x="270" y="406" text-anchor="middle" style="font-size:12.5px">→ results/ch06-garak-raw.json</text>
  <line class="arrow" x1="480" y1="382" x2="551" y2="382"/>
  <polygon class="head" points="560,382 551,377 551,387"/>
  <rect class="box" x="60" y="424" width="420" height="68" rx="8"/>
  <text class="name" x="270" y="448" text-anchor="middle" style="font-size:16px">④ scan_garak.py GUARD=1</text>
  <text class="sub" x="270" y="466" text-anchor="middle" style="font-size:12.5px">가드 통과 후 채점 + 정상 질문</text>
  <text class="sub" x="270" y="482" text-anchor="middle" style="font-size:12.5px">→ results/ch06-garak-guard.json</text>
  <line class="arrow" x1="480" y1="458" x2="551" y2="458"/>
  <polygon class="head" points="560,458 551,453 551,463"/>
  <rect class="box key" x="560" y="196" width="280" height="296" rx="8"/>
  <text class="name" x="700" y="226" text-anchor="middle">⑤ from_scan.py</text>
  <text class="sub" x="700" y="248" text-anchor="middle">raw 와 guard 로 각각 변환</text>
  <text class="sub" x="700" y="290" text-anchor="middle">케이스 8개 (GA-01~02, PY-01~04,</text>
  <text class="sub" x="700" y="311" text-anchor="middle">정상 OK-01·OK-02)</text>
  <text class="sub" x="700" y="353" text-anchor="middle">성공 k/n 을 blocked 목록으로 펼침</text>
  <text class="sub" x="700" y="374" text-anchor="middle">→ results/raw|guard/</text>
  <text class="sub" x="700" y="395" text-anchor="middle">ch06-evalset·outcomes.json</text>
  <line class="arrow" x1="840" y1="344" x2="911" y2="344"/>
  <polygon class="head" points="920,344 911,339 911,349"/>
  <rect class="box key" x="920" y="196" width="300" height="296" rx="8"/>
  <text class="name" x="1070" y="226" text-anchor="middle">⑥ evalset.py</text>
  <text class="sub" x="1070" y="248" text-anchor="middle">방어율 · 오탐률 · 유형별</text>
  <text class="sub" x="1070" y="269" text-anchor="middle">심각도 가중 (Wilson 95% 구간)</text>
  <text class="sub" x="1070" y="311" text-anchor="middle">게이트 PASS / 표본 부족 / FAIL</text>
  <text class="sub" x="1070" y="353" text-anchor="middle">--max-asr 0.2 --max-fpr 0.1</text>
  <rect class="box ok" x="60" y="522" width="1160" height="96" rx="8"/>
  <text class="name" x="80" y="548">읽는 법 (qwen2.5:3b, --quick 예시)</text>
  <text class="sub" x="80" y="572">방어율 56% [39%–72%] (방어 없음) → 84% [68%–93%] (GUARD=1). 오탐률은 정상 질문을 따로 보내 잰다: 0/15 → 0/30</text>
  <text class="sub" x="80" y="594">--quick 은 시도가 적어 구간이 넓어 게이트가 "표본 부족"으로 나온다. 모델·횟수에 따라 값이 달라진다</text>
  <text class="note" x="60" y="646">준비 — pip install -r 06_evaluation_set_defense_rate/requirements-scan.txt · ollama serve · ollama pull qwen2.5:3b</text>
  <text class="note" x="60" y="668">모델을 쓸 수 없으면 ①~④ 를 건너뛰고 ⑤⑥ 을 예제(data/scan_examples/)로 실행한다. 같은 모델·시나리오라야 비교가 된다</text>
  <text class="foot" x="60" y="694">AI Red Team · 6-6</text>
  <text class="foot" x="1220" y="694" text-anchor="end">17 / 29</text>
</svg>
