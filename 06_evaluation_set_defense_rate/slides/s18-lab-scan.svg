<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 0 · 내 모델로 직접 측정</title>
  <desc id="d">스캐너로 내 모델을 측정하고 평가셋 도구 입력으로 변환하는 순서와 주의.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-6</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 0 · 스캐너를 실행해 직접 측정</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">measure.py 가 스캐너를 매번 실행하고 평가셋 지표까지 낸다 (Ollama 필요)</text>
  <circle class="circ" cx="84" cy="232" r="16"/>
  <text class="circt" x="84" y="238" text-anchor="middle">1</text>
  <rect class="cmdbg" x="116" y="185" width="640" height="94" rx="8"/>
  <text class="cmd" x="132" y="216" text-anchor="start" style="font-size:15px">pip install -r 06_evaluation_set_defense_rate/requirements-scan.txt</text>
  <text class="cmd" x="132" y="238" text-anchor="start" style="font-size:15px">ollama serve         # 별도 터미널에서 계속 실행</text>
  <text class="cmd" x="132" y="260" text-anchor="start" style="font-size:15px">ollama pull qwen2.5:3b</text>
  <text class="bsm" x="776" y="237" text-anchor="start" style="font-size:15px">준비 — 처음 한 번. 패키지가 무겁고 모델은 약 2GB</text>
  <circle class="circ" cx="84" cy="314" r="16"/>
  <text class="circt" x="84" y="320" text-anchor="middle">2</text>
  <rect class="cmdbg" x="116" y="289" width="640" height="50" rx="8"/>
  <text class="cmd" x="132" y="320" text-anchor="start" style="font-size:15px">python 06_evaluation_set_defense_rate/src/run/measure.py --quick</text>
  <text class="bsm" x="776" y="319" text-anchor="start" style="font-size:15px">스캔 4번을 매번 실행 → 변환 → 지표·게이트 (빠르게, 약 10분 이내)</text>
  <circle class="circ" cx="84" cy="374" r="16"/>
  <text class="circt" x="84" y="380" text-anchor="middle">3</text>
  <rect class="cmdbg" x="116" y="349" width="640" height="50" rx="8"/>
  <text class="cmd" x="132" y="380" text-anchor="start" style="font-size:15px">python 06_evaluation_set_defense_rate/src/run/measure.py</text>
  <text class="bsm" x="776" y="379" text-anchor="start" style="font-size:15px">전체 측정 (횟수가 많아 훨씬 오래 걸리고 구간이 좁다)</text>
  <circle class="circ" cx="84" cy="445" r="16"/>
  <text class="circt" x="84" y="451" text-anchor="middle">4</text>
  <rect class="cmdbg" x="116" y="409" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="440" text-anchor="start" style="font-size:15px">python 06_evaluation_set_defense_rate/src/run/measure.py --quick</text>
  <text class="cmd" x="132" y="462" text-anchor="start" style="font-size:15px">  --max-asr 0.2 --max-fpr 0.1 --out-dir results</text>
  <text class="bsm" x="776" y="450" text-anchor="start" style="font-size:15px">게이트 기준·저장 폴더를 바꿀 때 (기본값이 이 값)</text>
  <rect class="box ok" x="60" y="495" width="1160" height="82" rx="10"/>
  <text class="tag" x="78" y="519" text-anchor="start">measure.py 가 하는 일</text>
  <text class="bsm" x="78" y="543" text-anchor="start" style="font-size:15px">scan_pyrit·scan_garak 을 각각 방어 없음/GUARD=1 로 실행(4번) → from_scan 변환 → evalset 지표. 기준선과 방어 후 결과가 두 벌 나온다.</text>
  <text class="bsm" x="78" y="565" text-anchor="start" style="font-size:15px">예제 기록은 쓰지 않는다. Ollama 가 준비되지 않았으면 스캔 전에 멈춘다. 중간 결과는 results/ch06-*.json 에 남는다.</text>
  <rect class="box key" x="60" y="587" width="1160" height="58" rx="10"/>
  <text class="tag" x="78" y="609" text-anchor="start">주의</text>
  <text class="bsm" x="78" y="632" text-anchor="start" style="font-size:15px">--quick 은 시도가 적어 신뢰구간이 매우 넓다("표본 부족"이 나올 수 있다). 스캐너를 하나씩 돌리는 방법은 s17 흐름도와 readme 에 있다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-6</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">18 / 27</text>
</svg>
