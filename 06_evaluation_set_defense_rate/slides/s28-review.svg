  <text class="circt" x="84" y="279.0" text-anchor="middle">2</text>
  <text class="body" x="120" y="280.0" text-anchor="start">공격 200건 중 170건 차단, 정상 100건 중 8건 오차단이라면 방어율·ASR·오탐률은?</text>
