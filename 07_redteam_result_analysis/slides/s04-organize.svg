      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">결과 정리와 분류</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">수백 건의 로그를 의사결정 가능한 형태로 줄인다</text>
  <rect class="box" x="60" y="190" width="270" height="200" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">중복 제거·군집화</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start">같은 원인의 성공 사례를 하나의</text>
  <text class="bsm" x="78" y="304.8" text-anchor="start">발견 사항으로 묶는다</text>
  <line class="arrow" x1="333" y1="290.0" x2="354" y2="290.0"/>
  <polygon class="head" points="354,290.0 345.9,293.9 345.9,286.1"/>
  <rect class="box" x="357" y="190" width="270" height="200" rx="10"/>
  <text class="tag" x="375" y="218.0" text-anchor="start">2단계</text>
  <text class="cname" x="375" y="248.0" text-anchor="start">오탐 제거</text>
  <text class="bsm" x="375" y="280.0" text-anchor="start">자동 판정(6-5)의 잘못된</text>
  <text class="bsm" x="375" y="304.8" text-anchor="start">성공을 사람이 검토해 제외</text>
  <line class="arrow" x1="630" y1="290.0" x2="650" y2="290.0"/>
  <polygon class="head" points="650,290.0 641.9,293.9 641.9,286.1"/>
  <rect class="box key" x="654" y="190" width="270" height="200" rx="10"/>
  <text class="tag" x="672" y="218.0" text-anchor="start">3단계</text>
  <text class="cname" x="672" y="248.0" text-anchor="start">재현 확인</text>
  <text class="bsm" x="672" y="280.0" text-anchor="start">다시 실행해 재현율(성공 ÷</text>
  <text class="bsm" x="672" y="304.8" text-anchor="start">시도)을 확인</text>
  <line class="arrow" x1="926" y1="290.0" x2="947" y2="290.0"/>
  <polygon class="head" points="947,290.0 938.9,293.9 938.9,286.1"/>
  <rect class="box" x="950" y="190" width="270" height="200" rx="10"/>
  <text class="tag" x="968" y="218.0" text-anchor="start">4단계</text>
  <text class="cname" x="968" y="248.0" text-anchor="start">분류</text>
  <text class="bsm" x="968" y="280.0" text-anchor="start">공격 유형과 영향 자산별로 태깅</text>
  <rect class="box key" x="60" y="430" width="1160" height="180" rx="10"/>
  <text class="tag" x="78" y="458.0" text-anchor="start">패턴 도출</text>
  <text class="bsm" x="78" y="488.0" text-anchor="start">성공한 공격에서 공통 패턴을 찾는다. 예: 특정 인코딩에서만 우회됨, 멀티턴 5턴 이후 방어 약화, 외부 문서 경유 시에만 성공.</text>
  <text class="bsm" x="78" y="512.8" text-anchor="start">패턴은 개별 프롬프트 차단이 아닌 구조적 대책의 근거가 된다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">4 / 24</text>
</svg>
