<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">근본 원인 분석 (RCA)</title>
  <desc id="d">원인 범주별 예시와 관련 위험.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">근본 원인 분석 (RCA)</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">왜 뚫렸는가를 규명한다</text>
  <rect class="th" x="60" y="190" width="270" height="44"/>
  <rect class="th" x="330" y="190" width="600" height="44"/>
  <rect class="th" x="930" y="190" width="290" height="44"/>
  <text class="thtxt" x="74" y="218.0" text-anchor="start">원인 범주</text>
  <text class="thtxt" x="344" y="218.0" text-anchor="start">예시</text>
  <text class="thtxt" x="944" y="218.0" text-anchor="start">관련 위험</text>
  <rect class="td1" x="60" y="234" width="270" height="44"/>
  <text class="tdb" x="74" y="262.0" text-anchor="start">프롬프트 설계</text>
  <rect class="td1" x="330" y="234" width="600" height="44"/>
  <text class="tdtxt" x="344" y="262.0" text-anchor="start">시스템 프롬프트가 모호하거나 지시/데이터 구분이 없음</text>
  <rect class="td1" x="930" y="234" width="290" height="44"/>
  <text class="tdtxt" x="944" y="262.0" text-anchor="start">LLM01</text>
  <rect class="td2" x="60" y="278" width="270" height="44"/>
  <text class="tdb" x="74" y="306.0" text-anchor="start">입출력 통제 부재</text>
  <rect class="td2" x="330" y="278" width="600" height="44"/>
  <text class="tdtxt" x="344" y="306.0" text-anchor="start">입력 필터·출력 검증 없음, 인코딩 입력 미처리</text>
  <rect class="td2" x="930" y="278" width="290" height="44"/>
  <text class="tdtxt" x="944" y="306.0" text-anchor="start">LLM01, LLM05</text>
  <rect class="td1" x="60" y="322" width="270" height="44"/>
  <text class="tdb" x="74" y="350.0" text-anchor="start">접근 통제(ACL) 부재</text>
  <rect class="td1" x="330" y="322" width="600" height="44"/>
  <text class="tdtxt" x="344" y="350.0" text-anchor="start">사용자 권한과 무관하게 검색·도구 실행</text>
  <rect class="td1" x="930" y="322" width="290" height="44"/>
  <text class="tdtxt" x="944" y="350.0" text-anchor="start">LLM02, LLM06</text>
  <rect class="td2" x="60" y="366" width="270" height="44"/>
  <text class="tdb" x="74" y="394.0" text-anchor="start">권한 과다</text>
  <rect class="td2" x="330" y="366" width="600" height="44"/>
  <text class="tdtxt" x="344" y="394.0" text-anchor="start">도구·API에 필요 이상의 권한</text>
  <rect class="td2" x="930" y="366" width="290" height="44"/>
  <text class="tdtxt" x="944" y="394.0" text-anchor="start">LLM06</text>
  <rect class="td1" x="60" y="410" width="270" height="44"/>
  <text class="tdb" x="74" y="438.0" text-anchor="start">데이터·검색 계층</text>
  <rect class="td1" x="330" y="410" width="600" height="44"/>
  <text class="tdtxt" x="344" y="438.0" text-anchor="start">벡터 DB에 문서 단위 권한 없음, 오염된 문서 유입</text>
  <rect class="td1" x="930" y="410" width="290" height="44"/>
  <text class="tdtxt" x="944" y="438.0" text-anchor="start">LLM04, LLM08</text>
  <rect class="td2" x="60" y="454" width="270" height="44"/>
  <text class="tdb" x="74" y="482.0" text-anchor="start">모델 한계</text>
  <rect class="td2" x="330" y="454" width="600" height="44"/>
  <text class="tdtxt" x="344" y="482.0" text-anchor="start">안전 정렬이 특정 표현·언어·맥락에서 일반화되지 않음</text>
  <rect class="td2" x="930" y="454" width="290" height="44"/>
  <text class="tdtxt" x="944" y="482.0" text-anchor="start">탈옥</text>
  <rect class="td1" x="60" y="498" width="270" height="44"/>
  <text class="tdb" x="74" y="526.0" text-anchor="start">모니터링 부재</text>
  <rect class="td1" x="330" y="498" width="600" height="44"/>
  <text class="tdtxt" x="344" y="526.0" text-anchor="start">비정상 요청·외부 통신을 탐지하지 못함</text>
  <rect class="td1" x="930" y="498" width="290" height="44"/>
  <text class="tdtxt" x="944" y="526.0" text-anchor="start">탐지 공백</text>
  <text class="bsm" x="60" y="564.0" text-anchor="start">RCA는 "무엇이 뚫렸는가"가 아니라 "왜 뚫렸는가"를 규명한다. 증상이 아니라 원인에 대응해야 재발이 막힌다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">5 / 23</text>
</svg>
