  <text class="cname" x="375" y="248.0" text-anchor="start">왜?</text>
  <text class="bsm" x="375" y="280.0" text-anchor="start">검색 결과에 해당 문서가 포함됨</text>
  <line class="arrow" x1="630" y1="290.0" x2="650" y2="290.0"/>
  <polygon class="head" points="650,290.0 641.9,293.9 641.9,286.1"/>
  <rect class="box" x="654" y="190" width="270" height="200" rx="10"/>
  <text class="tag" x="672" y="218.0" text-anchor="start">3단계</text>
  <text class="cname" x="672" y="248.0" text-anchor="start">왜?</text>
  <text class="bsm" x="672" y="280.0" text-anchor="start">벡터 검색이 사용자 권한을</text>
  <text class="bsm" x="672" y="304.8" text-anchor="start">고려하지 않음</text>
  <line class="arrow" x1="926" y1="290.0" x2="947" y2="290.0"/>
  <polygon class="head" points="947,290.0 938.9,293.9 938.9,286.1"/>
  <rect class="box key" x="950" y="190" width="270" height="200" rx="10"/>
  <text class="tag" x="968" y="218.0" text-anchor="start">4단계</text>
  <text class="cname" x="968" y="248.0" text-anchor="start">왜?</text>
  <text class="bsm" x="968" y="280.0" text-anchor="start">인덱싱 시 접근 권한</text>
  <text class="bsm" x="968" y="304.8" text-anchor="start">메타데이터가 없음</text>
  <rect class="box key" x="60" y="430" width="1160" height="160" rx="10"/>
  <text class="tag" x="78" y="458.0" text-anchor="start">근본 원인</text>
  <text class="cname" x="78" y="488.0" text-anchor="start">RAG 계층의 문서 단위 ACL 부재</text>
  <text class="bsm" x="78" y="520.0" text-anchor="start">"특정 프롬프트를 필터에 추가한다"는 증상 차단이다. 근본 원인인 ACL을 고쳐야 같은 유형이 재발하지 않는다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
