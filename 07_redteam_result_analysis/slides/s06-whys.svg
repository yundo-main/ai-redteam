  <line class="arrow" x1="333" y1="290.0" x2="354" y2="290.0"/>
  <polygon class="head" points="354,290.0 345.9,293.9 345.9,286.1"/>
  <rect class="box" x="357" y="190" width="270" height="200" rx="10"/>
