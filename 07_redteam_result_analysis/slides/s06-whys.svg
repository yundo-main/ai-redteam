  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">기법: 5 Whys</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">증상이 아니라 원인에 대응한다</text>
