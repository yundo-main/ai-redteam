  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">개선안: 통제 계층</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">구조적 통제를 우선한다</text>
  <rect class="th" x="60" y="190" width="250" height="44"/>
  <rect class="th" x="310" y="190" width="910" height="44"/>
  <text class="thtxt" x="74" y="218.0" text-anchor="start">계층</text>
  <text class="thtxt" x="324" y="218.0" text-anchor="start">개선 예시</text>
  <rect class="td1" x="60" y="234" width="250" height="44"/>
  <text class="tdb" x="74" y="262.0" text-anchor="start">프롬프트</text>
  <rect class="td1" x="310" y="234" width="910" height="44"/>
  <text class="tdtxt" x="324" y="262.0" text-anchor="start">시스템 프롬프트 재설계, 지시/데이터 구분자 명확화, 민감 정보를 프롬프트에 넣지 않기</text>
  <rect class="td2" x="60" y="278" width="250" height="44"/>
  <text class="tdb" x="74" y="306.0" text-anchor="start">가드레일</text>
  <rect class="td2" x="310" y="278" width="910" height="44"/>
  <text class="tdtxt" x="324" y="306.0" text-anchor="start">입력 필터, 출력 검증, 안전 분류기 모듈 추가</text>
  <rect class="td1" x="60" y="322" width="250" height="44"/>
  <text class="tdb" x="74" y="350.0" text-anchor="start">데이터·RAG</text>
  <rect class="td1" x="310" y="322" width="910" height="44"/>
  <text class="tdtxt" x="324" y="350.0" text-anchor="start">벡터 DB 문서 단위 ACL, 인덱싱 시 출처 검증·정제</text>
  <rect class="td2" x="60" y="366" width="250" height="44"/>
  <text class="tdb" x="74" y="394.0" text-anchor="start">에이전트·도구</text>
  <rect class="td2" x="310" y="366" width="910" height="44"/>
  <text class="tdtxt" x="324" y="394.0" text-anchor="start">최소 권한, 인자 검증(Function Calling Sanity Check), 고위험 행동의 사람 승인</text>
  <rect class="td1" x="60" y="410" width="250" height="44"/>
  <text class="tdb" x="74" y="438.0" text-anchor="start">클라이언트·네트워크</text>
  <rect class="td1" x="310" y="410" width="910" height="44"/>
  <text class="tdtxt" x="324" y="438.0" text-anchor="start">출력 URL 허용 목록, 이미지 프록시, 외부 통신 제한</text>
  <rect class="td2" x="60" y="454" width="250" height="44"/>
  <text class="tdb" x="74" y="482.0" text-anchor="start">모니터링</text>
  <rect class="td2" x="310" y="454" width="910" height="44"/>
  <text class="tdtxt" x="324" y="482.0" text-anchor="start">비정상 패턴·외부 요청 탐지, 로깅</text>
  <rect class="td1" x="60" y="498" width="250" height="44"/>
  <text class="tdb" x="74" y="526.0" text-anchor="start">모델</text>
  <rect class="td1" x="310" y="498" width="910" height="44"/>
  <text class="tdtxt" x="324" y="526.0" text-anchor="start">안전 튜닝 강화, 모델 교체·버전 고정</text>
  <text class="bsm" x="60" y="564.0" text-anchor="start">우선순위: 개별 프롬프트를 막는 증상 차단보다 구조적 통제(권한·ACL·신뢰 경계)가 효과가 크고 오래간다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">9 / 24</text>
