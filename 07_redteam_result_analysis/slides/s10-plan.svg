  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">개선안: 단계별 이행 계획</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">담당자·기한·검증 방법을 함께 지정한다</text>
  <rect class="box" x="60" y="190" width="373" height="230" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">이행 계획</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">단기 (즉시~수주)</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start">긴급 완화, 빠른 적용. 예: 출력 URL 차단,</text>
  <text class="bsm" x="78" y="304.8" text-anchor="start">위험 도구 비활성화, 필터 규칙 추가</text>
  <rect class="box" x="453" y="190" width="373" height="230" rx="10"/>
  <text class="tag" x="471" y="218.0" text-anchor="start">이행 계획</text>
  <text class="cname" x="471" y="248.0" text-anchor="start">중기 (수주~수개월)</text>
  <text class="bsm" x="471" y="280.0" text-anchor="start">구조 개선. 예: 벡터 DB ACL, 가드레일 모듈</text>
  <text class="bsm" x="471" y="304.8" text-anchor="start">도입, 도구 권한 재설계</text>
  <rect class="box" x="846" y="190" width="373" height="230" rx="10"/>
  <text class="tag" x="864" y="218.0" text-anchor="start">이행 계획</text>
  <text class="cname" x="864" y="248.0" text-anchor="start">장기 (수개월 이상)</text>
  <text class="bsm" x="864" y="280.0" text-anchor="start">체계·문화. 예: 평가셋 기반 CI 게이트, 정기</text>
  <text class="bsm" x="864" y="304.8" text-anchor="start">레드팀, 설계 단계 위협 모델링</text>
  <rect class="box key" x="60" y="450" width="1160" height="120" rx="10"/>
  <text class="tag" x="78" y="478.0" text-anchor="start">각 개선 항목에 지정한다</text>
  <text class="bsm" x="78" y="508.0" text-anchor="start">담당자, 기한, 검증 방법</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">10 / 23</text>
