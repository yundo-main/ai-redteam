      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">잔여 위험</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">남는 위험은 책임자가 처리 방식을 결정한다</text>
  <text class="body" x="60" y="195.0" text-anchor="start">모든 위험을 완전히 제거할 수는 없다(특히 확률적 모델). 개선 후에도 남는 잔여 위험을 식별하고, 처리 방식을 책임자가 결정해</text>
  <text class="body" x="60" y="225.4" text-anchor="start">문서화한다.</text>
  <rect class="box" x="60" y="275.8" width="373" height="200" rx="10"/>
  <text class="tag" x="78" y="303.8" text-anchor="start">처리 방식</text>
  <text class="cname" x="78" y="333.8" text-anchor="start">수용</text>
  <text class="bsm" x="78" y="365.8" text-anchor="start">위험을 알고 그대로 둔다</text>
  <rect class="box" x="453" y="275.8" width="373" height="200" rx="10"/>
  <text class="tag" x="471" y="303.8" text-anchor="start">처리 방식</text>
  <text class="cname" x="471" y="333.8" text-anchor="start">이전</text>
  <text class="bsm" x="471" y="365.8" text-anchor="start">보험·계약 등으로 위험을 옮긴다</text>
  <rect class="box key" x="846" y="275.8" width="373" height="200" rx="10"/>
  <text class="tag" x="864" y="303.8" text-anchor="start">처리 방식</text>
  <text class="cname" x="864" y="333.8" text-anchor="start">추가 완화</text>
  <text class="bsm" x="864" y="365.8" text-anchor="start">통제를 더해 위험을 더 낮춘다</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">11 / 23</text>
