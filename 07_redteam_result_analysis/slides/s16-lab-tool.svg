<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 1 · 보고서 생성 도구 실행</title>
  <desc id="d">report.py 실행 명령과 독자별 포함 절.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 1 · 보고서 생성 도구 실행</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">예제 결과(results/example)에서 보고서 초안을 만든다. -o 저장 시 이전 보고서는 history/에 보관</text>
  <circle class="circ" cx="84" cy="221" r="16"/>
  <text class="circt" x="84" y="227.0" text-anchor="middle">1</text>
  <rect class="cmdbg" x="116" y="185" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="216.0" text-anchor="start">python 07_redteam_result_analysis/src/report.py</text>
  <text class="cmd" x="132" y="238.0" text-anchor="start">  results/example/ch03.json -o results/report.md</text>
  <text class="bsm" x="776" y="207.0" text-anchor="start">전체 보고서 초안 (결과에 가설이 있으면 가설 대비 포함)</text>
  <circle class="circ" cx="84" cy="301" r="16"/>
  <text class="circt" x="84" y="307.0" text-anchor="middle">2</text>
  <rect class="cmdbg" x="116" y="265" width="640" height="72" rx="8"/>
  <text class="cmd" x="132" y="296.0" text-anchor="start">python 07_redteam_result_analysis/src/report.py</text>
  <text class="cmd" x="132" y="318.0" text-anchor="start">  results/example/ch03.json --audience exec</text>
  <text class="bsm" x="776" y="287.0" text-anchor="start">경영진용: 요약·의사결정만</text>
  <circle class="circ" cx="84" cy="392" r="16"/>
  <text class="circt" x="84" y="398.0" text-anchor="middle">3</text>
  <rect class="cmdbg" x="116" y="345" width="640" height="94" rx="8"/>
  <text class="cmd" x="132" y="376.0" text-anchor="start">python 07_redteam_result_analysis/src/report.py</text>
  <text class="cmd" x="132" y="398.0" text-anchor="start">  results/example/ch03.json --baseline</text>
  <text class="cmd" x="132" y="420.0" text-anchor="start">  results/example/ch03_results.json</text>
  <text class="bsm" x="776" y="367.0" text-anchor="start">개선 전후 재검증 비교표 포함</text>
  <rect class="th" x="60" y="453" width="250" height="44"/>
  <rect class="th" x="310" y="453" width="910" height="44"/>
  <text class="thtxt" x="74" y="481.0" text-anchor="start">독자 (--audience)</text>
  <text class="thtxt" x="324" y="481.0" text-anchor="start">포함 절</text>
  <rect class="td1" x="60" y="497" width="250" height="44"/>
  <text class="tdb" x="74" y="525.0" text-anchor="start">exec 경영진</text>
  <rect class="td1" x="310" y="497" width="910" height="44"/>
  <text class="tdtxt" x="324" y="525.0" text-anchor="start">요약, 의사결정 사항</text>
  <rect class="td2" x="60" y="541" width="250" height="44"/>
  <text class="tdb" x="74" y="569.0" text-anchor="start">dev 개발·보안팀</text>
  <rect class="td2" x="310" y="541" width="910" height="44"/>
  <text class="tdtxt" x="324" y="569.0" text-anchor="start">발견 사항, 개선 권고, 잔여 위험, 부록</text>
  <rect class="td1" x="60" y="585" width="250" height="44"/>
  <text class="tdb" x="74" y="613.0" text-anchor="start">audit 감사·규제</text>
  <rect class="td1" x="310" y="585" width="910" height="44"/>
  <text class="tdtxt" x="324" y="613.0" text-anchor="start">범위·방법(ROE), 발견 사항(재현·증거), 잔여 위험·한계, 부록</text>
  <rect class="td2" x="60" y="629" width="250" height="44"/>
  <text class="tdb" x="74" y="657.0" text-anchor="start">all (기본)</text>
  <rect class="td2" x="310" y="629" width="910" height="44"/>
  <text class="tdtxt" x="324" y="657.0" text-anchor="start">요약, 범위·방법, 발견 사항, 개선 권고, 잔여 위험, 부록</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">16 / 23</text>
</svg>
