<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">실습 2 · 도구와 사람의 역할</title>
  <desc id="d">도구가 채우는 것, 사람이 채우는 것, 증거 마스킹, 한계.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>
  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">실습 2 · 도구와 사람의 역할</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">결과물은 항상 초안이다</text>
  <rect class="box" x="60" y="190" width="570" height="230" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">보고서 생성 도구</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">도구가 채우는 것</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start">성공률과 95% 신뢰구간, 심각도 등급, 재현</text>
  <text class="bsm" x="78" y="304.8" text-anchor="start">정보(모델·횟수·seed·temperature), 증거 요약, 통제 지점별 권고</text>
  <text class="bsm" x="78" y="329.6" text-anchor="start">초안, 재검증 비교표, 가설 대비 결과(발견 사항 행·요약 한 줄·부록</text>
  <text class="bsm" x="78" y="354.4" text-anchor="start">점검표). 빗나간 항목의 이유는 사람이 쓴다</text>
  <rect class="box key" x="650" y="190" width="570" height="230" rx="10"/>
  <text class="tag" x="668" y="218.0" text-anchor="start">보고서 생성 도구</text>
  <text class="cname" x="668" y="248.0" text-anchor="start">사람이 채우는 것</text>
  <text class="bsm" x="668" y="280.0" text-anchor="start">근본 원인의 최종 판단, 개선 담당자·기한, 잔여 위험의 수용·이전·추가</text>
  <text class="bsm" x="668" y="304.8" text-anchor="start">완화 결정. "분석가 검토 필요" 또는 "미지정"으로 비워 두므로 결과물은</text>
  <text class="bsm" x="668" y="329.6" text-anchor="start">항상 초안이다.</text>
  <rect class="box" x="60" y="440" width="570" height="230" rx="10"/>
  <text class="tag" x="78" y="468.0" text-anchor="start">보고서 생성 도구</text>
  <text class="cname" x="78" y="498.0" text-anchor="start">증거와 마스킹</text>
  <text class="bsm" x="78" y="530.0" text-anchor="start">도구 이름, 거부 사유, 위반 턴 같은 실행 기록 요약만 싣고 이메일은</text>
  <text class="bsm" x="78" y="554.8" text-anchor="start">마스킹한다. 모델 원본 응답과 입력 본문은 싣지 않는다.</text>
  <rect class="box" x="650" y="440" width="570" height="230" rx="10"/>
  <text class="tag" x="668" y="468.0" text-anchor="start">보고서 생성 도구</text>
  <text class="cname" x="668" y="498.0" text-anchor="start">한계</text>
  <text class="bsm" x="668" y="530.0" text-anchor="start">변환 도구는 03장 하네스 기록(TA/JB)만 지원한다. 04·05장 평가</text>
  <text class="bsm" x="668" y="554.8" text-anchor="start">그래프 결과와 연쇄(Exploit Chain) 항목의 별도 평가는 자동화하지</text>
  <text class="bsm" x="668" y="579.6" text-anchor="start">않았다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">18 / 24</text>
</svg>
