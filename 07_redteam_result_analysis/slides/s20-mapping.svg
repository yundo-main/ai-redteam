  <rect class="td1" x="580" y="493" width="640" height="44"/>
  <text class="tdtxt" x="594" y="521.0" text-anchor="start">보고서의 범위와 ROE 준수 여부</text>
  <text class="bsm" x="60" y="559.0" text-anchor="start">연쇄(Exploit Chain)의 발견 사항은 개별 심각도를 합산하지 않고 연쇄 전체의 영향을 별도 항목으로 평가한다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
