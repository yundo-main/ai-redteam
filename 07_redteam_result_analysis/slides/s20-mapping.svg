  <rect class="td1" x="580" y="317" width="640" height="44"/>
  <text class="tdtxt" x="594" y="345.0" text-anchor="start">실행한 단계와 환경 버전</text>
  <rect class="td2" x="60" y="361" width="300" height="44"/>
  <text class="tdb" x="74" y="389.0" text-anchor="start">성공 조건·증거</text>
  <rect class="td2" x="360" y="361" width="220" height="44"/>
