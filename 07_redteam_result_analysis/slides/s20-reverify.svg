  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">6-7</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">재검증과 지속 개선</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">레드팀은 일회성이 아닌 순환 활동이다</text>
  <rect class="box" x="60" y="190" width="270" height="120" rx="10"/>
  <text class="tag" x="78" y="218.0" text-anchor="start">1단계</text>
  <text class="cname" x="78" y="248.0" text-anchor="start">공격</text>
  <text class="bsm" x="78" y="280.0" text-anchor="start"></text>
