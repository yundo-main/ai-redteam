  <polygon class="head" points="354,250.0 345.9,253.9 345.9,246.1"/>
  <rect class="box" x="357" y="190" width="270" height="120" rx="10"/>
  <text class="tag" x="375" y="218.0" text-anchor="start">2단계</text>
  <text class="cname" x="375" y="248.0" text-anchor="start">분석</text>
  <text class="bsm" x="375" y="280.0" text-anchor="start"></text>
  <line class="arrow" x1="630" y1="250.0" x2="650" y2="250.0"/>
  <polygon class="head" points="650,250.0 641.9,253.9 641.9,246.1"/>
  <rect class="box" x="654" y="190" width="270" height="120" rx="10"/>
  <text class="tag" x="672" y="218.0" text-anchor="start">3단계</text>
  <text class="cname" x="672" y="248.0" text-anchor="start">개선</text>
  <text class="bsm" x="672" y="280.0" text-anchor="start"></text>
  <line class="arrow" x1="926" y1="250.0" x2="947" y2="250.0"/>
  <polygon class="head" points="947,250.0 938.9,253.9 938.9,246.1"/>
  <rect class="box key" x="950" y="190" width="270" height="120" rx="10"/>
  <text class="tag" x="968" y="218.0" text-anchor="start">4단계</text>
  <text class="cname" x="968" y="248.0" text-anchor="start">재검증</text>
  <text class="bsm" x="968" y="280.0" text-anchor="start"></text>
  <rect class="box key" x="60" y="350" width="1160" height="260" rx="10"/>
  <text class="tag" x="78" y="378.0" text-anchor="start">재검증 원칙</text>
  <text class="bsm" x="78" y="408.0" text-anchor="start">1. 개선 적용 후 동일 시나리오·평가셋(6-6)으로 재테스트해 개선을 객관적으로 확인한다.</text>
  <text class="bsm" x="78" y="432.8" text-anchor="start">2. 새 통제가 정상 요청을 과도하게 막지 않는지(오탐률) 함께 점검한다.</text>
  <text class="bsm" x="78" y="457.6" text-anchor="start">3. 발견 사항을 평가셋에 편입해 회귀 테스트화한다.</text>
  <text class="bsm" x="78" y="482.4" text-anchor="start">4. 모델·프롬프트·도구가 바뀔 때마다 반복한다. 레드팀은 일회성이 아닌 순환 활동이다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 6-7</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">20 / 24</text>
</svg>
