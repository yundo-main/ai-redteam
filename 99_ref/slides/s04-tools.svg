      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>

  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">참고</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">도구 레퍼런스</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">실습에 쓰는 도구 — 역할과 쓰이는 일차</text>
  <rect class="th" x="60" y="200" width="1160" height="40" rx="6"/>
  <text class="thtxt" x="78" y="226" text-anchor="start">도구</text>
  <text class="thtxt" x="300" y="226" text-anchor="start">역할</text>
  <text class="thtxt" x="860" y="226" text-anchor="start">쓰이는 일차</text>
  <rect class="td1" x="60" y="240" width="1160" height="56" rx="0"/>
  <text class="tdb" x="78" y="276" text-anchor="start">Ollama</text>
  <text class="tdtxt" x="300" y="276" text-anchor="start">로컬 LLM 실행 — 모델·테스트 입력이 외부로 나가지 않게 한다</text>
  <text class="tdtxt" x="860" y="276" text-anchor="start">6-3 ~ 6-5 실습 전제</text>
  <rect class="td2" x="60" y="296" width="1160" height="56" rx="0"/>
  <text class="tdb" x="78" y="332" text-anchor="start">Garak</text>
  <text class="tdtxt" x="300" y="332" text-anchor="start">취약점 스캐너 — probe·detector로 공격 페이로드를 대량 전송</text>
  <text class="tdtxt" x="860" y="332" text-anchor="start">6-5</text>
  <rect class="td1" x="60" y="352" width="1160" height="56" rx="0"/>
  <text class="tdb" x="78" y="388" text-anchor="start">PyRIT</text>
  <text class="tdtxt" x="300" y="388" text-anchor="start">공격 시나리오 자동화 프레임워크</text>
  <text class="tdtxt" x="860" y="388" text-anchor="start">6-5</text>
  <rect class="td2" x="60" y="408" width="1160" height="56" rx="0"/>
  <text class="tdb" x="78" y="444" text-anchor="start">LangChain</text>
  <text class="tdtxt" x="300" y="444" text-anchor="start">모델 → 방어 체인, ACL 검색기 RAG 구성</text>
  <text class="tdtxt" x="860" y="444" text-anchor="start">6-4</text>
  <rect class="td1" x="60" y="464" width="1160" height="56" rx="0"/>
  <text class="tdb" x="78" y="500" text-anchor="start">LangGraph</text>
  <text class="tdtxt" x="300" y="500" text-anchor="start">평가 그래프 — 호출 → 방어 → 집계 → 합격 게이트</text>
  <text class="tdtxt" x="860" y="500" text-anchor="start">6-5</text>
  <text class="bsm" x="60" y="580" text-anchor="start">설치·실행 절차는 루트 readme.md의 "LLM 실행 가이드 (Ollama)" 절을 따른다.</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 참고자료</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">4 / 7</text>
