<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="t">명령 치트시트</title>
  <desc id="d">환경 준비 명령과 일차별 실행 명령 모음.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef3fb; stroke: #3b6fc4; stroke-width: 1.5; }
    .box.key { fill: #fdf0e3; stroke: #d27a1f; }
    .box.ok { fill: #e9f6ee; stroke: #2f8f5b; }
    .num { fill: #3b6fc4; font-size: 13px; font-weight: 700; }
    .name { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .sub { fill: #4a5568; font-size: 13px; }
    .arrow { stroke: #6b7686; stroke-width: 1.6; fill: none; }
    .head { fill: #6b7686; }
    .loop { stroke: #6b7686; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .title { fill: #1b2433; font-size: 18px; font-weight: 700; }
    .note { fill: #4a5568; font-size: 14px; }
    .stitle { fill: #1b2433; font-size: 40px; font-weight: 700; }
    .ssub { fill: #4a5568; font-size: 20px; }
    .chip { fill: #d64045; }
    .chiptxt { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .foot { fill: #8a94a3; font-size: 14px; }
    .c1 { fill: #3b6fc4; fill-opacity: .22; stroke: #3b6fc4; stroke-width: 1.5; }
    .c2 { fill: #d27a1f; fill-opacity: .22; stroke: #d27a1f; stroke-width: 1.5; }
    .c3 { fill: #2f8f5b; fill-opacity: .22; stroke: #2f8f5b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181f; }
      .box { fill: #1c2536; stroke: #7aa5ee; }
      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>

  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">참고</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">명령 치트시트</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">환경 준비와 일차별 실행 — 모든 명령은 저장소 루트에서</text>
  <text class="tag" x="78" y="222" text-anchor="start">환경 준비</text>
  <rect class="cmdbg" x="60" y="240" width="560" height="210" rx="10"/>
  <text class="cmd" x="78" y="276" text-anchor="start">source .venv/bin/activate</text>
  <text class="cmd" x="78" y="306" text-anchor="start">pip install -r requirements.txt</text>
  <text class="cmd" x="78" y="336" text-anchor="start">ollama serve</text>
  <text class="cmd" x="78" y="366" text-anchor="start">ollama pull qwen2.5:3b</text>
  <text class="cmd" x="78" y="396" text-anchor="start">python 03_jailbreak_tool_abuse_testing/src/llm.py</text>
  <text class="bsm" x="78" y="480" text-anchor="start">venv·패키지는 루트에 하나 · serve는 별도 터미널 · llm.py가 준비 확인</text>
  <text class="tag" x="668" y="222" text-anchor="start">일차별 실행</text>
  <rect class="cmdbg" x="650" y="240" width="570" height="370" rx="10"/>
  <text class="cmd" x="668" y="272" text-anchor="start">python 03_jailbreak_tool_abuse_testing/src/harness.py</text>
  <text class="cmd" x="668" y="297" text-anchor="start">    --hypothesis results/hypothesis-ch03.json</text>
  <text class="cmd" x="668" y="322" text-anchor="start">    --json results/ch03.json</text>
  <text class="cmd" x="668" y="347" text-anchor="start">python -W ignore -m unittest -v</text>
  <text class="cmd" x="668" y="372" text-anchor="start">    04_data_exfiltration_validation/src/test_chain.py</text>
  <text class="cmd" x="668" y="397" text-anchor="start">python -W ignore -m unittest -v</text>
  <text class="cmd" x="668" y="422" text-anchor="start">    05_garak_pyrit_automated_testing/src/test_graph.py</text>
  <text class="cmd" x="668" y="447" text-anchor="start">python 06_evaluation_set_defense_rate/src/run/evalset.py</text>
  <text class="cmd" x="668" y="472" text-anchor="start">    --max-asr 0.2 --max-fpr 0.1</text>
  <text class="cmd" x="668" y="497" text-anchor="start">python 07_redteam_result_analysis/src/run/</text>
  <text class="cmd" x="668" y="522" text-anchor="start">    from_harness.py results/ch03.json</text>
  <text class="cmd" x="668" y="547" text-anchor="start">    -o results/run.json</text>
  <text class="cmd" x="668" y="572" text-anchor="start">python 07_redteam_result_analysis/src/run/report.py</text>
  <text class="cmd" x="668" y="597" text-anchor="start">    results/run.json</text>
  <text class="bsm" x="60" y="655" text-anchor="start">모델 교체: OLLAMA_MODEL=llama3.2:3b python …   ·   QUICK=1은 반복 1/3 동작 확인용 — 통계 결론 아님</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 참고자료</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">5 / 7</text>
</svg>
