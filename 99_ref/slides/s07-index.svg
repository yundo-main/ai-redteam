      .box.key { fill: #33271a; stroke: #f0a45a; }
      .box.ok { fill: #14291e; stroke: #5fc58b; }
      .num { fill: #7aa5ee; }
      .name, .title, .stitle { fill: #eef1f6; }
      .ssub { fill: #aab3c2; }
      .foot { fill: #8a94a3; }
      .chip { fill: #e5656a; }
      .sub, .note { fill: #aab3c2; }
      .arrow, .loop { stroke: #8f9aab; }
      .head { fill: #8f9aab; }
      .c1 { fill: #7aa5ee; fill-opacity: .25; stroke: #7aa5ee; }
      .c2 { fill: #f0a45a; fill-opacity: .25; stroke: #f0a45a; }
      .c3 { fill: #5fc58b; fill-opacity: .25; stroke: #5fc58b; }
    }

    .body { fill: #1b2433; font-size: 19px; }
    .bsm { fill: #4a5568; font-size: 16px; }
    .cname { fill: #1b2433; font-size: 21px; font-weight: 700; }
    .tag { fill: #3b6fc4; font-size: 14px; font-weight: 700; }
    .red { fill: #d64045; }
    .th { fill: #0f1b2d; }
    .thtxt { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .td1 { fill: #eef3fb; stroke: #dde3ec; stroke-width: 1; }
    .td2 { fill: #ffffff; stroke: #dde3ec; stroke-width: 1; }
    .tdtxt { fill: #1b2433; font-size: 17px; }
    .tdb { fill: #1b2433; font-size: 17px; font-weight: 700; }
    .big { fill: #d64045; font-size: 26px; font-weight: 700; }
    .circ { fill: #d64045; }
    .circt { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .circg { fill: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      .body, .cname, .tdtxt, .tdb { fill: #eef1f6; }
      .bsm { fill: #aab3c2; }
      .tag { fill: #7aa5ee; }
      .red { fill: #e5656a; }
      .th { fill: #2a3a57; }
      .td1 { fill: #1c2536; stroke: #2a3447; }
      .td2 { fill: #14181f; stroke: #2a3447; }
      .big { fill: #e5656a; }
      .circ { fill: #e5656a; }
      .circg { fill: #5fc58b; }
    }
  
    .mono { fill: #1b2433; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .cmdbg { fill: #0f1b2d; }
    .cmd { fill: #e8eefb; font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .warn { fill: #fdf0e3; stroke: #d27a1f; stroke-width: 1.5; }
    .gtxt { fill: #2f8f5b; font-size: 14px; font-weight: 700; }
    .otxt { fill: #d27a1f; font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #eef1f6; }
      .cmdbg { fill: #0b0f16; }
      .warn { fill: #33271a; stroke: #f0a45a; }
      .gtxt { fill: #5fc58b; }
      .otxt { fill: #f0a45a; }
    }
  </style>

  <rect class="bg" width="1280" height="720"/>
  <rect class="chip" x="60" y="40" width="60" height="28" rx="14"/>
  <text class="chiptxt" x="90" y="60.0" text-anchor="middle">참고</text>
  <text class="stitle" x="60" y="118.0" text-anchor="start">용어·시나리오 색인</text>
  <text class="ssub" x="60" y="154.0" text-anchor="start">어디에 무엇이 있는가 — 용어 · 시나리오 ID · 파일 위치</text>
  <rect class="th" x="60" y="200" width="720" height="40" rx="6"/>
  <text class="thtxt" x="78" y="226" text-anchor="start">시나리오 ID</text>
  <text class="thtxt" x="220" y="226" text-anchor="start">내용</text>
  <text class="thtxt" x="640" y="226" text-anchor="start">일차</text>
  <rect class="td1" x="60" y="240" width="720" height="52" rx="0"/>
  <text class="tdb" x="78" y="274" text-anchor="start">TA-01</text>
  <text class="tdtxt" x="220" y="274" text-anchor="start">외부 문서 경유 도구 무단 실행</text>
  <text class="tdtxt" x="640" y="274" text-anchor="start">6-3</text>
  <rect class="td2" x="60" y="292" width="720" height="52" rx="0"/>
  <text class="tdb" x="78" y="326" text-anchor="start">JB-01</text>
  <text class="tdtxt" x="220" y="326" text-anchor="start">멀티턴 유도에 대한 정책 유지</text>
  <text class="tdtxt" x="640" y="326" text-anchor="start">6-3</text>
  <rect class="td1" x="60" y="344" width="720" height="52" rx="0"/>
  <text class="tdb" x="78" y="378" text-anchor="start">EX-01</text>
  <text class="tdtxt" x="220" y="378" text-anchor="start">Data Exfiltration 검증</text>
  <text class="tdtxt" x="640" y="378" text-anchor="start">6-4</text>
  <rect class="td2" x="60" y="396" width="720" height="52" rx="0"/>
  <text class="tdb" x="78" y="430" text-anchor="start">AU-01</text>
  <text class="tdtxt" x="220" y="430" text-anchor="start">자동화 검증 실행·해석</text>
  <text class="tdtxt" x="640" y="430" text-anchor="start">6-5</text>
  <rect class="box" x="810" y="200" width="410" height="260" rx="10"/>
  <text class="tag" x="828" y="228" text-anchor="start">용어 설명</text>
  <text class="bsm" x="828" y="262" text-anchor="start">용어는 각 일차 readme.md의</text>
  <text class="bsm" x="828" y="288" text-anchor="start">"부록. 용어 설명" 절에 있다.</text>
  <text class="bsm" x="828" y="330" text-anchor="start">슬라이드로는 각 일차의</text>
  <text class="bsm" x="828" y="356" text-anchor="start">sNN-glossary 장에 대응한다.</text>
  <text class="bsm" x="828" y="398" text-anchor="start">6-1 ~ 6-7 전 일차 부록.</text>
  <rect class="box" x="60" y="480" width="720" height="170" rx="10"/>
  <text class="tag" x="78" y="508" text-anchor="start">파일 위치</text>
  <text class="bsm" x="78" y="542" text-anchor="start">가설 예시: NN_일차/src/hypothesis.example.json (cp -n으로 복사)</text>
  <text class="bsm" x="78" y="572" text-anchor="start">워크시트: NN_일차/src/scenarios/chNN_*.json</text>
  <text class="bsm" x="78" y="602" text-anchor="start">실행 결과: results/ (예제는 results/example/, 읽기용)</text>
  <text class="bsm" x="78" y="632" text-anchor="start">가설 대조: NN_일차/src/hypothesis_log.py results/chNN.json</text>
  <text class="foot" x="60" y="694.0" text-anchor="start">AI Red Team · 참고자료</text>
  <text class="foot" x="1220" y="694.0" text-anchor="end">7 / 7</text>
